name: content_brief
version: 1
description: >
  Sequential supervisor plan: researcher (with optional outbound MCP tool) →
  analyst → ontology-driven template compose (writer/reviewer grounding).
template: synthesis_note
budgets:
  llm_tokens: 60000
  tool_calls: 40
  wall_seconds: 600
external_tools:
  - echo_cite
steps:
  - id: research
    agent: researcher
    goal_template: "Research the corpus for: {goal}"
    tools:
      - search
      - rag_query
      - ontology_query
      - document_get
      - echo_cite
    max_steps: 8
  - id: analyze
    agent: analyst
    goal_template: "Analyze ontology / KG facts for: {goal}"
    tools:
      - search
      - ontology_query
      - document_get
    max_steps: 6
  - id: deliverable
    compose:
      template: synthesis_note
      topic_from: topic
