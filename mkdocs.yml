# Project information
site_name: T-KEIR
site_description: 'Thales knowledge extraction to information retrieval'
site_author: 'Thales'
site_url: 'https://github.com/ThalesGroup/t-keir/'
nav:
    - Home: 'index.md'
    - Zero to Hero:
        - From zero to hero: 'zero_to_hero.md'
        - NLP: 'ready_to_run.md'
    - Overview: 'overview.md'
    - Architecture:
        - Overview & service topology: 'architecture/index.md'
        - Data flows & sequences: 'architecture/sequences.md'
        - Data model & schemas: 'architecture/data-model.md'
    - Conception: 'conception.md'
    - Installation: 'installation.md'
    - Dev Container: 'devcontainer.md'
    - Configuration:
        - Overview: 'configuration/index.md'
        - rag.yaml (passage retrieval): 'configuration/rag.yaml.md'
        - pipeline.yaml: 'configuration/pipeline.yaml.md'
        - mcp.yaml: 'configuration/mcp.yaml.md'
    - Deployment:
        - Profiles: 'deployment/index.md'
        - Environment variables: 'deployment/environment.md'
        - Compose (P1): 'deployment/compose.md'
        - Hybrid demo launcher (tmux): 'deployment/start_services.md'
        - Kubernetes (P2): 'deployment/k8s.md'
        - Token exchange (RFC 8693): 'deployment/token-exchange.md'
        - Ingestion (Phase 3): 'deployment/ingest.md'
        - Audit store (Phase 4): 'deployment/audit.md'
        - Governor (Phase 5): 'deployment/governor.md'
        - Secure cluster (P3): 'deployment/k8s-secure.md'
        - SPIRE / SPIFFE (agents): 'deployment/spire.md'
        - macOS notes: 'deployment/macos.md'
    - Evaluation:
        - Overview: 'evaluation.md'
        - BEIR report: 'evaluation_report.md'
        - Generation report: 'evaluation_generate_report.md'
    - Tools:
        - Tools overview: 'tools/tools_overview.md'
        - API reference: 'tools/api_reference.md'
        - Vespa RAG: 'tools/vespa_rag.md'
        - MCP server: 'tools/mcp.md'
        - Agents: 'tools/agents.md'
        - OKF export: 'tools/okf.md'
        - OKF SPEC (v0.2): 'okf/SPEC.md'
        - Templates: 'tools/templates.md'
        - Datasets & Ontologies: 'tools/datasets.md'
        - HMI: 'hmi.md'
        - Converter: 'tools/converter.md'
        - Tokenizer: 'tools/tokenizer.md'
        - Morphosyntactic tagger: 'tools/mstagger.md'
        - Named Entities Tagger: 'tools/nertagger.md'
        - Syntactic Tagger : 'tools/syntactictagger.md'
        - Keywords Extraction: 'tools/keywords.md'
        - Document ontology: 'tools/document_ontology.md'
    - Regularity component:
        - Identity of Action: 'regularity-component/action-identiy.md'
        - Mastering of Action: 'regularity-component/action-mastering.md'
    - Compliance:
        - Overview: 'compliance/index.md'
        - EU Compliance OPA Audit: 'compliance/eu-audit.md'
        - Compliance status (one page): 'compliance/status.md'
        - Latest audit results: 'compliance/latest-results.md'
        - Legal / reviewer checklist: 'compliance/legal-review-checklist.md'
        - CI and evidence pipeline: 'compliance/ci-evidence.md'
        - EU AI Act: 'compliance/ai-act.md'
        - CRA: 'compliance/cra.md'
        - NIS2: 'compliance/nis2.md'
        - DORA: 'compliance/dora.md'
        - GDPR: 'compliance/gdpr.md'
        - PLD: 'compliance/pld.md'
    - CI & reports:
        - Overview: 'ci/index.md'
        - GitHub Actions workflows: 'ci/workflows.md'
        - Reports catalog: 'ci/reports-catalog.md'
        - Quality gates: 'ci/gates.md'
    - Quality:
        - Code quality dashboard: 'quality/index.md'
    - Runbooks:
        - Overview: 'runbooks/index.md'
        - Kill switch: 'runbooks/kill-switch.md'
        - Agent runaway: 'runbooks/agent-runaway.md'
        - Injection incident: 'runbooks/injection-incident.md'
        - Retract generated: 'runbooks/retract-generated.md'
        - Incident: 'runbooks/incident.md'
        - Rollback: 'runbooks/rollback.md'
        - DSR (forget): 'runbooks/dsr.md'
    - Security: 'security.md'
    - Operation and Management: 'oam.md'
    - About: 'about.md'
plugins:
    - render_swagger
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - md_in_html
  - tables
  - attr_list

# Article tables are snippet sources only (included into regulation pages).
# ADRs stay in the repo for engineering but are not published until 2.0.0.
exclude_docs: |
  compliance/generated/**
  adr/**
  architecture/decisions.md

# Repository
repo_name: 'ThalesGroup/t-keir'
repo_url: 'https://github.com/ThalesGroup/t-keir/'

# Copyright
copyright: |
  Copyright &copy; 2022 THALES<br>

# Configuration
theme:
  name: 'material'
  language: 'en'
  palette:
    primary: 'indigo'
    accent: 'indigo'
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  features:
     - navigation.tabs

# Customization
extra:
  social:
    - icon: 'fontawesome/brands/github-alt'
      link: 'https://github.com/ThalesGroup'
