# Timing budgets distilled from smoke report medium/low alerts
# Use with a mocked PassageRetrievalPipeline (no live Vespa/HF in CI).
source_report: reports/beir/smoke/report.md
budgets:
  - id: perf-colbert-budget
    issue: slow_stage_colbert
    severity: medium
    symptom: ColBERT MaxSim avg >1.5s/query in smoke at top_m=40
    code_focus:
      - search/rerank.py ColBERT (1q×N) / eval/hybrid_retrieve.py batch
      - configs/rag.yaml dual_hybrid.colbert.top_m
    assert: colbert_ms_per_query < 1500 on fixture pool size<=20
    notes: >
      Defaults are top_m=40 / blend 0.55+0.45; ColBERT is query-time only.
      Do not load full FlagEmbedding ColBERT encode in CI unit tests.
  - id: perf-ontology-budget
    issue: slow_stage_ontology
    severity: low
    symptom: Ontology stage ~400–500ms/query
    code_focus:
      - ontology_scorer.py
      - query_expander.py max_terms_per_relation
    assert: ontology_ms_per_query < 400 with <=20 docs and small ontology
    notes: "Fixture: tiny ontology (5 concepts) + 10 docs with json_ld; measure scorer only."
