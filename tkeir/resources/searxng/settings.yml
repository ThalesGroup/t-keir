# SearXNG settings for T-KEIR web collector.
# Canonical copy: tkeir/resources/searxng/settings.yml
# Copied to workspace/searxng/config/settings.yml on `make searxng-up`
# (and `make pull-searxng`) when that file is missing.
# JSON format is required by tkeir-collector.
#
# Docs: https://docs.searxng.org/admin/settings/settings.html
# Engines: https://docs.searxng.org/admin/settings/settings_engines.html

# Inherit image defaults, but keep only engines useful for open-web OSINT collect
# (no API keys). Prefer general/news-friendly engines; avoid image/video/social.
#
# Dropped vs earlier template: qwant / mojeek / yahoo / seznam / currency / google
# (noisy, CAPTCHA-prone, or off-topic for OSINT). Wikipedia stays for encyclopedia hits.
#
# wikidata is omitted on purpose: its engine `init()` hits
# https://query.wikidata.org/sparql and often gets HTTP 403 from Docker /
# residential-blocked IPs, which leaves the processor unregistered and noisy
# logs.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - bing
      - startpage
      - wikipedia

general:
  instance_name: "tkeir-searxng"
  enable_metrics: false

search:
  # Strict SafeSearch — blocks adult results at engines that support it.
  safe_search: 2
  autocomplete: ""
  default_lang: "en"
  default_to_https: true
  formats:
    - html
    - json

server:
  # Bound inside the container; host maps WORKSPACE via docker -v.
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "tkeir-dev-change-me"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

# Explicit engine overrides (merged by `name` onto the keep_only set).
engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: bing
    disabled: false
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
