# T-KEIR third-party version lock.
#
# Every chart dependency and container base image used by deploy/ must be listed
# here before it is referenced from Dockerfiles, Compose, or Helm values.
# Digests are authoritative; tags are for humans and update commands.
#
# Update style (same as Makefile TRIVY_IMAGE):
#   docker pull <image:tag>
#   docker inspect --format='{{index .RepoDigests 0}}' <image:tag>
#
# Image registry for our own builds:
#   Local / Compose default: IMAGE_REGISTRY ?= local
#   Publish / CI:            IMAGE_REGISTRY ?= ghcr.io/thalesgroup/t-keir

schema_version: 1
updated: "2026-07-17"
registry:
  our_images_local: local
  our_images_publish: ghcr.io/thalesgroup/t-keir

