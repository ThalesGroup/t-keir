articles:
  Art.20(1):
    title: Governance
    text: "1. Member States shall ensure that the management bodies of essential and important entities\
      \ approve the cybersecurity risk-management measures taken by those entities in order to comply\
      \ with Article 21, oversee its implementation and can be held liable for infringements by the entities\
      \ of that Article.\n\n The application of this paragraph shall be without prejudice to national\
      \ law as regards the liability rules applicable to public institutions, as well as the liability\
      \ of public servants and elected or appointed officials."
    status: paragraph
  Art.20(2):
    title: Governance
    text: 2. Member States shall ensure that the members of the management bodies of essential and important
      entities are required to follow training, and shall encourage essential and important entities to
      offer similar training to their employees on a regular basis, in order that they gain sufficient
      knowledge and skills to enable them to identify risks and assess cybersecurity risk-management practices
      and their impact on the services provided by the entity.
    status: paragraph
  Art.20(3):
    title: Governance
    text: "1. Member States shall ensure that the management bodies of essential and important entities\
      \ approve the cybersecurity risk-management measures taken by those entities in order to comply\
      \ with Article 21, oversee its implementation and can be held liable for infringements by the entities\
