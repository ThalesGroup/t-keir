name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "deploy/images/**"
      - "tkeir/**"
      - "tkeir-hmi/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [tkeir-api, tkeir-indexer, tkeir-hmi, tkeir-ingest, tkeir-audit, tkeir-governor]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake image
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/t-keir
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx bake -f deploy/images/docker-bake.hcl \
            --set "*.platform=linux/amd64" \
            ${{ matrix.target }} \
            --progress=plain

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/t-keir
          IMAGE_TAG: ${{ github.sha }}
          COSIGN_YES: "true"
        run: |
          cosign sign --yes "${IMAGE_REGISTRY}/${{ matrix.target }}:${IMAGE_TAG}"
