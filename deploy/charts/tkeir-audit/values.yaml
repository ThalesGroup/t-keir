replicaCount: 1

image:
  repository: ghcr.io/thalesgroup/t-keir/tkeir-audit
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8093

postgres:
  enabled: true
  image: postgres:16-alpine
  database: audit
  username: audit
  password: audit
  storage: 10Gi

persistence:
  worm:
    enabled: true
    size: 20Gi
  hot:
    enabled: true
    size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

env:
  TKEIR_SERVICE: tkeir-audit
  TKEIR_ENV: dev
  AUDIT_AUTH_ENABLED: "false"
  AUDIT_SINK_MODE: hot

archiver:
  enabled: true
  schedule: "0 * * * *"

serviceAccount:
  create: true

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
