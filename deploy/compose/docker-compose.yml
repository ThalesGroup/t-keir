# T-KEIR Compose stack (P1+). Profiles: core, auth, ingest, audit, governor,
# observability, objectstore, mcp, agents, spire.
#
#   make compose-up PROFILES=core,auth,ingest,observability,objectstore,audit,governor,mcp,agents,spire
#   make compose-down
#
# macOS: run Ollama on the host (Metal):
#   export OLLAMA_BASE_URL=http://host.docker.internal:11434

name: tkeir

x-tkeir-build-args: &tkeir-build-args
  VERSION: ${VERSION:-0.0.0-dev}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  BUILD_DATE: ${BUILD_DATE:-}
  PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93}
  NODE_BASE: ${NODE_BASE:-node:22-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3}
  MODEL_MODE: ${MODEL_MODE:-fetch}

# Shared Python runtime — built once; api/ingest/mcp/agent/governor/audit
# reference it via additional_contexts (no per-service uv sync).
x-tkeir-from-lib: &tkeir-from-lib
  additional_contexts:
    tkeir-lib: "docker-image://${IMAGE_REGISTRY:-local}/tkeir-lib:${IMAGE_TAG:-dev}"

services:
  # Named volumes are created as root; services run as uid 10001. Fix ownership
  # before api/ingest/governor/agent start so kill-switch flags are writable.
  tkeir-volume-init:
    profiles: ["core", "ingest", "governor", "agents"]
    image: busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
    container_name: tkeir-volume-init
    user: "0:0"
    volumes:
      - governor_state:/var/tkeir/governor
      - ingest_data:/var/tkeir/ingest
      - agent_data:/var/tkeir/agent
    command:
      [
        "sh",
        "-c",
        "chown -R 10001:10001 /var/tkeir/governor /var/tkeir/ingest /var/tkeir/agent && echo volume-init-ok",
      ]
    networks: [tkeir]
    restart: "no"

  vespa:
    profiles: ["core"]
    image: vespaengine/vespa
    container_name: tkeir-vespa
    hostname: vespa
    ports:
      - "8080:8080"
      - "19071:19071"
    volumes:
      - vespa_data:/opt/vespa/var
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:19071/state/v1/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [tkeir]

  tkeir-api:
    profiles: ["core"]
    image: ${IMAGE_REGISTRY:-local}/tkeir-api:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.tkeir-api
      <<: *tkeir-from-lib
      args:
        <<: *tkeir-build-args
    container_name: tkeir-api
    environment:
      TKEIR_SERVICE: tkeir-api
      TKEIR_ENV: ${TKEIR_ENV:-dev}
      RAG_HOST: "0.0.0.0"
      RAG_PORT: "8090"
      VESPA_URL: http://vespa:8080
      VESPA_CONFIG_URL: http://vespa:19071
      VESPA_USER_SPACE: ${VESPA_USER_SPACE:-dev@tkeir}
      PROVIDER: ${PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      LLM_MODEL: ${LLM_MODEL:-mistral-nemo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AUDIT_SINK_MODE: ${AUDIT_SINK_MODE:-memory}
      AUDIT_HOT_STORE_URL: ${AUDIT_HOT_STORE_URL:-}
      GOVERNOR_MODE: ${GOVERNOR_MODE:-observe}
      GOVERNOR_STATE_ROOT: /var/tkeir/governor
      GOVERNOR_URL: ${GOVERNOR_URL:-http://tkeir-governor:8094}
    volumes:
      - governor_state:/var/tkeir/governor
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      tkeir-volume-init:
        condition: service_completed_successfully
      vespa:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8090/health >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 120s
    networks: [tkeir]

  tkeir-indexer:
    profiles: ["core"]
    image: ${IMAGE_REGISTRY:-local}/tkeir-indexer:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.tkeir-indexer
      args:
        <<: *tkeir-build-args
        INSTALL_OCR: "1"
        VARIANT: full
    container_name: tkeir-indexer
    environment:
      TKEIR_SERVICE: tkeir-indexer
      VESPA_URL: http://vespa:8080
      VESPA_CONFIG_URL: http://vespa:19071
      VESPA_USER_SPACE: ${VESPA_USER_SPACE:-dev@tkeir}
      PROVIDER: ${PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      LLM_MODEL: ${LLM_MODEL:-mistral-nemo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      PIPELINE_INPUT: /data/in
      PIPELINE_OUTPUT: /data/out
      INDEX_INPUT: /data/out
    volumes:
      - indexer_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      vespa:
        condition: service_healthy
    # Idle by default — run: docker compose run --rm tkeir-indexer pipeline-index
    command: ["help"]
    networks: [tkeir]
    restart: "no"

  tkeir-hmi:
    profiles: ["core"]
    image: ${IMAGE_REGISTRY:-local}/tkeir-hmi:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.tkeir-hmi
      args:
        <<: *tkeir-build-args
    container_name: tkeir-hmi
    environment:
      TKEIR_SERVICE: tkeir-hmi
      API_URL: http://tkeir-api:8090
      AGENT_URL: ${AGENT_URL:-http://tkeir-agent:8092}
      OKF_URL: ${OKF_URL:-http://tkeir-okf:8095}
      API_PROXY_TIMEOUT_MS: ${API_PROXY_TIMEOUT_MS:-300000}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_SECRET: ${AUTH_SECRET:-dev-auth-secret-change-me-in-production-32b}
      AUTH_KEYCLOAK_ID: tkeir-hmi
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER:-http://localhost:8082/realms/tkeir}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      GOVERNOR_URL: ${GOVERNOR_URL:-http://tkeir-governor:8094}
      AUDIT_URL: ${AUDIT_URL:-http://tkeir-audit:8093}
    ports:
      - "3000:3000"
    # Browser uses localhost:8082; container reaches published Keycloak via host-gateway.
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      tkeir-api:
        condition: service_healthy
    networks: [tkeir]

  tkeir-ingest:
    profiles: ["ingest"]
    image: ${IMAGE_REGISTRY:-local}/tkeir-ingest:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.tkeir-ingest
      <<: *tkeir-from-lib
      args:
        <<: *tkeir-build-args
    container_name: tkeir-ingest
    environment:
      TKEIR_SERVICE: tkeir-ingest
      TKEIR_ENV: ${TKEIR_ENV:-dev}
      INGEST_HOST: "0.0.0.0"
      INGEST_PORT: "8091"
      INGEST_ROOT: /var/tkeir/ingest
      INGEST_AUTH_ENABLED: ${INGEST_AUTH_ENABLED:-false}
      INGEST_DEV_TOKEN: ${INGEST_DEV_TOKEN:-}
      # Mounted host workspace (optional local mounts; OSINT ontologies live under datasets/osint/)
      TKEIR_WORKSPACE: /workspace
      VESPA_URL: http://vespa:8080
      VESPA_CONFIG_URL: http://vespa:19071
      VESPA_USER_SPACE: ${VESPA_USER_SPACE:-dev@tkeir}
      PROVIDER: ${PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      LLM_MODEL: ${LLM_MODEL:-mistral-nemo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GOVERNOR_MODE: ${GOVERNOR_MODE:-observe}
      GOVERNOR_STATE_ROOT: /var/tkeir/governor
      GOVERNOR_URL: ${GOVERNOR_URL:-http://tkeir-governor:8094}
    ports:
      - "8091:8091"
    volumes:
      - ingest_data:/var/tkeir/ingest
      - governor_state:/var/tkeir/governor
      - ${TKEIR_WORKSPACE_HOST:-../../workspace}:/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      tkeir-volume-init:
        condition: service_completed_successfully
      vespa:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8091/health >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 120s
    networks: [tkeir]

  tkeir-governor:
    profiles: ["governor"]
    image: ${IMAGE_REGISTRY:-local}/tkeir-governor:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.tkeir-governor
      <<: *tkeir-from-lib
      args:
        <<: *tkeir-build-args
    container_name: tkeir-governor
    environment:
      TKEIR_SERVICE: tkeir-governor
      GOVERNOR_HOST: "0.0.0.0"
      GOVERNOR_PORT: "8094"
      GOVERNOR_MODE: ${GOVERNOR_MODE:-observe}
      GOVERNOR_STATE_ROOT: /var/tkeir/governor
      GOVERNOR_AUTH_ENABLED: ${GOVERNOR_AUTH_ENABLED:-false}
      GOVERNOR_DEV_TOKEN: ${GOVERNOR_DEV_TOKEN:-}
    ports:
      - "8094:8094"
    volumes:
      - governor_state:/var/tkeir/governor
    depends_on:
      tkeir-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8094/health >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [tkeir]

  keycloak-db:
    profiles: ["auth"]
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: tkeir-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tkeir]

  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.7.0@sha256:2eb3cd316835c990e69e26ade292ffa78f6fb0db7d5fc6377463c162e1979ac0
    container_name: tkeir-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Dev/demo: plain HTTP on the host-mapped port (Keycloak 26 hostname v2).
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8082
      KC_HOSTNAME_ADMIN: http://localhost:8082
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/realm-tkeir.json:/opt/keycloak/data/import/realm-tkeir.json:ro
    ports:
      - "8082:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [tkeir]

  audit-db:
    profiles: ["audit"]
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: tkeir-audit-db
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}
    volumes:
      - audit_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tkeir]

  tkeir-audit:
    profiles: ["audit"]
    image: ${IMAGE_REGISTRY:-local}/tkeir-audit:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.tkeir-audit
      <<: *tkeir-from-lib
      args:
        <<: *tkeir-build-args
    container_name: tkeir-audit
    environment:
      TKEIR_SERVICE: tkeir-audit
      AUDIT_HOST: "0.0.0.0"
      AUDIT_PORT: "8093"
      AUDIT_HOT_STORE_URL: postgres://audit:${AUDIT_DB_PASSWORD:-audit}@audit-db:5432/audit
      AUDIT_WORM_ROOT: /var/tkeir/audit/worm
      AUDIT_WORM_S3_ENDPOINT: ${AUDIT_WORM_S3_ENDPOINT:-}
      AUDIT_WORM_S3_BUCKET: ${AUDIT_WORM_S3_BUCKET:-tkeir-worm}
      AUDIT_WORM_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      AUDIT_WORM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AUDIT_AUTH_ENABLED: ${AUDIT_AUTH_ENABLED:-false}
      AUDIT_DEV_TOKEN: ${AUDIT_DEV_TOKEN:-}
    ports:
      - "8093:8093"
    volumes:
      - audit_worm:/var/tkeir/audit/worm
    depends_on:
      audit-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8093/health >/dev/null || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks: [tkeir]

  # ---- objectstore (MinIO with object-lock for WORM) ----
  minio:
    profiles: ["objectstore", "ingest", "audit"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: tkeir-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [tkeir]

  minio-init:
    profiles: ["objectstore", "ingest", "audit"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    container_name: tkeir-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AUDIT_WORM_RETENTION_DAYS: ${AUDIT_WORM_RETENTION_DAYS:-30}
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"
    networks: [tkeir]

  # ---- observability ----
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.119.0@sha256:36c35cc213c0f3b64d6e8a3e844dc90822f00725e0e518eaed5b08bcc2231e72
    container_name: tkeir-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks: [tkeir]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    container_name: tkeir-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [tkeir]

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
    container_name: tkeir-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [tkeir]

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.7.1@sha256:4443be217c396b065ee34845534199c36fdba4dc619cb96550e228d73fba6e69
    container_name: tkeir-tempo
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks: [tkeir]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    container_name: tkeir-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks: [tkeir]

  tkeir-mcp:
    profiles: ["mcp"]
    image: ${IMAGE_REGISTRY:-local}/tkeir-mcp:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.tkeir-mcp
      <<: *tkeir-from-lib
      args:
        <<: *tkeir-build-args
    container_name: tkeir-mcp
    environment:
      TKEIR_SERVICE: tkeir-mcp
      TKEIR_ENV: ${TKEIR_ENV:-dev}
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8093"
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      MCP_DEV_TOKEN: ${MCP_DEV_TOKEN:-}
      MCP_RAG_URL: ${MCP_RAG_URL:-http://tkeir-api:8090}
      VESPA_URL: http://vespa:8080
      VESPA_CONFIG_URL: http://vespa:19071
      VESPA_USER_SPACE: ${VESPA_USER_SPACE:-dev@tkeir}
      GOVERNOR_MODE: ${GOVERNOR_MODE:-observe}
    ports:
      - "8093:8093"
    depends_on:
      vespa:
        condition: service_healthy
    networks: [tkeir]

  tkeir-agent:
    profiles: ["agents"]
    image: ${IMAGE_REGISTRY:-local}/tkeir-agent:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.tkeir-agent
      <<: *tkeir-from-lib
      args:
        <<: *tkeir-build-args
    container_name: tkeir-agent
    environment:
      TKEIR_SERVICE: tkeir-agent
      TKEIR_ENV: ${TKEIR_ENV:-dev}
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "8092"
      AGENT_ROOT: /var/tkeir/agent
      TKEIR_WORKSPACE: /workspace
      # Report-form maps: packs/<usecase>/agent_orchestrator.yaml (default osint)
      TKEIR_AGENT_USECASE: ${TKEIR_AGENT_USECASE:-osint}
      VESPA_URL: http://vespa:8080
      VESPA_CONFIG_URL: http://vespa:19071
      VESPA_USER_SPACE: ${VESPA_USER_SPACE:-dev@tkeir}
      PROVIDER: ${PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-mistral-nemo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GOVERNOR_MODE: ${GOVERNOR_MODE:-observe}
      GOVERNOR_STATE_ROOT: /var/tkeir/governor
      MCP_RAG_URL: ${MCP_RAG_URL:-http://tkeir-api:8090}
      # Agent SPIFFE identity (ADR-0008). Default synthesize; set workload when SPIRE joined.
      SPIFFE_MODE: ${SPIFFE_MODE:-dev}
      SPIFFE_TRUST_DOMAIN: ${SPIFFE_TRUST_DOMAIN:-tkeir.local}
      SPIFFE_ID: ${SPIFFE_ID:-spiffe://tkeir.local/agent/tkeir-agent}
      SPIFFE_ENFORCE: ${SPIFFE_ENFORCE:-false}
      SPIFFE_AGENT_ID_PREFIX: ${SPIFFE_AGENT_ID_PREFIX:-spiffe://tkeir.local/agent/}
      SPIFFE_ENDPOINT_SOCKET: ${SPIFFE_ENDPOINT_SOCKET:-unix:///run/spire/sockets/agent.sock}
    ports:
      - "8092:8092"
    volumes:
      - agent_data:/var/tkeir/agent
      - ${TKEIR_WORKSPACE_HOST:-../../workspace}:/workspace
      - governor_state:/var/tkeir/governor
      - spire_agent_sockets:/run/spire/sockets:ro
    # required: false so `PROFILES=spire,agents` validates without core;
    # production demos still use PROFILES=core,agents (or full stack).
    depends_on:
      tkeir-volume-init:
        condition: service_completed_successfully
        required: false
      vespa:
        condition: service_healthy
        required: false
    networks: [tkeir]

  tkeir-okf:
    profiles: ["okf"]
    image: ${IMAGE_REGISTRY:-local}/tkeir-okf:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.tkeir-okf
      <<: *tkeir-from-lib
      args:
        <<: *tkeir-build-args
    container_name: tkeir-okf
    environment:
      TKEIR_SERVICE: tkeir-okf
      TKEIR_ENV: ${TKEIR_ENV:-dev}
      OKF_HOST: "0.0.0.0"
      OKF_PORT: "8095"
      TKEIR_WORKSPACE: /workspace
      VESPA_URL: http://vespa:8080
      VESPA_CONFIG_URL: http://vespa:19071
      VESPA_USER_SPACE: ${VESPA_USER_SPACE:-dev@tkeir}
      MCP_RAG_URL: ${MCP_RAG_URL:-http://tkeir-api:8090}
      GOVERNOR_MODE: ${GOVERNOR_MODE:-observe}
      GOVERNOR_STATE_ROOT: /var/tkeir/governor
      GOVERNOR_URL: ${GOVERNOR_URL:-http://tkeir-governor:8094}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
    ports:
      - "8095:8095"
    volumes:
      - ${TKEIR_WORKSPACE_HOST:-../../workspace}:/workspace
      - governor_state:/var/tkeir/governor
    depends_on:
      vespa:
        condition: service_healthy
        required: false
    networks: [tkeir]

  spire-server:
    profiles: ["spire"]
    image: ghcr.io/spiffe/spire-server:${SPIRE_TAG:-1.15.2}
    container_name: tkeir-spire-server
    hostname: spire-server
    user: "0:0"
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ../spire/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire_server_data:/run/spire/data/server
      - spire_server_sockets:/run/spire/sockets
    networks: [tkeir]
    # Distroless image: no /bin/sh — use the built-in CLI healthcheck.
    healthcheck:
      test:
        [
          "CMD",
          "/opt/spire/bin/spire-server",
          "healthcheck",
          "-socketPath",
          "/tmp/spire-server/private/api.sock",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  spire-agent:
    profiles: ["spire"]
    image: ghcr.io/spiffe/spire-agent:${SPIRE_TAG:-1.15.2}
    container_name: tkeir-spire-agent
    hostname: spire-agent
    user: "0:0"
    # Join token is minted by `make spire-up` and passed via SPIRE_JOIN_TOKEN.
    command:
      [
        "-config",
        "/opt/spire/conf/agent/agent.conf",
        "-joinToken",
        "${SPIRE_JOIN_TOKEN:-}",
      ]
    environment:
      SPIRE_JOIN_TOKEN: ${SPIRE_JOIN_TOKEN:-}
    volumes:
      - ../spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire_agent_data:/run/spire/data/agent
      - spire_agent_sockets:/run/spire/sockets
    depends_on:
      spire-server:
        condition: service_healthy
    networks: [tkeir]
    # Distroless image: no /bin/sh. Agent may be unhealthy until joined;
    # do not gate other services on this check.

networks:
  tkeir:
    name: tkeir-net

volumes:
  vespa_data:
  indexer_data:
  ingest_data:
  keycloak_db:
  audit_db:
  audit_worm:
  governor_state:
  agent_data:
  minio_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  spire_server_data:
  spire_server_sockets:
  spire_agent_data:
  spire_agent_sockets:
