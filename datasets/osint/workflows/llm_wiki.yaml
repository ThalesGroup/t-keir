name: llm_wiki
version: 5
description: >
  LLM Wiki workflow: match the closest user OKF wiki via index.md (or create
  a skeleton bundle from Grab/search chunks), then update wiki.md with a
  single-pass LLM upsert (no iterative chunk fold). Prefer params.chunks from
  Reporter Grab when present. Grab/search should use search_mode=both.
  params.prompt_name / wiki_agent selects a persona *_prompt agent
  (wiki_structured_facts_seed + wiki_merge_system_prompt). Caps at
  max_wiki_chunks (default 4, hard max 8). Legacy okf_iterative_wiki remains
  available only when wiki_mode=iterative on that builtin.
template: synthesis_note
budgets:
  llm_tokens: 120000
  tool_calls: 20
  wall_seconds: 600
steps:
  - id: wiki
    builtin: wiki_upsert
    params_from:
      [
        query,
        topic,
        chunks,
        use_wiki,
        wiki_match_threshold,
        max_wiki_chunks,
        prompt_name,
        wiki_agent,
      ]
    output_key: wiki_markdown
