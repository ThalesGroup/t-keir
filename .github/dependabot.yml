version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/tkeir-hmi"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/tkeir"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/deploy/images"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
