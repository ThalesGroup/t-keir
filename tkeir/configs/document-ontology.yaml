logger:
  logging-level: info
document-ontology:
  builders:
  - language: en
    include-title-triples: true
    include-content-triples: true
    min-keyword-length: 3
    max-repair-attempts: 2
    alignment:
      enabled: true
      similarity-threshold: 0.85
      min-cluster-size: 2
    save-alignment: false
    # Enrich document graphs from existing ontologies before Vespa.
    # Keep enabled=false here; prefer per-request uploads (ingest ontology_file).
    # Relative names resolve under tkeir/resources/ontologies/ only (not workspace).
    # Absolute paths (e.g. staged under INGEST_ROOT) are also accepted.
    derive-from:
      enabled: false
      paths: []
      # Example (bundled generic ontology):
      # paths:
      #   - example-domain.ttl
      # Example (absolute / operator-mounted):
      #   - /data/shared/reference.owl
      similarity-threshold: 0.8
      match-classes: true
      match-individuals: true
      add-subclass-links: true
      add-type-links: true
      add-same-as-links: true
      include-matched-axioms: false
      save-report: false
    save-derivation: false
