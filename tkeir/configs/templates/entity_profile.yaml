name: entity_profile
version: 1
title: Entity profile
description: >
  Profile card for a single entity drawn from the fused ontology.
slots:
  - name: entity
    type: entity
    description: Target entity
    constraints: { min_items: 1, max_items: 1, required: true }
  - name: entity_types
    type: sparql
    description: RDF types for the focus entity label
    query: |
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
      PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
      SELECT ?label ?type WHERE {
        ?s rdfs:label ?label ; rdf:type ?type .
        FILTER(CONTAINS(LCASE(STR(?label)), LCASE("${topic}")))
      } LIMIT 10
    constraints: { min_items: 0, max_items: 10, required: false }
  - name: relations
    type: svo_pattern
    description: Relations involving the entity
    constraints: { min_items: 0, max_items: 15, required: false }
  - name: keywords
    type: keyword
    description: Document keywords
    constraints: { min_items: 0, max_items: 8, required: false }
  - name: narrative
    type: freeform_grounded
    description: Short grounded narrative about the entity
    constraints: { required: true }
markdown_template: |
  # Entity profile: {{ topic or "unknown" }}

  {% if entity %}
  ## Identity

  - Label: **{{ entity.label }}**
  - Type: {{ entity.type }}
  - URI: `{{ entity.uri }}`
  {% endif %}

  {% if entity_types %}
  ## Typed as

  {% for row in entity_types %}
  - {{ row.label }} → {{ row.type }}
  {% endfor %}
  {% endif %}

  {% if relations %}
  ## Relations

  {% for t in relations %}
  - {{ t }}
  {% endfor %}
  {% endif %}

  {% if keywords %}
  ## Keywords

  {{ keywords | join(", ") }}
  {% endif %}

  {% if narrative %}
  ## Narrative

  {{ narrative }}
  {% endif %}
