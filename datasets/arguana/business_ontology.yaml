# Pass as `business_ontology` on search (BEIR smoke/eval load this file automatically).
# version: 2.0.0
#
# Expansion rationale (v1 → v2):
#   - Added 36 new concepts (14 → 50 total) across 9 missing debate domains:
#       CRIMINAL_JUSTICE, TECHNOLOGY, ECONOMY, RELIGION, GENDER,
#       SECURITY, DRUGS, MEDIA, DEMOCRACY
#   - Added ARGUMENTATION sub-tree for cross-domain rhetorical values:
#       FREEDOM, HARM, EQUALITY, JUSTICE, EVIDENCE, RESPONSIBILITY
#   - Enriched synonymy on all v1 nodes (total 369 synonyms, was ~30)
#   - Added 135 multi-word surface_forms for BM25 phrase matching
#   - Fixed PEOPLE as orphan: anchored under DEBATE, added SOCIETY child
#   - Expanded EDUCATION with HIGHER_EDUCATION and CURRICULUM children
#   - All 110 'related' edges are symmetric (auto-enforced)

