apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tkeir-audit.fullname" . }}
  labels:
    {{- include "tkeir-audit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tkeir-audit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tkeir-audit.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tkeir-audit.serviceAccountName" . }}
      securityContext:
        {{- include "tkeir-lib.securityContext" . | nindent 8 }}
      containers:
        - name: tkeir-audit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: AUDIT_HOST
              value: "0.0.0.0"
            - name: AUDIT_PORT
              value: {{ .Values.service.port | quote }}
            - name: AUDIT_HOT_STORE_URL
              value: {{ include "tkeir-audit.hotStoreUrl" . | quote }}
            - name: AUDIT_WORM_ROOT
              value: /var/tkeir/audit/worm
            {{- range $k, $v := .Values.env }}
            {{- if $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            {{- include "tkeir-lib.livenessProbe" (dict "port" "http" "path" "/health" "initialDelaySeconds" 30) | nindent 12 }}
          readinessProbe:
            {{- include "tkeir-lib.readinessProbe" (dict "port" "http" "path" "/ready" "initialDelaySeconds" 15) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: worm
              mountPath: /var/tkeir/audit/worm
            - name: hot
              mountPath: /var/tkeir/audit/hot
      volumes:
        - name: worm
          {{- if .Values.persistence.worm.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tkeir-audit.fullname" . }}-worm
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: hot
          {{- if .Values.persistence.hot.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tkeir-audit.fullname" . }}-hot
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.archiver.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "tkeir-audit.fullname" . }}-archiver
  labels:
    {{- include "tkeir-audit.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.archiver.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: archiver
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              command: ["tkeir-audit", "archive"]
              env:
                - name: AUDIT_HOT_STORE_URL
                  value: {{ include "tkeir-audit.hotStoreUrl" . | quote }}
                - name: AUDIT_WORM_ROOT
                  value: /var/tkeir/audit/worm
              volumeMounts:
                - name: worm
                  mountPath: /var/tkeir/audit/worm
          volumes:
            - name: worm
              persistentVolumeClaim:
                claimName: {{ include "tkeir-audit.fullname" . }}-worm
{{- end }}
