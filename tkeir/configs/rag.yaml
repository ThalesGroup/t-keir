# RAG API runtime configuration (retrieval UI and ontology export).
# Keep ontology.min_keyword_length aligned with keywords.json → min-keyword-length.
#
# Model resolution for search/index (highest wins):
#   1. environment variables (PROVIDER, EMBEDDING_MODEL, LLM_MODEL,
#      RERANKER_MODEL, EMBEDDING_DIM)
#   2. models: section below
#   3. provider hard-coded defaults in thot.core.LlmWrapper

models:
  # provider: ollama
  embedding_model: bge-m3
  llm_model: mistral-nemo
  # Prefer a true reranker when the backend exposes /api/rerank or /v1/rerank
  # (or OpenAI-compat /rerank). Otherwise LlmWrapper scores via /api/generate
  # (Ollama) / chat completions (OpenAI, vLLM), falling back to llm_model if
  # the reranker cannot load as a generate model (common for cross-encoders
  # on stock Ollama).
  reranker_model: qllama/bge-reranker-v2-m3
  embedding_dim: 384

ontology:
  # Minimum number of characters for a keyword label exposed in the HMI/RAG API.
  min_keyword_length: 3
  max_entities: 120
  max_keywords: 60

prompt:
  # chunk_excerpts: copy retrieved chunk text into the LLM prompt (default).
  # svo_ontology: KEY PASSAGES + deduplicated SVO facts (no raw chunk excerpts).
  chunk_context_mode: svo_ontology
  max_svo_triples: 80
  # KEY PASSAGES injected into the LLM prompt (proximity-ranked windows).
  passages:
    count: 5              # number of passages
    max_chars: 1800       # max characters per passage
    context_sentences: 2  # neighbor sentences around the best window
  # Chunk excerpts (chunk_excerpts mode) and prompt chunk filtering.
  max_chars_per_chunk: 1800
  max_chunks_for_prompt: 10

search:
  # When enabled, raw queries are analyzed with the full NLP pipeline and the
  # Vespa request is built by QueryAnalyzerTask instead of query_refiner only.
  enabled: true
  use_chunk_embedding: true
  use_question_embedding: true
  use_text_raw: true
  use_parent_content: true
  use_parent_title: true
  use_ner: true
  use_svo: true
  use_keywords: true
  use_lemmas: true
  # auto → QueryAnalyzer picks hybrid_semantic / hybrid_lexical / hybrid_2_level
  # from structural NLP signals (no language word lists).
  ranking_profile: auto
  hits: 20
  max_yql_terms: 48
  # Informational weights aligned with chunk.sd hybrid_2_level rank profile.
  weight_chunk_embedding: 0.38
  weight_question_embedding: 0.17
  weight_text_raw_bm25: 0.28
  weight_parent_content_bm25: 0.17
  weight_parent_title_bm25: 0.12
  # Second-stage rerank via UnifiedLLMWrapper.rerank
  # (native /rerank when available, else generate/chat scoring).
  rerank:
    enabled: true
    # First-stage Vespa hits sent to the reranker (truncated to search.hits after).
    # Keep modest when using generate/chat scoring (LLM-as-judge) for latency.
    candidates: 20
