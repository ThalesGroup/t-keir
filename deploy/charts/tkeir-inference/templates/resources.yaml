{{- if and (eq .Values.mode "ollama") .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tkeir-inference.fullname" . }}
  labels:
    {{- include "tkeir-inference.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tkeir-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tkeir-inference.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ollama.service.port }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tkeir-inference.fullname" . }}
  labels:
    {{- include "tkeir-inference.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.ollama.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "tkeir-inference.selectorLabels" . | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tkeir-inference.fullname" . }}-pull-models
  labels:
    {{- include "tkeir-inference.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              export OLLAMA_HOST=http://{{ include "tkeir-inference.fullname" . }}:{{ .Values.ollama.service.port }}
              {{- range .Values.ollama.models }}
              ollama pull {{ . }}
              {{- end }}
{{- end }}
{{- if and (eq .Values.mode "vllm") .Values.vllm.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tkeir-inference.fullname" . }}
  labels:
    {{- include "tkeir-inference.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tkeir-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tkeir-inference.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: vllm
          image: "{{ .Values.vllm.image.repository }}:{{ .Values.vllm.image.tag }}"
          args:
            - --model
            - {{ .Values.vllm.model | quote }}
          ports:
            - name: http
              containerPort: 8000
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tkeir-inference.fullname" . }}
  labels:
    {{- include "tkeir-inference.labels" . | nindent 4 }}
spec:
  ports:
    - port: 8000
      targetPort: http
      name: http
  selector:
    {{- include "tkeir-inference.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if eq .Values.mode "external" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tkeir-inference.fullname" . }}-env
  labels:
    {{- include "tkeir-inference.labels" . | nindent 4 }}
data:
  {{- include "tkeir-inference.providerEnv" . | nindent 2 }}
{{- end }}
