articles:
  Art.5(1)(a):
    title: Prohibited AI practices
    text: (a) the placing on the market, the putting into service or the use of an AI system that deploys
      subliminal techniques beyond a person’s consciousness or purposefully manipulative or deceptive
      techniques, with the objective, or the effect of materially distorting the behaviour of a person
      or a group of persons by appreciably impairing their ability to make an informed decision, thereby
      causing them to take a decision that they would not have otherwise taken in a manner that causes
      or is reasonably likely to cause that person, another person or group of persons significant harm;
    status: point
  Art.5(1)(b):
    title: Prohibited AI practices
    text: (b) the placing on the market, the putting into service or the use of an AI system that exploits
      any of the vulnerabilities of a natural person or a specific group of persons due to their age,
      disability or a specific social or economic situation, with the objective, or the effect, of materially
      distorting the behaviour of that person or a person belonging to that group in a manner that causes
      or is reasonably likely to cause that person or another person significant harm;
    status: point
  Art.5(1)(c):
    title: Prohibited AI practices
    text: '(c) the placing on the market, the putting into service or the use of AI systems for the evaluation
      or classification of natural persons or groups of persons over a certain period of time based on
      their social behaviour or known, inferred or predicted personal or personality characteristics,
      with the social score leading to either or both of the following:'
    status: point
  Art.5(1)(d):
    title: Prohibited AI practices
    text: (d) the placing on the market, the putting into service for this specific purpose, or the use
      of an AI system for making risk assessments of natural persons in order to assess or predict the
      risk of a natural person committing a criminal offence, based solely on the profiling of a natural
      person or on assessing their personality traits and characteristics; this prohibition shall not
      apply to AI systems used to support the human assessment of the involvement of a person in a criminal
      activity, which is already based on objective and verifiable facts directly linked to a criminal
      activity;
    status: point
  Art.5(1)(e):
    title: Prohibited AI practices
    text: (e) the placing on the market, the putting into service for this specific purpose, or the use
      of AI systems that create or expand facial recognition databases through the untargeted scraping
      of facial images from the internet or CCTV footage;
    status: point
  Art.5(1)(f):
    title: Prohibited AI practices
    text: (f) the placing on the market, the putting into service for this specific purpose, or the use
      of AI systems to infer emotions of a natural person in the areas of workplace and education institutions,
      except where the use of the AI system is intended to be put in place or into the market for medical
      or safety reasons;
    status: point
  Art.5(1)(g):
    title: Prohibited AI practices
    text: (g) the placing on the market, the putting into service for this specific purpose, or the use
      of biometric categorisation systems that categorise individually natural persons based on their
      biometric data to deduce or infer their race, political opinions, trade union membership, religious
      or philosophical beliefs, sex life or sexual orientation; this prohibition does not cover any labelling
      or filtering of lawfully acquired biometric datasets, such as images, based on biometric data or
      categorizing of biometric data in the area of law enforcement;
    status: point
  Art.6:
    title: Classification rules for high-risk AI systems
    text: "1. Irrespective of whether an AI system is placed on the market or put into service independently\
      \ of the products referred to in points (a) and (b), that AI system shall be considered to be high-risk\
      \ where both of the following conditions are fulfilled:\n\n (a)\n\n the AI system is intended to\
      \ be used as a safety component of a product, or the AI system is itself a product, covered by the\
      \ Union harmonisation legislation listed in Annex I;\n\n (b)\n\n the product whose safety component\
      \ pursuant to point (a) is the AI system, or the AI system itself as a product, is required to undergo\
      \ a third-party conformity assessment, with a view to the placing on the market or the putting into\
      \ service of that product pursuant to the Union harmonisation legislation listed in Annex I.\n\n\
      \ 2. In addition to the high-risk AI systems referred to in paragraph 1, AI systems referred to\
      \ in Annex III shall be considered to be high-risk.\n\n 3. By derogation from paragraph 2, an AI\
      \ system referred to in Annex III shall not be considered to be high-risk where it does not pose\
      \ a significant risk of harm to the health, safety or fundamental rights of natural persons, including\
      \ by not materially influencing the outcome of decision making.\n\n The first subparagraph shall\
      \ apply where any of the following conditions is fulfilled:\n\n (a)\n\n the AI system is intended\
      \ to perform a narrow procedural task;\n\n (b)\n\n the AI system is intended to improve the result\
      \ of a previously completed human activity;\n\n (c)\n\n the AI system is intended to detect decision-making\
      \ patterns or deviations from prior decision-making patterns and is not meant to replace or influence\
      \ the previously completed human assessment, without proper human review; or\n\n (d)\n\n the AI\
      \ system is intended to perform a preparatory task to an assessment relevant for the purposes of\
      \ the use cases listed in Annex III.\n\n Notwithstanding the first subparagraph, an AI system referred\
      \ to in Annex III shall always be considered to be high-risk where the AI system performs profiling\
      \ of natural persons.\n\n 4. A provider who considers that an AI system referred to in Annex III\
      \ is not high-risk shall document its assessment before that system is placed on the market or put\
      \ into service. Such provider shall be subject to the registration obligation set out in Article\
      \ 49(2). Upon request of national competent authorities, the provider shall provide the documentation\
      \ of the assessment.\n\n 5. The Commission shall, after consulting the European Artificial Intelligence\
      \ Board (the ‘Board’), and no later than 2 February 2026, provide guidelines specifying the practical\
      \ implementation of this Article in line with Article 96 together with a comprehensive list of practical\
      \ examples of use cases of AI systems that are high-risk and not high-risk.\n\n 6. The Commission\
      \ is empowered to adopt delegated acts in accordance with Article 97 in order to amend paragraph\
      \ 3, second subparagraph, of this Article by adding new conditions to those laid down therein, or\
      \ by modifying them, where there is concrete and reliable evidence of the existence of AI systems\
      \ that fall under the scope of Annex III, but do not pose a significant risk of harm to the health,\
      \ safety or fundamental rights of natural persons.\n\n 7. The Commission shall adopt delegated acts\
      \ in accordance with Article 97 in order to amend paragraph 3, second subparagraph, of this Article\
      \ by deleting any of the conditions laid down therein, where there is concrete and reliable evidence\
      \ that this is necessary to maintain the level of protection of health, safety and fundamental rights\
      \ provided for by this Regulation.\n\n 8. Any amendment to the conditions laid down in paragraph\
      \ 3, second subparagraph, adopted in accordance with paragraphs 6 and 7 of this Article shall not\
      \ decrease the overall level of protection of health, safety and fundamental rights provided for\
      \ by this Regulation and shall ensure consistency with the delegated acts adopted pursuant to Article\
      \ 7(1), and take account of market and technological developments."
    status: article
  Art.7:
    title: Amendments to Annex III
    text: "1. The Commission is empowered to adopt delegated acts in accordance with Article 97 to amend\
      \ Annex III by adding or modifying use-cases of high-risk AI systems where both of the following\
      \ conditions are fulfilled:\n\n (a)\n\n the AI systems are intended to be used in any of the areas\
      \ listed in Annex III;\n\n (b)\n\n the AI systems pose a risk of harm to health and safety, or an\
      \ adverse impact on fundamental rights, and that risk is equivalent to, or greater than, the risk\
      \ of harm or of adverse impact posed by the high-risk AI systems already referred to in Annex III.\n\
      \n 2. When assessing the condition under paragraph 1, point (b), the Commission shall take into\
      \ account the following criteria:\n\n (a)\n\n the intended purpose of the AI system;\n\n (b)\n\n\
      \ the extent to which an AI system has been used or is likely to be used;\n\n (c)\n\n the nature\
      \ and amount of the data processed and used by the AI system, in particular whether special categories\
      \ of personal data are processed;\n\n (d)\n\n the extent to which the AI system acts autonomously\
      \ and the possibility for a human to override a decision or recommendations that may lead to potential\
      \ harm;\n\n (e)\n\n the extent to which the use of an AI system has already caused harm to health\
      \ and safety, has had an adverse impact on fundamental rights or has given rise to significant concerns\
      \ in relation to the likelihood of such harm or adverse impact, as demonstrated, for example, by\
      \ reports or documented allegations submitted to national competent authorities or by other reports,\
      \ as appropriate;\n\n (f)\n\n the potential extent of such harm or such adverse impact, in particular\
      \ in terms of its intensity and its ability to affect multiple persons or to disproportionately\
      \ affect a particular group of persons;\n\n (g)\n\n the extent to which persons who are potentially\
      \ harmed or suffer an adverse impact are dependent on the outcome produced with an AI system, in\
      \ particular because for practical or legal reasons it is not reasonably possible to opt-out from\
      \ that outcome;\n\n (h)\n\n the extent to which there is an imbalance of power, or the persons who\
      \ are potentially harmed or suffer an adverse impact are in a vulnerable position in relation to\
      \ the deployer of an AI system, in particular due to status, authority, knowledge, economic or social\
      \ circumstances, or age;\n\n (i)\n\n the extent to which the outcome produced involving an AI system\
      \ is easily corrigible or reversible, taking into account the technical solutions available to correct\
      \ or reverse it, whereby outcomes having an adverse impact on health, safety or fundamental rights,\
      \ shall not be considered to be easily corrigible or reversible;\n\n (j)\n\n the magnitude and likelihood\
      \ of benefit of the deployment of the AI system for individuals, groups, or society at large, including\
      \ possible improvements in product safety;\n\n (k)\n\n the extent to which existing Union law provides\
      \ for:\n\n (i)\n\n effective measures of redress in relation to the risks posed by an AI system,\
      \ with the exclusion of claims for damages;\n\n (ii)\n\n effective measures to prevent or substantially\
      \ minimise those risks.\n\n 3. The Commission is empowered to adopt delegated acts in accordance\
      \ with Article 97 to amend the list in Annex III by removing high-risk AI systems where both of\
      \ the following conditions are fulfilled:\n\n (a)\n\n the high-risk AI system concerned no longer\
      \ poses any significant risks to fundamental rights, health or safety, taking into account the criteria\
      \ listed in paragraph 2;\n\n (b)\n\n the deletion does not decrease the overall level of protection\
      \ of health, safety and fundamental rights under Union law.\n\n SECTION 2\n\n Requirements for high-risk\
      \ AI systems"
    status: article
  Art.9(1):
    title: Risk management system
    text: 1. A risk management system shall be established, implemented, documented and maintained in
      relation to high-risk AI systems.
    status: paragraph
  Art.9(2):
    title: Risk management system
    text: "2. The risk management system shall be understood as a continuous iterative process planned\
      \ and run throughout the entire lifecycle of a high-risk AI system, requiring regular systematic\
      \ review and updating. It shall comprise the following steps:\n\n (a)\n\n the identification and\
      \ analysis of the known and the reasonably foreseeable risks that the high-risk AI system can pose\
      \ to health, safety or fundamental rights when the high-risk AI system is used in accordance with\
      \ its intended purpose;\n\n (b)\n\n the estimation and evaluation of the risks that may emerge when\
      \ the high-risk AI system is used in accordance with its intended purpose, and under conditions\
      \ of reasonably foreseeable misuse;\n\n (c)\n\n the evaluation of other risks possibly arising,\
      \ based on the analysis of data gathered from the post-market monitoring system referred to in Article\
      \ 72;\n\n (d)\n\n the adoption of appropriate and targeted risk management measures designed to\
      \ address the risks identified pursuant to point (a)."
    status: paragraph
  Art.9(3):
    title: Risk management system
    text: 3. The risks referred to in this Article shall concern only those which may be reasonably mitigated
      or eliminated through the development or design of the high-risk AI system, or the provision of
      adequate technical information.
    status: paragraph
  Art.9(4):
    title: Risk management system
    text: 4. The risk management measures referred to in paragraph 2, point (d), shall give due consideration
      to the effects and possible interaction resulting from the combined application of the requirements
      set out in this Section, with a view to minimising risks more effectively while achieving an appropriate
      balance in implementing the measures to fulfil those requirements.
    status: paragraph
  Art.9(5):
    title: Risk management system
    text: "5. The risk management measures referred to in paragraph 2, point (d), shall be such that the\
      \ relevant residual risk associated with each hazard, as well as the overall residual risk of the\
      \ high-risk AI systems is judged to be acceptable.\n\n In identifying the most appropriate risk\
      \ management measures, the following shall be ensured:\n\n (a)\n\n elimination or reduction of risks\
      \ identified and evaluated pursuant to paragraph 2 in as far as technically feasible through adequate\
      \ design and development of the high-risk AI system;\n\n (b)\n\n where appropriate, implementation\
      \ of adequate mitigation and control measures addressing risks that cannot be eliminated;\n\n (c)\n\
      \n provision of information required pursuant to Article 13 and, where appropriate, training to\
      \ deployers.\n\n With a view to eliminating or reducing risks related to the use of the high-risk\
      \ AI system, due consideration shall be given to the technical knowledge, experience, education,\
      \ the training to be expected by the deployer, and the presumable context in which the system is\
      \ intended to be used."
    status: paragraph
  Art.9(6):
    title: Risk management system
    text: 6. High-risk AI systems shall be tested for the purpose of identifying the most appropriate
      and targeted risk management measures. Testing shall ensure that high-risk AI systems perform consistently
      for their intended purpose and that they are in compliance with the requirements set out in this
      Section.
    status: paragraph
  Art.9(7):
    title: Risk management system
    text: 7. Testing procedures may include testing in real-world conditions in accordance with Article
    status: paragraph
  Art.9(8):
    title: Risk management system
    text: 8. The testing of high-risk AI systems shall be performed, as appropriate, at any time throughout
      the development process, and, in any event, prior to their being placed on the market or put into
      service. Testing shall be carried out against prior defined metrics and probabilistic thresholds
      that are appropriate to the intended purpose of the high-risk AI system.
    status: paragraph
  Art.10(1):
    title: Data and data governance
    text: 1. High-risk AI systems which make use of techniques involving the training of AI models with
      data shall be developed on the basis of training, validation and testing data sets that meet the
      quality criteria referred to in paragraphs 2 to 5 whenever such data sets are used.
    status: paragraph
  Art.10(2):
    title: Data and data governance
    text: "2. Training, validation and testing data sets shall be subject to data governance and management\
      \ practices appropriate for the intended purpose of the high-risk AI system. Those practices shall\
      \ concern in particular:\n\n (a)\n\n the relevant design choices;\n\n (b)\n\n data collection processes\
      \ and the origin of data, and in the case of personal data, the original purpose of the data collection;\n\
      \n (c)\n\n relevant data-preparation processing operations, such as annotation, labelling, cleaning,\
      \ updating, enrichment and aggregation;\n\n (d)\n\n the formulation of assumptions, in particular\
      \ with respect to the information that the data are supposed to measure and represent;\n\n (e)\n\
      \n an assessment of the availability, quantity and suitability of the data sets that are needed;\n\
      \n (f)\n\n examination in view of possible biases that are likely to affect the health and safety\
      \ of persons, have a negative impact on fundamental rights or lead to discrimination prohibited\
      \ under Union law, especially where data outputs influence inputs for future operations;\n\n (g)\n\
      \n appropriate measures to detect, prevent and mitigate possible biases identified according to\
      \ point (f);\n\n (h)\n\n the identification of relevant data gaps or shortcomings that prevent compliance\
      \ with this Regulation, and how those gaps and shortcomings can be addressed."
    status: paragraph
  Art.10(3):
    title: Data and data governance
    text: 3. Training, validation and testing data sets shall be relevant, sufficiently representative,
      and to the best extent possible, free of errors and complete in view of the intended purpose. They
      shall have the appropriate statistical properties, including, where applicable, as regards the persons
      or groups of persons in relation to whom the high-risk AI system is intended to be used. Those characteristics
      of the data sets may be met at the level of individual data sets or at the level of a combination
      thereof.
    status: paragraph
  Art.10(4):
    title: Data and data governance
    text: 4. Data sets shall take into account, to the extent required by the intended purpose, the characteristics
      or elements that are particular to the specific geographical, contextual, behavioural or functional
      setting within which the high-risk AI system is intended to be used.
    status: paragraph
  Art.10(5):
    title: Data and data governance
    text: "5. To the extent that it is strictly necessary for the purpose of ensuring bias detection and\
      \ correction in relation to the high-risk AI systems in accordance with paragraph (2), points (f)\
      \ and (g) of this Article, the providers of such systems may exceptionally process special categories\
      \ of personal data, subject to appropriate safeguards for the fundamental rights and freedoms of\
      \ natural persons. In addition to the provisions set out in Regulations (EU) 2016/679 and (EU) 2018/1725\
      \ and Directive (EU) 2016/680, all the following conditions must be met in order for such processing\
      \ to occur:\n\n (a)\n\n the bias detection and correction cannot be effectively fulfilled by processing\
      \ other data, including synthetic or anonymised data;\n\n (b)\n\n the special categories of personal\
      \ data are subject to technical limitations on the re-use of the personal data, and state-of-the-art\
      \ security and privacy-preserving measures, including pseudonymisation;\n\n (c)\n\n the special\
      \ categories of personal data are subject to measures to ensure that the personal data processed\
      \ are secured, protected, subject to suitable safeguards, including strict controls and documentation\
      \ of the access, to avoid misuse and ensure that only authorised persons have access to those personal\
      \ data with appropriate confidentiality obligations;\n\n (d)\n\n the special categories of personal\
      \ data are not to be transmitted, transferred or otherwise accessed by other parties;\n\n (e)\n\n\
      \ the special categories of personal data are deleted once the bias has been corrected or the personal\
      \ data has reached the end of its retention period, whichever comes first;\n\n (f)\n\n the records\
      \ of processing activities pursuant to Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive\
      \ (EU) 2016/680 include the reasons why the processing of special categories of personal data was\
      \ strictly necessary to detect and correct biases, and why that objective could not be achieved\
      \ by processing other data."
    status: paragraph
  Art.11(1):
    title: Technical documentation
    text: "1. The technical documentation of a high-risk AI system shall be drawn up before that system\
      \ is placed on the market or put into service and shall be kept up-to date.\n\n The technical documentation\
      \ shall be drawn up in such a way as to demonstrate that the high-risk AI system complies with the\
      \ requirements set out in this Section and to provide national competent authorities and notified\
      \ bodies with the necessary information in a clear and comprehensive form to assess the compliance\
      \ of the AI system with those requirements. It shall contain, at a minimum, the elements set out\
      \ in Annex IV. SMEs, including start-ups, may provide the elements of the technical documentation\
      \ specified in Annex IV in a simplified manner. To that end, the Commission shall establish a simplified\
      \ technical documentation form targeted at the needs of small and microenterprises. Where an SME,\
      \ including a start-up, opts to provide the information required in Annex IV in a simplified manner,\
      \ it shall use the form referred to in this paragraph. Notified bodies shall accept the form for\
      \ the purposes of the conformity assessment."
    status: paragraph
  Art.11(2):
    title: Technical documentation
    text: 2. Where a high-risk AI system related to a product covered by the Union harmonisation legislation
      listed in Section A of Annex I is placed on the market or put into service, a single set of technical
      documentation shall be drawn up containing all the information set out in paragraph 1, as well as
      the information required under those legal acts.
    status: paragraph
  Art.12(1):
    title: Record-keeping
    text: 1. High-risk AI systems shall technically allow for the automatic recording of events (logs)
      over the lifetime of the system.
    status: paragraph
  Art.12(2):
    title: Record-keeping
    text: "2. In order to ensure a level of traceability of the functioning of a high-risk AI system that\
      \ is appropriate to the intended purpose of the system, logging capabilities shall enable the recording\
      \ of events relevant for:\n\n (a)\n\n identifying situations that may result in the high-risk AI\
      \ system presenting a risk within the meaning of Article 79(1) or in a substantial modification;\n\
      \n (b)\n\n facilitating the post-market monitoring referred to in Article 72; and\n\n (c)\n\n monitoring\
      \ the operation of high-risk AI systems referred to in Article 26(5)."
    status: paragraph
  Art.12(3):
    title: Record-keeping
    text: "3. For high-risk AI systems referred to in point 1 (a), of Annex III, the logging capabilities\
      \ shall provide, at a minimum:\n\n (a)\n\n recording of the period of each use of the system (start\
      \ date and time and end date and time of each use);\n\n (b)\n\n the reference database against which\
      \ input data has been checked by the system;\n\n (c)\n\n the input data for which the search has\
      \ led to a match;\n\n (d)\n\n the identification of the natural persons involved in the verification\
      \ of the results, as referred to in Article 14(5)."
    status: paragraph
  Art.12(4):
    title: Record-keeping
    text: "1. High-risk AI systems shall technically allow for the automatic recording of events (logs)\
      \ over the lifetime of the system.\n\n 2. In order to ensure a level of traceability of the functioning\
      \ of a high-risk AI system that is appropriate to the intended purpose of the system, logging capabilities\
      \ shall enable the recording of events relevant for:\n\n (a)\n\n identifying situations that may\
      \ result in the high-risk AI system presenting a risk within the meaning of Article 79(1) or in\
      \ a substantial modification;\n\n (b)\n\n facilitating the post-market monitoring referred to in\
      \ Article 72; and\n\n (c)\n\n monitoring the operation of high-risk AI systems referred to in Article\
      \ 26(5).\n\n 3. For high-risk AI systems referred to in point 1 (a), of Annex III, the logging capabilities\
      \ shall provide, at a minimum:\n\n (a)\n\n recording of the period of each use of the system (start\
      \ date and time and end date and time of each use);\n\n (b)\n\n the reference database against which\
      \ input data has been checked by the system;\n\n (c)\n\n the input data for which the search has\
      \ led to a match;\n\n (d)\n\n the identification of the natural persons involved in the verification\
      \ of the results, as referred to in Article 14(5)."
    status: article_fallback
