  Art.17(1)(a):
    title: Quality management system
    text: (a) a strategy for regulatory compliance, including compliance with conformity assessment procedures
      and procedures for the management of modifications to the high-risk AI system;
    status: point
  Art.17(1)(b):
    title: Quality management system
    text: (b) techniques, procedures and systematic actions to be used for the design, design control
      and design verification of the high-risk AI system;
    status: point
  Art.17(1)(c):
    title: Quality management system
    text: (c) techniques, procedures and systematic actions to be used for the development, quality control
      and quality assurance of the high-risk AI system;
    status: point
  Art.17(1)(d):
    title: Quality management system
    text: (d) examination, test and validation procedures to be carried out before, during and after the
      development of the high-risk AI system, and the frequency with which they have to be carried out;
    status: point
  Art.17(1)(e):
    title: Quality management system
    text: (e) technical specifications, including standards, to be applied and, where the relevant harmonised
      standards are not applied in full or do not cover all of the relevant requirements set out in Section
      2, the means to be used to ensure that the high-risk AI system complies with those requirements;
    status: point
  Art.17(1)(f):
    title: Quality management system
    text: (f) systems and procedures for data management, including data acquisition, data collection,
      data analysis, data labelling, data storage, data filtration, data mining, data aggregation, data
      retention and any other operation regarding the data that is performed before and for the purpose
      of the placing on the market or the putting into service of high-risk AI systems;
    status: point
  Art.17(1)(g):
    title: Quality management system
    text: (g) the risk management system referred to in Article 9;
    status: point
  Art.17(1)(h):
    title: Quality management system
    text: (h) the setting-up, implementation and maintenance of a post-market monitoring system, in accordance
      with Article 72;
    status: point
  Art.17(2):
    title: Quality management system
    text: 2. The implementation of the aspects referred to in paragraph 1 shall be proportionate to the
      size of the provider’s organisation. Providers shall, in any event, respect the degree of rigour
      and the level of protection required to ensure the compliance of their high-risk AI systems with
      this Regulation.
    status: paragraph
  Art.18:
    title: Documentation keeping
    text: "1. The provider shall, for a period ending 10 years after the high-risk AI system has been\
      \ placed on the market or put into service, keep at the disposal of the national competent authorities:\n\
      \n (a)\n\n the technical documentation referred to in Article 11;\n\n (b)\n\n the documentation\
      \ concerning the quality management system referred to in Article 17;\n\n (c)\n\n the documentation\
      \ concerning the changes approved by notified bodies, where applicable;\n\n (d)\n\n the decisions\
      \ and other documents issued by the notified bodies, where applicable;\n\n (e)\n\n the EU declaration\
      \ of conformity referred to in Article 47.\n\n 2. Each Member State shall determine conditions under\
      \ which the documentation referred to in paragraph 1 remains at the disposal of the national competent\
      \ authorities for the period indicated in that paragraph for the cases when a provider or its authorised\
      \ representative established on its territory goes bankrupt or ceases its activity prior to the\
      \ end of that period.\n\n 3. Providers that are financial institutions subject to requirements regarding\
      \ their internal governance, arrangements or processes under Union financial services law shall\
      \ maintain the technical documentation as part of the documentation kept under the relevant Union\
      \ financial services law."
    status: article
  Art.19:
    title: Automatically generated logs
    text: "1. Providers of high-risk AI systems shall keep the logs referred to in Article 12(1), automatically\
      \ generated by their high-risk AI systems, to the extent such logs are under their control. Without\
      \ prejudice to applicable Union or national law, the logs shall be kept for a period appropriate\
      \ to the intended purpose of the high-risk AI system, of at least six months, unless provided otherwise\
      \ in the applicable Union or national law, in particular in Union law on the protection of personal\
      \ data.\n\n 2. Providers that are financial institutions subject to requirements regarding their\
      \ internal governance, arrangements or processes under Union financial services law shall maintain\
      \ the logs automatically generated by their high-risk AI systems as part of the documentation kept\
      \ under the relevant financial services law."
    status: article
  Art.20(1):
    title: Corrective actions and duty of information
    text: 1. Providers of high-risk AI systems which consider or have reason to consider that a high-risk
      AI system that they have placed on the market or put into service is not in conformity with this
      Regulation shall immediately take the necessary corrective actions to bring that system into conformity,
      to withdraw it, to disable it, or to recall it, as appropriate. They shall inform the distributors
      of the high-risk AI system concerned and, where applicable, the deployers, the authorised representative
      and importers accordingly.
    status: paragraph
  Art.20(2):
    title: Corrective actions and duty of information
    text: 2. Where the high-risk AI system presents a risk within the meaning of Article 79(1) and the
      provider becomes aware of that risk, it shall immediately investigate the causes, in collaboration
      with the reporting deployer, where applicable, and inform the market surveillance authorities competent
      for the high-risk AI system concerned and, where applicable, the notified body that issued a certificate
      for that high-risk AI system in accordance with Article 44, in particular, of the nature of the
      non-compliance and of any relevant corrective action taken.
    status: paragraph
  Art.21:
    title: Cooperation with competent authorities
    text: "1. Providers of high-risk AI systems shall, upon a reasoned request by a competent authority,\
      \ provide that authority all the information and documentation necessary to demonstrate the conformity\
      \ of the high-risk AI system with the requirements set out in Section 2, in a language which can\
      \ be easily understood by the authority in one of the official languages of the institutions of\
      \ the Union as indicated by the Member State concerned.\n\n 2. Upon a reasoned request by a competent\
      \ authority, providers shall also give the requesting competent authority, as applicable, access\
      \ to the automatically generated logs of the high-risk AI system referred to in Article 12(1), to\
      \ the extent such logs are under their control.\n\n 3. Any information obtained by a competent authority\
      \ pursuant to this Article shall be treated in accordance with the confidentiality obligations set\
      \ out in Article 78."
    status: article
  Art.22:
    title: Authorised representatives of providers of high-risk AI systems
    text: "1. Prior to making their high-risk AI systems available on the Union market, providers established\
      \ in third countries shall, by written mandate, appoint an authorised representative which is established\
      \ in the Union.\n\n 2. The provider shall enable its authorised representative to perform the tasks\
      \ specified in the mandate received from the provider.\n\n 3. The authorised representative shall\
      \ perform the tasks specified in the mandate received from the provider. It shall provide a copy\
      \ of the mandate to the market surveillance authorities upon request, in one of the official languages\
      \ of the institutions of the Union, as indicated by the competent authority. For the purposes of\
      \ this Regulation, the mandate shall empower the authorised representative to carry out the following\
      \ tasks:\n\n (a)\n\n verify that the EU declaration of conformity referred to in Article 47 and\
      \ the technical documentation referred to in Article 11 have been drawn up and that an appropriate\
      \ conformity assessment procedure has been carried out by the provider;\n\n (b)\n\n keep at the\
      \ disposal of the competent authorities and national authorities or bodies referred to in Article\
      \ 74(10), for a period of 10 years after the high-risk AI system has been placed on the market or\
      \ put into service, the contact details of the provider that appointed the authorised representative,\
      \ a copy of the EU declaration of conformity referred to in Article 47, the technical documentation\
      \ and, if applicable, the certificate issued by the notified body;\n\n (c)\n\n provide a competent\
      \ authority, upon a reasoned request, with all the information and documentation, including that\
      \ referred to in point (b) of this subparagraph, necessary to demonstrate the conformity of a high-risk\
      \ AI system with the requirements set out in Section 2, including access to the logs, as referred\
      \ to in Article 12(1), automatically generated by the high-risk AI system, to the extent such logs\
      \ are under the control of the provider;\n\n (d)\n\n cooperate with competent authorities, upon\
      \ a reasoned request, in any action the latter take in relation to the high-risk AI system, in particular\
      \ to reduce and mitigate the risks posed by the high-risk AI system;\n\n (e)\n\n where applicable,\
      \ comply with the registration obligations referred to in Article 49(1), or, if the registration\
      \ is carried out by the provider itself, ensure that the information referred to in point 3 of Section\
      \ A of Annex VIII is correct.\n\n The mandate shall empower the authorised representative to be\
      \ addressed, in addition to or instead of the provider, by the competent authorities, on all issues\
      \ related to ensuring compliance with this Regulation.\n\n 4. The authorised representative shall\
      \ terminate the mandate if it considers or has reason to consider the provider to be acting contrary\
      \ to its obligations pursuant to this Regulation. In such a case, it shall immediately inform the\
      \ relevant market surveillance authority, as well as, where applicable, the relevant notified body,\
      \ about the termination of the mandate and the reasons therefor."
    status: article
  Art.23(1):
    title: Obligations of importers
    text: "1. Before placing a high-risk AI system on the market, importers shall ensure that the system\
      \ is in conformity with this Regulation by verifying that:\n\n (a)\n\n the relevant conformity assessment\
      \ procedure referred to in Article 43 has been carried out by the provider of the high-risk AI system;\n\
      \n (b)\n\n the provider has drawn up the technical documentation in accordance with Article 11 and\
      \ Annex IV;\n\n (c)\n\n the system bears the required CE marking and is accompanied by the EU declaration\
      \ of conformity referred to in Article 47 and instructions for use;\n\n (d)\n\n the provider has\
      \ appointed an authorised representative in accordance with Article 22(1)."
    status: paragraph
  Art.24(1):
    title: Obligations of distributors
    text: 1. Before making a high-risk AI system available on the market, distributors shall verify that
      it bears the required CE marking, that it is accompanied by a copy of the EU declaration of conformity
      referred to in Article 47 and instructions for use, and that the provider and the importer of that
      system, as applicable, have complied with their respective obligations as laid down in Article 16,
      points (b) and (c) and Article 23(3).
    status: paragraph
  Art.25(1):
    title: Responsibilities along the AI value chain
    text: "1. Any distributor, importer, deployer or other third-party shall be considered to be a provider\
      \ of a high-risk AI system for the purposes of this Regulation and shall be subject to the obligations\
      \ of the provider under Article 16, in any of the following circumstances:\n\n (a)\n\n they put\
      \ their name or trademark on a high-risk AI system already placed on the market or put into service,\
      \ without prejudice to contractual arrangements stipulating that the obligations are otherwise allocated;\n\
      \n (b)\n\n they make a substantial modification to a high-risk AI system that has already been placed\
      \ on the market or has already been put into service in such a way that it remains a high-risk AI\
      \ system pursuant to Article 6;\n\n (c)\n\n they modify the intended purpose of an AI system, including\
      \ a general-purpose AI system, which has not been classified as high-risk and has already been placed\
      \ on the market or put into service in such a way that the AI system concerned becomes a high-risk\
      \ AI system in accordance with Article"
    status: paragraph
  Art.25(3):
    title: Responsibilities along the AI value chain
    text: "3. In the case of high-risk AI systems that are safety components of products covered by the\
      \ Union harmonisation legislation listed in Section A of Annex I, the product manufacturer shall\
      \ be considered to be the provider of the high-risk AI system, and shall be subject to the obligations\
      \ under Article 16 under either of the following circumstances:\n\n (a)\n\n the high-risk AI system\
      \ is placed on the market together with the product under the name or trademark of the product manufacturer;\n\
      \n (b)\n\n the high-risk AI system is put into service under the name or trademark of the product\
      \ manufacturer after the product has been placed on the market."
    status: paragraph
  Art.25(5):
    title: Responsibilities along the AI value chain
    text: 5. Paragraphs 2 and 3 are without prejudice to the need to observe and protect intellectual
      property rights, confidential business information and trade secrets in accordance with Union and
      national law.
    status: paragraph
  Art.25(6):
    title: Responsibilities along the AI value chain
    text: "1. Any distributor, importer, deployer or other third-party shall be considered to be a provider\
      \ of a high-risk AI system for the purposes of this Regulation and shall be subject to the obligations\
      \ of the provider under Article 16, in any of the following circumstances:\n\n (a)\n\n they put\
      \ their name or trademark on a high-risk AI system already placed on the market or put into service,\
      \ without prejudice to contractual arrangements stipulating that the obligations are otherwise allocated;\n\
      \n (b)\n\n they make a substantial modification to a high-risk AI system that has already been placed\
      \ on the market or has already been put into service in such a way that it remains a high-risk AI\
      \ system pursuant to Article 6;\n\n (c)\n\n they modify the intended purpose of an AI system, including\
      \ a general-purpose AI system, which has not been classified as high-risk and has already been placed\
      \ on the market or put into service in such a way that the AI system concerned becomes a high-risk\
      \ AI system in accordance with Article 6.\n\n 2. Where the circumstances referred to in paragraph\
      \ 1 occur, the provider that initially placed the AI system on the market or put it into service\
      \ shall no longer be considered to be a provider of that specific AI system for the purposes of\
      \ this Regulation. That initial provider shall closely cooperate with new providers and shall make\
      \ available the necessary information and provide the reasonably expected technical access and other\
      \ assistance that are required for the fulfilment of the obligations set out in this Regulation,\
      \ in particular regarding the compliance with the conformity assessment of high-risk AI systems.\
      \ This paragraph shall not apply in cases where the initial provider has clearly specified that\
      \ its AI system is not to be changed into a high-risk AI system and therefore does not fall under\
      \ the obligation to hand over the documentation.\n\n 3. In the case of high-risk AI systems that\
      \ are safety components of products covered by the Union harmonisation legislation listed in Section\
      \ A of Annex I, the product manufacturer shall be considered to be the provider of the high-risk\
      \ AI system, and shall be subject to the obligations under Article 16 under either of the following\
      \ circumstances:\n\n (a)\n\n the high-risk AI system is placed on the market together with the product\
      \ under the name or trademark of the product manufacturer;\n\n (b)\n\n the high-risk AI system is\
      \ put into service under the name or trademark of the product manufacturer after the product has\
      \ been placed on the market.\n\n 4. The provider of a high-risk AI system and the third party that\
      \ supplies an AI system, tools, services, components, or processes that are used or integrated in\
      \ a high-risk AI system shall, by written agreement, specify the necessary information, capabilities,\
      \ technical access and other assistance based on the generally acknowledged state of the art, in\
      \ order to enable the provider of the high-risk AI system to fully comply with the obligations set\
      \ out in this Regulation. This paragraph shall not apply to third parties making accessible to the\
      \ public tools, services, processes, or components, other than general-purpose AI models, under\
      \ a free and open-source licence.\n\n The AI Office may develop and recommend voluntary model terms\
      \ for contracts between providers of high-risk AI systems and third parties that supply tools, services,\
      \ components or processes that are used for or integrated into high-risk AI systems. When developing\
      \ those voluntary model terms, the AI Office shall take into account possible contractual requirements\
      \ applicable in specific sectors or business cases. The voluntary model terms shall be published\
      \ and be available free of charge in an easily usable electronic format.\n\n 5. Paragraphs 2 and\
      \ 3 are without prejudice to the need to observe and protect intellectual property rights, confidential\
      \ business information and trade secrets in accordance with Union and national law."
    status: article_fallback
    note: Paragraph 6 boundaries not detected; full Article 25 shown.
