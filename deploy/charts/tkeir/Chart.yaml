apiVersion: v2
name: tkeir
description: T-KEIR umbrella chart (profiles via values-*.yaml)
type: application
version: 0.1.0
appVersion: "2.0.0"
dependencies:
  - name: tkeir-vespa
    version: "0.1.0"
    repository: "file://../tkeir-vespa"
    condition: vespa.enabled
    alias: vespa
  - name: tkeir-api
    version: "0.1.0"
    repository: "file://../tkeir-api"
    condition: api.enabled
    alias: api
  - name: tkeir-hmi
    version: "0.1.0"
    repository: "file://../tkeir-hmi"
    condition: hmi.enabled
    alias: hmi
  - name: tkeir-indexer
    version: "0.1.0"
    repository: "file://../tkeir-indexer"
    condition: indexer.enabled
    alias: indexer
  - name: tkeir-inference
    version: "0.1.0"
    repository: "file://../tkeir-inference"
    condition: inference.enabled
    alias: inference
  - name: tkeir-ingest
    version: "0.1.0"
    repository: "file://../tkeir-ingest"
    condition: ingest.enabled
    alias: ingest
  - name: tkeir-audit
    version: "0.1.0"
    repository: "file://../tkeir-audit"
    condition: audit.enabled
    alias: audit
  - name: tkeir-governor
    version: "0.1.0"
    repository: "file://../tkeir-governor"
    condition: governor.enabled
    alias: governor
  - name: tkeir-keycloak
    version: "0.1.0"
    repository: "file://../tkeir-keycloak"
    condition: keycloak.enabled
    alias: keycloak
