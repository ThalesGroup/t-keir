# OSINT source allowlist for tkeir-collector / Osiris.
#
# Only search hits whose hostname matches an entry are kept
# (exact match OR subdomain: host == entry OR host.endswith("." + entry)).
#
# Resolve order (first existing file wins):
#   1. $COLLECTOR_OSINT_SOURCES  (absolute path)
#   2. workspace/collector/osint_sources.yaml  (local override)
#   3. tkeir/configs/collector/osint_sources.yaml  (bundled default)
#
# Osiris mirrors this file at config/collector/osint_sources.yaml
# (override with $OSINT_SOURCES_PATH or $COLLECTOR_OSINT_SOURCES).
#
# Set enabled: false to disable allowlisting (not recommended).

enabled: true

hosts:
