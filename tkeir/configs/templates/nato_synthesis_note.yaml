name: nato_synthesis_note
version: 1
title: NATO synthesis note
description: >
  Grounded synthesis note over the NATO C2SIM OSINT corpus.
  Fills entity disposition, intelligence summary, and operational
  assessment from the fused C2SIM knowledge graph.
slots:
  - name: operational_situation
    type: sparql
    description: Units, assigned tasks, and objectives from the C2SIM graph
    query: |
      PREFIX c2sim: <http://www.sisostds.org/ontologies/C2SIM#>
      SELECT ?unit ?taskName ?obj WHERE {
        ?task c2sim:taskAssignedTo ?unit ;
              c2sim:taskName       ?taskName ;
              c2sim:hasObjective   ?obj .
      } LIMIT 10
    constraints: { min_items: 0, max_items: 10, required: false }
  - name: unit_disposition
    type: entity
    description: Ground / operational entities in the fused graph
    label: null
    query: CWIX 2023
    constraints: { min_items: 0, max_items: 8, required: false }
  - name: intelligence_summary
    type: keyword
    description: Intelligence-related keywords from parent documents
    constraints: { min_items: 0, max_items: 10, required: false }
  - name: assessment
    type: freeform_grounded
    description: >
      Concise operational assessment grounded in retrieved ontology evidence.
      Every claim must cite its source chunk_id.
    constraints: { required: false }
markdown_template: |
  # NATO synthesis: {{ topic or "untitled" }}

  {% if assessment %}
  ## Assessment

  {{ assessment }}
  {% endif %}

  {% if operational_situation %}
  ## Operational situation

  {% for row in operational_situation %}
  - {{ row }}
  {% endfor %}
  {% endif %}

  {% if unit_disposition %}
  ## Unit disposition

  {% for e in unit_disposition %}
  - {{ e.label }} ({{ e.type }})
  {% endfor %}
  {% endif %}

  {% if intelligence_summary %}
  ## Intelligence keywords

  {{ intelligence_summary | join(", ") }}
  {% endif %}
