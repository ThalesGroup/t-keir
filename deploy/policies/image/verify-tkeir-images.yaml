apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tkeir-verify-images
  annotations:
    policies.kyverno.io/title: Verify T-KEIR image signatures
    policies.kyverno.io/category: Supply Chain
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-tkeir-images
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [tkeir]
      verifyImages:
        - imageReferences:
            - "ghcr.io/thalesgroup/t-keir/tkeir-*"
          attestations:
            - type: https://cosign.sigstore.dev/attestation/v1
          mutateDigest: true
          verifyDigest: true
          required: true
# Note: requires cosign keyless identities configured for the CI OIDC issuer.
# SPIRE is required for agents (ADR-0008); this policy covers image trust only.
