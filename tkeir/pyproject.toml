[project]
name = "tkeir"
version = "2.0.0"
description = "t-keir-community"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eric Blaudez" }]
maintainers = [{ name = "Eric Blaudez" }]
keywords = ["Python"]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "beautifulsoup4==4.11.1",
    "emoji==2.0.0",
    "fold-to-ascii==1.0.2.post1",
    "Jinja2>=3.1.4",
    "pysbd>=0.3.4",
    "pandas>=1.5.0,<3.0",
    "numpy>=1.19.0,<2.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "protobuf>=5.29.6,<6.0",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.23.0",
    "spacy==3.6.1",
    "scikit-learn>=1.5.0",
    "torch>=2.2.0",
    "sentencepiece>=0.2.1",
    "transformers>=5.0.0rc3,<6.0",
    "websockets>=10.4",
    "requests>=2.28.0",
    "filelock>=3.0.0",
    "joblib>=1.0.0",
    "markitdown[all]==0.1.2",
    "langdetect>=1.0.9",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0.0",
    "FlagEmbedding>=1.2.10",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
# OWL reasoners via OWLAPY + OWLAPI (Java/JPype). Used by
# POST /rag/ontology/query when prefer_owlapy=true.
# Requires Python >= 3.11 (owlapy 1.6.3+).
owl = [
    "owlapy>=1.6.3; python_full_version >= '3.11'",
]
# Optional Workload API client (import guarded in thot.agent.spiffe).
# PyPI package is currently 0.3.x; env/file SPIFFE_ID works without it.
spiffe = [
    "spiffe>=0.2.0,<0.4",
]

[project.urls]
Homepage = "https://github.com/ThalesGroup/t-keir"
Repository = "https://github.com/ThalesGroup/t-keir"
Documentation = "https://github.com/ThalesGroup/t-keir"
Releases = "https://github.com/ThalesGroup/t-keir/releases"

[project.scripts]
tkeir-pipeline = "thot.tools.pipeline:main"
tkeir-index-documents = "thot.tools.ingest.index_documents:main"
tkeir-rag = "thot.tools.search.app:main"
tkeir-ingest = "thot.tools.ingest.app:main"
tkeir-audit = "thot.audit.app:main"
tkeir-governor = "thot.governor.app:main"
tkeir-init-vespa = "thot.tools.search.init_vespa:main"
tkeir-create-annotation-resource = "thot.tools.annotation.create_annotation_resource:main"
tkeir-beir-eval = "thot.tools.eval.beir_eval:main"
tkeir-mcp = "thot.mcp.server:main"
tkeir-agent = "thot.tools.agent.app:main"
tkeir-compose = "thot.compose.__main__:main"
tkeir-okf = "thot.tools.okf.app:main"
tkeir-okf-export = "thot.okf.exporter:cli_main"
tkeir-collector = "thot.tools.collector.app:main"

[dependency-groups]
dev = [
    "coverage>=7.0",
    "pytest>=7.0",
    "liccheck",
    "pip",
    "setuptools<81",
    "radon>=6.0.1",
    "xenon>=0.9.1",
    "pip-licenses>=4.0",
    "pip-audit>=2.7.0",
    "cyclonedx-bom>=7.3.0",
]
audit = [
    "psycopg[binary]>=3.2",
]
beir = [
    "beir>=2.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
]
models = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.6.0/en_core_web_sm-3.6.0-py3-none-any.whl",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.6.0/en_core_web_md-3.6.0-py3-none-any.whl",
    "fr-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.6.0/fr_core_news_sm-3.6.0-py3-none-any.whl",
    "fr-core-news-md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.6.0/fr_core_news_md-3.6.0-py3-none-any.whl",
    "xx-ent-wiki-sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.6.0/xx_ent_wiki_sm-3.6.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
directory = ".."

[tool.hatch.build.targets.wheel]
packages = ["thot"]

# Do not force-include ``resources/modeling`` (multi-GB embedding caches).
# Runtime resolves resources via TkeirPaths against the repo / workspace.
[tool.hatch.build.targets.wheel.force-include]
"configs" = "tkeir/configs"
"resources/searxng" = "tkeir/resources/searxng"
"resources/ontologies" = "tkeir/resources/ontologies"
"thot/action/schemas" = "thot/action/schemas"
"thot/tools/ingest/schemas" = "thot/tools/ingest/schemas"

[tool.coverage.run]
source = ["thot"]
branch = false

[tool.coverage.report]
include = [
    "*/thot/core/*",
    "*/thot/action/*",
    "*/thot/tools/ingest/*",
    "*/thot/audit/*",
    "*/thot/governor/*",
    "*/thot/okf/*",
    "*/thot/tasks/*Configuration.py",
    "*/thot/tasks/converters/*",
    "*/thot/tasks/keywords/*",
    "*/thot/tasks/morphosyntax/*",
    "*/thot/tasks/syntax/*",
    "*/thot/tasks/ner/NERTaggerConfiguration.py",
    "*/thot/tasks/language_detection/*",
    "*/thot/tasks/pipeline/*",
    "*/thot/tools/pipeline.py",
]
omit = [
    "*/thot/tasks/converters/OrbitConverter.py",
    "*/thot/core/DictionaryTrie.py",
    # Large FastAPI / indexing / workspace surfaces — covered by dedicated
    # unit tests (TestIngest, TestUserWorkspace) but not line-gated here.
    "*/thot/tools/ingest/app.py",
    "*/thot/tools/ingest/index_documents.py",
    "*/thot/tools/ingest/index_passages.py",
    "*/thot/tools/ingest/user_workspace.py",
    "*/thot/tools/ingest/worker.py",
    "*/thot/tools/ingest/ontology_upload.py",
    "*/thot/okf/wiki.py",
    "*/thot/governor/auth.py",
]
fail_under = 90
show_missing = true
skip_covered = false

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["thot", "../tests/unittests", "../tests/functional_tests"]

[tool.ruff.lint]
select = [
    "E4", # import
    "E7", # statement
    "E9", # runtime
    "F",  # pyflakes
]
ignore = [
    "E501", # line length handled by formatter / black
]

[tool.ruff.lint.per-file-ignores]
"../tests/**" = ["E402"]
"tests/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.black]
line-length = 79
target-version = ["py38"]
preview = true

include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.nox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | paper
    | docs
  )/
)
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"
testpaths = [
    "../tests/unittests",
    "../tests/functional_tests",
]
norecursedirs = [
    "bdd",
    "fuzzing",
    "integration",
    "fixtures",
    "indexing",
    ".*",
    "build",
    "dist",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "venv",
    ".venv",
]
python_files = ["Test*.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:'BaseCommand' is deprecated and will be removed in Click 9.0:DeprecationWarning",
    "ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning",
    "ignore:Couldn't find ffmpeg or avconv - defaulting to ffmpeg:RuntimeWarning",
]
markers = [
    "profile: marks tests to be profiled (deselect with '-m \"not profile\"')",
    "benchmark: marks tests to be benchmarked (deselect with '-m \"not benchmark\"')",
    "cli: marks tests for command line interfaces (deselect with '-m \"not cli\"')",
    "slow: marks slow tests (deselect with '-m \"not slow\"')",
]

[tool.liccheck]
authorized_licenses = [
    "BSD",
    "BSD license",
    "BSD-like",
    "new BSD",
    "new BSD license",
    "simplified BSD",
    "simplified BSD License",
    "4-clause BSD",
    "3-clause BSD",
    "2-clause BSD",
    "BSD-4-Clause",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "BSD 4-Clause",
    "BSD 3-Clause",
    "BSD 2-Clause",
    "ISC",
    "ISC License (ISCL)",
    "Apache",
    "Apache license",
    "Apache 2.0",
    "Apache 2.0 license",
    "Apache License 2.0",
    "Apache-2.0",
    "Apache-2.0 AND MIT",
    "http://www.apache.org/licenses/LICENSE-2.0",
    "Apache Software",
    "Apache software license",
    "BSD-2-Clause or Apache-2.0",
    "MIT",
    "MIT license",
    "License :: OSI Approved :: MIT",
    "MIT X11 style",
    "Python",
    "Python Software Foundation",
    "Python Software Foundation license",
    "PSF",
    "Public Domain",
    "Public Domain <http://unlicense.org>",
    "unlicense",
    "LGPL",
    "Lesser GNU General Public License",
    "GNU Library or Lesser General Public License",
    "GNU Library or Lesser General Public License (LGPL)",
    "GNU Lesser General Public License v2 (LGPLv2)",
    "GNU Lesser General Public License v3 (LGPLv3)",
    "GNU Lesser General Public License v3 or later (LGPLv3+)",
    "LGPL-2.1-or-later",
    "LGPL-3-or-later",
    "Mozilla Public License 2.0 (MPL 2.0)",
    "MPL",
    "Historical Permission Notice and Disclaimer (HPND)",
    "HPND",
    "W3C-20150513",
]
unauthorized_licenses = [
    "GPL v3",
    "GNU GPL v3",
    "GNU General Public License",
    "GNU General Public License v3 or later (GPLv3+)",
    "GPL",
    "GNU GPL",
    "GNU General Public License",
    "GPL v2",
    "GNU GPL v2",
    "GNU General Public License",
    "GNU General Public License v2 or later (GPLv2+)"
]

[tool.liccheck.authorized_packages]
aiohttp = ">=3"
flagembedding = ">=1"
autoimport = "*"
hypothesis = ">=3.4"
pygal = "*"
pylint = "*"
pathspec = "*"
text-unidecode = "*"
certifi = "*"
tomlkit = "*"
cachy = "*"
cleo = "*"
clikit = "*"
pastel = "*"
crashtest ="*"
sentencepiece = "*"
cffi = "*"
en-core-web-md = "*"
en-core-web-sm = "*"
fr-core-news-md = "*"
fr-core-news-sm = "*"
pillow = "*"
pymupdf = "*"
regex = "*"
torch = "*"
tqdm = "*"
typing-extensions = "*"
tzdata = "*"

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
no_implicit_optional = false
warn_unused_ignores = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "thot.tasks.tokenizer.Tokenizer",
    "thot.tasks.syntax.SyntacticTagger",
    "thot.tasks.ner.NERTagger",
    "thot.tasks.keywords.KeywordsExtractor",
    "thot.tasks.morphosyntax.MorphoSyntacticTagger",
    "thot.tools.search.ontology_utils",
    "thot.tasks.document_ontology.OntologyRepairer",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "var-annotated",
    "union-attr",
    "operator",
    "call-overload",
    "index",
]
