name: Security and Supply Chain

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "scripts/**"
      - "tkeir/pyproject.toml"
      - "tkeir/uv.lock"
      - ".trivyignore"
      - "deploy/**"

jobs:
  scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Python dependencies
        run: make ci-deps

      - name: pip-audit
        run: make pip-audit

      - name: Build SBOM / AIBOM
        run: make bom

      - name: Trivy scan
        run: make trivy

      - name: OWASP Dependency-Check
        run: make owasp-dependency-check

      - name: Assemble security report
        run: make security-report

      - name: Upload security artifacts
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            reports/security
            reports/bom
            reports/dependency-check
