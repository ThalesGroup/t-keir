# Profile: k8s-dev (P2) — permissive, local registry / host Ollama

global:
  imageTag: dev
  env: dev

vespa:
  enabled: true
  nameOverride: vespa
  resourceProfile: laptop
  persistence:
    size: 10Gi

api:
  enabled: true
  nameOverride: api
  image:
    tag: dev
  env:
    PROVIDER: ollama
    EMBEDDING_MODEL: bge-m3
    LLM_MODEL: mistral-nemo
    OLLAMA_BASE_URL: http://host.docker.internal:11434
    TKEIR_ENV: dev
    VESPA_URL: http://tkeir-vespa:8080
    VESPA_CONFIG_URL: http://tkeir-vespa:19071
    VESPA_USER_SPACE: "dev@tkeir"

hmi:
  enabled: true
  nameOverride: hmi
  image:
    tag: dev
  env:
    API_URL: http://tkeir-api:8090
    AUTH_ENABLED: "false"
    AUTH_URL: http://localhost:3000

indexer:
  enabled: true
  nameOverride: indexer
  image:
    tag: dev
  env:
    VESPA_URL: http://tkeir-vespa:8080
    VESPA_USER_SPACE: "dev@tkeir"
    OLLAMA_BASE_URL: http://host.docker.internal:11434

inference:
  enabled: true
  nameOverride: inference
  mode: external

ingest:
  enabled: false
  nameOverride: ingest
  image:
    tag: dev
  env:
    VESPA_URL: http://tkeir-vespa:8080
    VESPA_CONFIG_URL: http://tkeir-vespa:19071
    VESPA_USER_SPACE: "dev@tkeir"
    OLLAMA_BASE_URL: http://host.docker.internal:11434
    INGEST_AUTH_ENABLED: "false"
governor:
  enabled: false
  mode: observe
audit:
  enabled: false
  nameOverride: audit
  image:
    tag: dev
  env:
    AUDIT_AUTH_ENABLED: "false"
keycloak:
  enabled: false
