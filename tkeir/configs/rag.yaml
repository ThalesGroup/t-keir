# RAG / search runtime. Full field list: docs/configuration/rag.yaml.md
#
# This file lists *overrides*. Defaults live in
# DualHybridConfig / RagConfig — omit a key to keep the code default.
#
# Two retrieval paths (do not copy knobs between them):
#   dual_hybrid.enabled: true  → PassageRetrievalPipeline (production)
#   dual_hybrid.enabled: false → search.* QueryAnalyzer (legacy)
#
# Model / Vespa resolution (highest wins):
#   env (PROVIDER, EMBEDDING_*, LLM_MODEL, VESPA_*) → this file → code defaults

vespa:
  url: http://localhost:8080
  config_url: http://localhost:19071
  timeout_seconds: 60
  user_space: dev@tkeir
  concurrency:
    enrich_workers: 8

models:
  embedding_model: BAAI/bge-m3  # runtime: resources/modeling/net/bge-m3
  llm_model: mistral-nemo
  embedding_dim: 1024

ontology:
  # Align with keywords.yaml → min-keyword-length (HMI export, not retrieval).
  min_keyword_length: 3

prompt:
  chunk_context_mode: svo_ontology
  passages:
    count: 5
    max_chars: 1800
    context_sentences: 2

# Query NLP for dual-hybrid BM25 probes. Other search.* keys are legacy-only.
search:
  enabled: true

dual_hybrid:
  enabled: true
  search_mode: auto
  preprocessing:
    # spaCy languages: code defaults (en/fr/de/… + ar: blank:ar).
    # Override one language here if needed, e.g. ar: blank:ar
    asciifold: true
  retrieval:
    hits: 200
    ranking_profile: hybrid
  ontology_layer:
    index_concepts: true
    index_triples: true
    relation_match: partial
  document_index:
    enabled: true
    search_enabled: true
    chunk_weight: 0.65
    document_weight: 0.35
  rank_profiles:
    # Compiled into Vespa global/user first-phase (`make schemas`).
    passage:
      hybrid:
        dense: 0.70
        sparse: 0.20
        bm25: 0.10
      # Vespa inherits `hybrid`; only concept/relation are application-side.
      hybrid_ontology:
        concept: 0.15
        relation: 0.10
  business_ontology:
    default_dataset: osint
  index_dump:
    enabled: false
  rrf:
    # Deeper pool than the code default (50) before ColBERT.
    top_n_after_fusion: 120
  ontology_scoring:
    enabled: false
  colbert:
    enabled: true
  final_fusion:
    top_k_returned: 10
