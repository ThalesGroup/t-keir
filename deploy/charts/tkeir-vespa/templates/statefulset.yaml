apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tkeir-vespa.fullname" . }}
  labels:
    {{- include "tkeir-vespa.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "tkeir-vespa.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tkeir-vespa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tkeir-vespa.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tkeir-vespa.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vespa
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: query
              containerPort: 8080
            - name: config
              containerPort: 19071
          readinessProbe:
            httpGet:
              path: /state/v1/health
              port: config
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /state/v1/health
              port: config
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
          resources:
            {{- include "tkeir-vespa.resources" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/vespa/var
      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
