replicaCount: 1

image:
  repository: ghcr.io/thalesgroup/t-keir/tkeir-ingest
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8091

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 4Gi

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  readOnlyRootFilesystem: false

env:
  PROVIDER: ollama
  EMBEDDING_MODEL: bge-m3
  LLM_MODEL: mistral-nemo
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  VESPA_URL: ""
  VESPA_CONFIG_URL: ""
  TKEIR_SERVICE: tkeir-ingest
  TKEIR_ENV: dev
  INGEST_AUTH_ENABLED: "false"
  INGEST_INDEX_ENABLED: "true"
  INGEST_ROOT: /var/tkeir/ingest

existingSecret: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
