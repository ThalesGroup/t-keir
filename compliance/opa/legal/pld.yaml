articles:
  Art.4:
    title: Definitions
    text: "For the purposes of this Directive, the following definitions apply:\n\n (1)\n\n ‘product’\
      \ means all movables, even if integrated into, or inter-connected with, another movable or an immovable;\
      \ it includes electricity, digital manufacturing files, raw materials and software;\n\n (2)\n\n\
      \ ‘digital manufacturing file’ means a digital version of, or digital template for, a movable which\
      \ contains the functional information necessary to produce a tangible item by enabling the automated\
      \ control of machinery or tools;\n\n (3)\n\n ‘related service’ means a digital service that is integrated\
      \ into, or inter-connected with, a product in such a way that its absence would prevent the product\
      \ from performing one or more of its functions;\n\n (4)\n\n ‘component’ means any item, whether\
      \ tangible or intangible, raw material or related service, that is integrated into, or inter-connected\
      \ with, a product;\n\n (5)\n\n ‘manufacturer’s control’ means that:\n\n (a)\n\n the manufacturer\
      \ of a product performs or, with regard to actions of a third party, authorises or consents to:\n\
      \n (i)\n\n the integration, inter-connection or supply of a component, including software updates\
      \ or upgrades; or\n\n (ii)\n\n the modification of the product, including substantial modifications;\n\
      \n (b)\n\n the manufacturer of a product has the ability to supply software updates or upgrades,\
      \ themselves or via a third party;\n\n (6)\n\n ‘data’ means data as defined in Article 2, point\
      \ (1), of Regulation (EU) 2022/868 of the European Parliament and of the Council ( 18 ) ;\n\n (7)\n\
      \n ‘making available on the market’ means any supply of a product for distribution, consumption\
      \ or use on the Union market in the course of a commercial activity, whether in return for payment\
      \ or free of charge;\n\n (8)\n\n ‘placing on the market’ means the first making available of a product\
      \ on the Union market;\n\n (9)\n\n ‘putting into service’ means the first use of a product in the\
      \ Union in the course of a commercial activity, whether in return for payment or free of charge,\
      \ in circumstances in which that product has not been placed on the market prior to its first use;\n\
      \n (10)\n\n ‘manufacturer’ means any natural or legal person who:\n\n (a)\n\n develops, manufactures\
      \ or produces a product;\n\n (b)\n\n has a product designed or manufactured, or who, by putting\
      \ their name, trademark or other distinguishing features on that product, presents themselves as\
      \ its manufacturer; or\n\n (c)\n\n develops, manufactures or produces a product for their own use;\n\
      \n (11)\n\n ‘authorised representative’ means any natural or legal person established within the\
      \ Union who has received a written mandate from a manufacturer to act on that manufacturer’s behalf\
      \ in relation to specified tasks;\n\n (12)\n\n ‘importer’ means any natural or legal person who\
      \ places a product from a third country on the Union market;\n\n (13)\n\n ‘fulfilment service provider’\
      \ means any natural or legal person offering, in the course of a commercial activity, at least two\
      \ of the following services: warehousing, packaging, addressing and dispatching of a product, without\
      \ having ownership of that product, excluding postal services as defined in Article 2, point (1),\
      \ of Directive 97/67/EC of the European Parliament and of the Council ( 19 ) , parcel delivery services\
      \ as defined in Article 2, point (2), of Regulation (EU) 2018/644 of the European Parliament and\
      \ of the Council ( 20 ) , and any other postal services or freight transport services;\n\n (14)\n\
      \n ‘distributor’ means any natural or legal person in the supply chain who makes a product available\
      \ on the market, other than the manufacturer or importer of that product;\n\n (15)\n\n ‘economic\
      \ operator’ means a manufacturer of a product or component, a provider of a related service, an\
      \ authorised representative, an importer, a fulfilment service provider or a distributor;\n\n (16)\n\
      \n ‘online platform’ means online platform as defined in Article 3, point (i), of Regulation (EU)\
      \ 2022/2065;\n\n (17)\n\n ‘trade secret’ means trade secret as defined in Article 2, point (1),\
      \ of Directive (EU) 2016/943;\n\n (18)\n\n ‘substantial modification’ means a modification of a\
      \ product after it has been placed on the market or put into service:\n\n (a)\n\n that is considered\
      \ substantial under relevant Union or national rules on product safety; or\n\n (b)\n\n where relevant\
      \ Union or national rules on product safety lay down no threshold on what is to be considered a\
      \ substantial modification, that:\n\n (i)\n\n changes the product’s original performance, purpose\
      \ or type, without that change having been foreseen in the manufacturer’s initial risk assessment;\
      \ and\n\n (ii)\n\n changes the nature of the hazard, creates a new hazard or increases the level\
      \ of risk.\n\n CHAPTER II\n\n SPECIFIC PROVISIONS ON LIABILITY FOR DEFECTIVE PRODUCTS"
    status: article
  Art.5:
    title: Right to compensation
    text: "1. Member States shall ensure that any natural person who suffers damage caused by a defective\
      \ product (the ‘injured person’) is entitled to compensation in accordance with this Directive.\n\
      \n 2. Member States shall ensure that claims for compensation pursuant to paragraph 1 may also be\
      \ brought by:\n\n (a)\n\n a person that succeeded, or was subrogated, to the right of the injured\
      \ person by virtue of Union or national law or contract; or\n\n (b)\n\n a person acting on behalf\
      \ of one or more injured persons by virtue of Union or national law."
    status: article
  Art.6(1):
    title: Damage
    text: "1. The right to compensation pursuant to Article 5 shall apply in respect of only the following\
      \ types of damage:\n\n (a)\n\n death or personal injury, including medically recognised damage to\
      \ psychological health;\n\n (b)\n\n damage to, or destruction of, any property, except:\n\n (i)\n\
      \n the defective product itself;\n\n (ii)\n\n a product damaged by a defective component that is\
      \ integrated into, or inter-connected with, that product by the manufacturer of that product or\
      \ within that manufacturer’s control;\n\n (iii)\n\n property used exclusively for professional purposes;\n\
      \n (c)\n\n destruction or corruption of data that are not used for professional purposes."
    status: paragraph
  Art.6(2):
    title: Damage
    text: 2. The right to compensation pursuant to Article 5 shall cover all material losses resulting
      from the damage referred to in paragraph 1 of this Article. The right to compensation shall also
      cover non-material losses resulting from the damage referred to in paragraph 1 of this Article,
      in so far as they can be compensated for under national law.
    status: paragraph
  Art.6(3):
    title: Damage
    text: 3. This Article does not affect national law relating to compensation for damage under other
      liability regimes.
    status: paragraph
  Art.7:
    title: Defectiveness
    text: "1. A product shall be considered defective where it does not provide the safety that a person\
      \ is entitled to expect or that is required under Union or national law.\n\n 2. In assessing the\
      \ defectiveness of a product, all circumstances shall be taken into account, including:\n\n (a)\n\
      \n the presentation and the characteristics of the product, including its labelling, design, technical\
      \ features, composition and packaging and the instructions for its assembly, installation, use and\
      \ maintenance;\n\n (b)\n\n reasonably foreseeable use of the product;\n\n (c)\n\n the effect on\
      \ the product of any ability to continue to learn or acquire new features after it is placed on\
      \ the market or put into service;\n\n (d)\n\n the reasonably foreseeable effect on the product of\
      \ other products that can be expected to be used together with the product, including by means of\
      \ inter-connection;\n\n (e)\n\n the moment in time when the product was placed on the market or\
      \ put into service or, where the manufacturer retains control over the product after that moment,\
      \ the moment in time when the product left the control of the manufacturer;\n\n (f)\n\n relevant\
      \ product safety requirements, including safety-relevant cybersecurity requirements;\n\n (g)\n\n\
      \ any recall of the product or any other relevant intervention relating to product safety by a competent\
      \ authority or by an economic operator as referred to in Article 8;\n\n (h)\n\n the specific needs\
      \ of the group of users for whose use the product is intended;\n\n (i)\n\n in the case of a product\
      \ whose very purpose is to prevent damage, any failure of the product to fulfil that purpose.\n\n\
      \ 3. A product shall not be considered to be defective for the sole reason that a better product,\
      \ including updates or upgrades for a product, has already been or is subsequently placed on the\
      \ market or put into service."
    status: article
  Art.8:
    title: Economic operators liable for defective products
    text: "1. Member States shall ensure that the following economic operators are liable for damage in\
      \ accordance with this Directive:\n\n (a)\n\n the manufacturer of a defective product;\n\n (b)\n\
      \n the manufacturer of a defective component, where that component was integrated into, or inter-connected\
      \ with, a product within the manufacturer’s control and caused that product to be defective, and\
      \ without prejudice to the liability of the manufacturer referred to in point (a); and\n\n (c)\n\
      \n in the case of a manufacturer of a product or a component established outside the Union, and\
      \ without prejudice to the liability of that manufacturer:\n\n (i)\n\n the importer of the defective\
      \ product or component;\n\n (ii)\n\n the authorised representative of the manufacturer; and\n\n\
      \ (iii)\n\n where there is no importer established within the Union or authorised representative,\
      \ the fulfilment service provider.\n\n The liability of the manufacturer referred to in the first\
      \ subparagraph, point (a), shall also cover any damage caused by a defective component where it\
      \ was integrated into, or inter-connected with, a product within that manufacturer’s control.\n\n\
      \ 2. Any natural or legal person that substantially modifies a product outside the manufacturer’s\
      \ control and thereafter makes it available on the market or puts it into service shall be considered\
      \ to be a manufacturer of that product for the purposes of paragraph 1.\n\n 3. Member States shall\
      \ ensure that, where an economic operator from among those referred to in paragraph 1 and established\
      \ in the Union cannot be identified, each distributor of the defective product is liable where:\n\
      \n (a)\n\n the injured person requests that distributor to identify an economic operator from among\
      \ those referred to in paragraph 1 and established in the Union, or its own distributor that supplied\
      \ it with that product; and\n\n (b)\n\n that distributor fails to identify an economic operator\
      \ or its own distributor, as referred to in point (a), within one month of receiving the request\
      \ referred to in point (a).\n\n 4. Paragraph 3 of this Article shall also apply to any provider\
      \ of an online platform that allows consumers to conclude distance contracts with traders and that\
      \ is not an economic operator, provided that the conditions set out in Article 6(3) of Regulation\
      \ (EU) 2022/2065 are fulfilled.\n\n 5. Where victims fail to obtain compensation because none of\
      \ the persons referred to in paragraphs 1 to 4 can be held liable under this Directive, or because\
      \ the liable persons are insolvent or have ceased to exist, Member States may use existing national\
      \ sectoral compensation schemes or establish new ones under national law, preferably not funded\
      \ by public revenue, to appropriately compensate injured persons who have suffered damage caused\
      \ by defective products."
    status: article
  Art.9:
    title: Disclosure of evidence
    text: "1. Member States shall ensure that, at the request of a person who is claiming compensation\
      \ in proceedings before a national court for damage caused by a defective product (the ‘claimant’)\
      \ and who has presented facts and evidence sufficient to support the plausibility of the claim for\
      \ compensation, the defendant is required to disclose relevant evidence that is at the defendant’s\
      \ disposal, subject to the conditions set out in this Article.\n\n 2. Member States shall ensure\
      \ that, at the request of a defendant that has presented facts and evidence sufficient to demonstrate\
      \ the defendant’s need for evidence for the purposes of countering a claim for compensation, the\
      \ claimant is required, in accordance with national law, to disclose relevant evidence that is at\
      \ the claimant’s disposal.\n\n 3. Member States shall ensure that the disclosure of evidence pursuant\
      \ to paragraphs 1 and 2, and in accordance with national law, is limited to what is necessary and\
      \ proportionate.\n\n 4. Member States shall ensure that, when determining whether the disclosure\
      \ of evidence requested by a party is necessary and proportionate, national courts consider the\
      \ legitimate interests of all parties concerned, including third parties, in particular in relation\
      \ to the protection of confidential information and trade secrets.\n\n 5. Member States shall ensure\
      \ that, where a defendant is required to disclose information that is a trade secret or an alleged\
      \ trade secret, national courts are empowered, upon a duly reasoned request of a party or on their\
      \ own initiative, to take the specific measures necessary to preserve the confidentiality of that\
      \ information when it is used or referred to in the course of or after the legal proceedings.\n\n\
      \ 6. Member States shall ensure that, where a party is required to disclose evidence, national courts\
      \ are empowered, upon a duly reasoned request of the opposing party or where the national court\
      \ concerned deems it appropriate and in accordance with national law, to require such evidence to\
      \ be presented in an easily accessible and easily understandable manner, if such presentation is\
      \ deemed proportionate by the national court in terms of costs and effort for the required party.\n\
      \n 7. This Article does not affect national rules relating to the pre-trial disclosure of evidence,\
      \ where such rules exist."
    status: article
  Art.10:
    title: Burden of proof
    text: "1. Member States shall ensure that a claimant is required to prove the defectiveness of the\
      \ product, the damage suffered and the causal link between that defectiveness and that damage.\n\
      \n 2. The defectiveness of the product shall be presumed where any of the following conditions are\
      \ met:\n\n (a)\n\n the defendant fails to disclose relevant evidence pursuant to Article 9(1);\n\
      \n (b)\n\n the claimant demonstrates that the product does not comply with mandatory product safety\
      \ requirements laid down in Union or national law that are intended to protect against the risk\
      \ of the damage suffered by the injured person; or\n\n (c)\n\n the claimant demonstrates that the\
      \ damage was caused by an obvious malfunction of the product during reasonably foreseeable use or\
      \ under ordinary circumstances.\n\n 3. The causal link between the defectiveness of the product\
      \ and the damage shall be presumed where it has been established that the product is defective and\
      \ that the damage caused is of a kind typically consistent with the defect in question.\n\n 4. A\
      \ national court shall presume the defectiveness of the product or the causal link between its defectiveness\
      \ and the damage, or both, where, despite the disclosure of evidence in accordance with Article\
      \ 9 and taking into account all the relevant circumstances of the case:\n\n (a)\n\n the claimant\
      \ faces excessive difficulties, in particular due to technical or scientific complexity, in proving\
      \ the defectiveness of the product or the causal link between its defectiveness and the damage,\
      \ or both; and\n\n (b)\n\n the claimant demonstrates that it is likely that the product is defective\
      \ or that there is a causal link between the defectiveness of the product and the damage, or both.\n\
      \n 5. The defendant shall have the right to rebut any of the presumptions referred to in paragraphs\
      \ 2, 3 and 4."
    status: article
  Art.11(1):
    title: Exemption from liability
    text: "1. An economic operator as referred to in Article 8 shall not be liable for damage caused by\
      \ a defective product if that economic operator proves any of the following:\n\n (a)\n\n in the\
      \ case of a manufacturer or importer, that it did not place the product on the market or put it\
      \ into service;\n\n (b)\n\n in the case of a distributor, that it did not make the product available\
      \ on the market;\n\n (c)\n\n that it is probable that the defectiveness that caused the damage did\
      \ not exist at the time the product was placed on the market, put into service or, in the case of\
      \ a distributor, made available on the market, or that that defectiveness came into being after\
      \ that moment;\n\n (d)\n\n that the defectiveness that caused the damage is due to compliance of\
      \ the product with legal requirements;\n\n (e)\n\n that the objective state of scientific and technical\
      \ knowledge at the time the product was placed on the market or put into service or during the period\
      \ in which the product was within the manufacturer’s control was not such that the defectiveness\
      \ could be discovered;\n\n (f)\n\n in the case of a manufacturer of a defective component, as referred\
      \ to in Article 8(1), first subparagraph, point (b), that the defectiveness of the product in which\
      \ that component has been integrated is attributable to the design of that product or to the instructions\
      \ given by the manufacturer of that product to the manufacturer of that component;\n\n (g)\n\n in\
      \ the case of a person that modifies a product as referred to in Article 8(2), that the defectiveness\
      \ that caused the damage is related to a part of the product not affected by the modification."
    status: paragraph
  Art.12:
    title: Liability of multiple economic operators
    text: "1. Without prejudice to national law concerning rights of contribution or recourse, Member\
      \ States shall ensure that where two or more economic operators are liable for the same damage pursuant\
      \ to this Directive, they can be held liable jointly and severally.\n\n 2. A manufacturer that integrates\
      \ software as a component in a product shall not have a right of recourse against the manufacturer\
      \ of a defective software component that causes damage where:\n\n (a)\n\n the manufacturer of the\
      \ defective software component was, at the time of the placing on the market of that software component,\
      \ a microenterprise or a small enterprise, meaning an enterprise that, when assessed together with\
      \ all of its partner enterprises as defined in Article 3(2) of the Annex to Commission Recommendation\
      \ 2003/361/EC ( 21 ) and linked enterprises as defined in Article 3(3) of that Annex, if any, is\
      \ a microenterprise as defined in Article 2(3) of that Annex or a small enterprise as defined in\
      \ Article 2(2) of that Annex; and\n\n (b)\n\n the manufacturer that integrated the defective software\
      \ component in the product contractually agreed with the manufacturer of the defective software\
      \ component to waive that right."
    status: article
  Art.13:
    title: Reduction of liability
    text: "1. Without prejudice to national law concerning rights of contribution or recourse, Member\
      \ States shall ensure that the liability of an economic operator is not reduced or disallowed where\
      \ the damage is caused both by the defectiveness of a product and by an act or omission of a third\
      \ party.\n\n 2. The liability of an economic operator may be reduced or disallowed where the damage\
      \ is caused both by the defectiveness of the product and by the fault of the injured person or any\
      \ person for whom the injured person is responsible."
    status: article
  Art.14:
    title: Right of recourse
    text: Where more than one economic operator is liable for the same damage, an economic operator that
      has compensated the injured person shall be entitled to pursue remedies against other economic operators
      liable pursuant to Article 8 in accordance with national law.
    status: article
  Art.15:
    title: Exclusion or limitation of liability
    text: Member States shall ensure that the liability of an economic operator pursuant to this Directive
      is not, in relation to the injured person, limited or excluded by a contractual provision or by
      national law.
    status: article
  Art.16:
    title: Limitation period
    text: "1. Member States shall ensure that a limitation period of three years applies to the initiation\
      \ of proceedings to claim compensation for damage falling within the scope of this Directive. The\
      \ limitation period shall run from the day on which the injured person became aware, or should reasonably\
      \ have become aware, of all of the following:\n\n (a)\n\n the damage;\n\n (b)\n\n the defectiveness;\n\
      \n (c)\n\n the identity of the relevant economic operator that can be held liable for that damage\
      \ under Article 8.\n\n 2. National law regulating the suspension or interruption of the limitation\
      \ period referred to in paragraph 1 shall not be affected by this Directive."
    status: article
  Art.17:
    title: Expiry period
    text: "1. Member States shall ensure that an injured person is no longer entitled to compensation\
      \ pursuant to this Directive upon the expiry of a period of 10 years, unless that injured person\
      \ has, in the meantime, initiated proceedings against an economic operator that can be held liable\
      \ pursuant to Article 8. That period shall run from:\n\n (a)\n\n the date on which the defective\
      \ product which caused the damage was placed on the market or put into service; or\n\n (b)\n\n in\
      \ the case of a substantially modified product, the date on which that product was made available\
      \ on the market or put into service following its substantial modification.\n\n 2. By way of exception\
      \ from paragraph 1, where an injured person has not been able to initiate proceedings within 10\
      \ years of the dates referred to in paragraph 1 due to the latency of a personal injury, the injured\
      \ person shall no longer be entitled to compensation pursuant to this Directive upon the expiry\
      \ of a period of 25 years, unless that injured person has, in the meantime, initiated proceedings\
      \ against an economic operator that can be held liable pursuant to Article 8.\n\n CHAPTER IV\n\n\
      \ FINAL PROVISIONS"
    status: article
  Art.18:
    title: Derogation from development risk defence
    text: "1. Member States may, by way of derogation from Article 11(1), point (e), maintain in their\
      \ legal systems existing measures whereby economic operators are liable even if they prove that\
      \ the objective state of scientific and technical knowledge at the time the product was placed on\
      \ the market or put into service or during the period in which the product was within the manufacturer’s\
      \ control was not such that the defectiveness could be discovered.\n\n Any Member State wishing\
      \ to maintain measures in accordance with this paragraph shall notify the text of the measures to\
      \ the Commission no later than 9 December 2026. The Commission shall inform the other Member States\
      \ thereof.\n\n 2. Member States may, by way of derogation from Article 11(1), point (e), introduce\
      \ or amend in their legal systems measures whereby economic operators are liable even if they prove\
      \ that the objective state of scientific and technical knowledge at the time the product was placed\
      \ on the market or put into service or during the period in which the product was within the manufacturer’s\
      \ control was not such that the defectiveness could be discovered.\n\n 3. The measures referred\
      \ to in paragraph 2 shall be:\n\n (a)\n\n limited to specific categories of products;\n\n (b)\n\n\
      \ justified by public interest objectives; and\n\n (c)\n\n proportionate in that they are suitable\
      \ for securing the attainment of the objectives pursued and do not go beyond what is necessary to\
      \ attain those objectives.\n\n 4. Any Member State wishing to introduce or amend a measure referred\
      \ to in paragraph 2 shall notify the text of the proposed measure to the Commission and shall provide\
      \ a justification of how that measure complies with paragraph 3. The Commission shall inform the\
      \ other Member States thereof.\n\n 5. The Commission may, within six months of receiving a notification\
      \ pursuant to paragraph 4, issue an opinion on the text of the proposed measure and the justification\
      \ for that measure, taking into account any observations received from other Member States. The\
      \ Member State wishing to introduce or amend that measure shall hold that measure in abeyance for\
      \ six months following its notification to the Commission, unless the Commission issues its opinion\
      \ earlier."
    status: article
  Art.22:
    title: Transposition
    text: "1. Member States shall bring into force the laws, regulations and administrative provisions\
      \ necessary to comply with this Directive by 9 December 2026. They shall immediately inform the\
      \ Commission thereof.\n\n When Member States adopt those measures, they shall contain a reference\
      \ to this Directive or shall be accompanied by such a reference on the occasion of their official\
      \ publication. The methods of making such reference shall be laid down by the Member States.\n\n\
      \ 2. Member States shall communicate to the Commission the text of the main measures of national\
      \ law which they adopt in the field covered by this Directive."
    status: article
