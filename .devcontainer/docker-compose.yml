services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.devcontainer
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - vscode-extensions:/home/vscode/.vscode-server
    environment:
      LOCAL_WORKSPACE_FOLDER: ${localWorkspaceFolder}
      DOCKER_BUILDKIT: "1"
      TRANSFORMERS_CACHE: /workspace/.cache/models
      UV_LINK_MODE: copy
    command: sleep infinity
    network_mode: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

volumes:
  vscode-extensions:
