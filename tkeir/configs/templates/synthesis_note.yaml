name: synthesis_note
version: 1
title: Synthesis note
description: >
  Short grounded synthesis of a topic from the fused per-user_space ontology.
slots:
  - name: focus_entity
    type: entity
    description: Primary entity matching the topic
    label: null
    constraints: { min_items: 1, max_items: 1, required: true }
  - name: key_entities
    type: entity
    description: Related entities in the fused graph
    constraints: { min_items: 0, max_items: 8, required: false }
  - name: key_relations
    type: svo_pattern
    description: Subject-verb-object triples for the topic
    constraints: { min_items: 0, max_items: 12, required: false }
  - name: supporting_keywords
    type: keyword
    description: Keywords from parent documents
    constraints: { min_items: 0, max_items: 10, required: false }
  - name: executive_summary
    type: freeform_grounded
    description: Short prose summary grounded in retrieved ontology evidence
    constraints: { required: true }
  - name: open_questions
    type: freeform_grounded
    description: Questions that could not be grounded (may remain unfilled)
    constraints: { required: false }
markdown_template: |
  # Synthesis: {{ topic or "untitled" }}

  {% if executive_summary %}
  ## Executive summary

  {{ executive_summary }}
  {% endif %}

  {% if focus_entity %}
  ## Focus

  - **{{ focus_entity.label }}** ({{ focus_entity.type }})
  {% endif %}

  {% if key_entities %}
  ## Key entities

  {% for e in key_entities %}
  - {{ e.label }} ({{ e.type }})
  {% endfor %}
  {% endif %}

  {% if key_relations %}
  ## Relations

  {% for t in key_relations %}
  - {{ t }}
  {% endfor %}
  {% endif %}

  {% if supporting_keywords %}
  ## Keywords

  {{ supporting_keywords | join(", ") }}
  {% endif %}

  {% if open_questions %}
  ## Open questions

  {{ open_questions }}
  {% endif %}
