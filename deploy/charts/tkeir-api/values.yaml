replicaCount: 1

image:
  repository: ghcr.io/thalesgroup/t-keir/tkeir-api
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8090

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 4Gi

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  readOnlyRootFilesystem: false  # transformers/HF cache under /tmp

env:
  PROVIDER: ollama
  EMBEDDING_MODEL: bge-m3
  LLM_MODEL: mistral-nemo
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  VESPA_URL: ""
  VESPA_CONFIG_URL: ""
  TKEIR_SERVICE: tkeir-api
  TKEIR_ENV: dev

# existingSecret for OPENAI_API_KEY etc.
existingSecret: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
