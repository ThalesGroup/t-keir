# Helm chart dependencies — versions set when Workstream B lands (Phase 2).
charts:
  keycloak:
    name: keycloakx
    repo: https://codecentric.github.io/helm-charts
    version: "7.1.4"
    note: "Optional dependency for P3; Compose uses quay Keycloak image directly"
  sealed_secrets:
    name: sealed-secrets
    repo: https://bitnami-labs.github.io/sealed-secrets
    version: "2.17.2"
    note: "Install via make seal / cluster-plan detection"
  cilium:
    name: cilium
    repo: https://helm.cilium.io/
    version: "1.17.2"
    note: "Linux / Lima only (ADR-0001); agent SPIFFE via ADR-0008"
  cert_manager:
    name: cert-manager
    repo: https://charts.jetstack.io
    version: "v1.17.1"
    note: "Detected by tkeir-installer plan"

# Inference / AIBOM model identities (SHA-256 filled when baked or first fetched).
models:
  embedding:
    name: bge-m3
    provider_default: ollama
    sha256: null
  llm:
    name: mistral-nemo
    provider_default: ollama
    sha256: null
  reranker:
    name: null
    strategy: embedding_cosine
    sha256: null
    note: >
      No separate CrossEncoder (bge-reranker-*) is shipped. Production second
      stage is FlagEmbedding BGE-M3 ColBERT (dual_hybrid.colbert). Legacy
      search.rerank uses embedding_cosine over the same embedding model.
      Opt-in CrossEncoder only via RERANKER_MODEL + RERANK_STRATEGY=cross_encoder.
