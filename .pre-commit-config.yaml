# .pre-commit-config.yaml
# Install: pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type pre-push
# Manual run: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--unsafe]
      - id: check-json

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: check-secrets-staged
        name: Secret pattern scan (staged files)
        entry: make check-secrets-staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: makefile-pre-commit
        name: Makefile pre-commit checks
        entry: make pre-commit
        language: system
        pass_filenames: false
        stages: [pre-push]
