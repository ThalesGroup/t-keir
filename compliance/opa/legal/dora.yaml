  Art.19:
    title: Reporting of major ICT-related incidents and voluntary notification of significant cyber threats
    text: "1. Financial entities shall report major ICT-related incidents to the relevant competent authority\
      \ as referred to in Article 46 in accordance with paragraph 4 of this Article.\n\n Where a financial\
      \ entity is subject to supervision by more than one national competent authority referred to in\
      \ Article 46, Member States shall designate a single competent authority as the relevant competent\
      \ authority responsible for carrying out the functions and duties provided for in this Article.\n\
      \n Credit institutions classified as significant, in accordance with Article 6(4) of Regulation\
      \ (EU) No 1024/2013, shall report major ICT-related incidents to the relevant national competent\
      \ authority designated in accordance with Article 4 of Directive 2013/36/EU, which shall immediately\
      \ transmit that report to the ECB.\n\n For the purpose of the first subparagraph, financial entities\
      \ shall produce, after collecting and analysing all relevant information, the initial notification\
      \ and reports referred to in paragraph 4 of this Article using the templates referred to in Article\
      \ 20 and submit them to the competent authority. In the event that a technical impossibility prevents\
      \ the submission of the initial notification using the template, financial entities shall notify\
      \ the competent authority about it via alternative means.\n\n The initial notification and reports\
      \ referred to in paragraph 4 shall include all information necessary for the competent authority\
      \ to determine the significance of the major ICT-related incident and assess possible cross-border\
      \ impacts.\n\n Without prejudice to the reporting pursuant to the first subparagraph by the financial\
      \ entity to the relevant competent authority, Member States may additionally determine that some\
      \ or all financial entities shall also provide the initial notification and each report referred\
      \ to in paragraph 4 of this Article using the templates referred to in Article 20 to the competent\
      \ authorities or the computer security incident response teams (CSIRTs) designated or established\
      \ in accordance with Directive (EU) 2022/2555.\n\n 2. Financial entities may, on a voluntary basis,\
      \ notify significant cyber threats to the relevant competent authority when they deem the threat\
      \ to be of relevance to the financial system, service users or clients. The relevant competent authority\
      \ may provide such information to other relevant authorities referred to in paragraph 6.\n\n Credit\
      \ institutions classified as significant, in accordance with Article 6(4) of Regulation (EU) No\
      \ 1024/2013, may, on a voluntary basis, notify significant cyber threats to relevant national competent\
      \ authority, designated in accordance with Article 4 of Directive 2013/36/EU, which shall immediately\
      \ transmit the notification to the ECB.\n\n Member States may determine that those financial entities\
      \ that on a voluntary basis notify in accordance with the first subparagraph may also transmit that\
      \ notification to the CSIRTs designated or established in accordance with Directive (EU) 2022/2555.\n\
      \n 3. Where a major ICT-related incident occurs and has an impact on the financial interests of\
      \ clients, financial entities shall, without undue delay as soon as they become aware of it, inform\
      \ their clients about the major ICT-related incident and about the measures that have been taken\
      \ to mitigate the adverse effects of such incident.\n\n In the case of a significant cyber threat,\
      \ financial entities shall, where applicable, inform their clients that are potentially affected\
      \ of any appropriate protection measures which the latter may consider taking.\n\n 4. Financial\
      \ entities shall, within the time limits to be laid down in accordance with Article 20, first paragraph,\
      \ point (a), point (ii), submit the following to the relevant competent authority:\n\n (a)\n\n an\
      \ initial notification;\n\n (b)\n\n an intermediate report after the initial notification referred\
      \ to in point (a), as soon as the status of the original incident has changed significantly or the\
      \ handling of the major ICT-related incident has changed based on new information available, followed,\
      \ as appropriate, by updated notifications every time a relevant status update is available, as\
      \ well as upon a specific request of the competent authority;\n\n (c)\n\n a final report, when the\
      \ root cause analysis has been completed, regardless of whether mitigation measures have already\
      \ been implemented, and when the actual impact figures are available to replace estimates.\n\n 5.\
      \ Financial entities may outsource, in accordance with Union and national sectoral law, the reporting\
      \ obligations under this Article to a third-party service provider. In case of such outsourcing,\
      \ the financial entity remains fully responsible for the fulfilment of the incident reporting requirements.\n\
      \n 6. Upon receipt of the initial notification and of each report referred to in paragraph 4, the\
      \ competent authority shall, in a timely manner, provide details of the major ICT-related incident\
      \ to the following recipients based, as applicable, on their respective competences:\n\n (a)\n\n\
      \ EBA, ESMA or EIOPA;\n\n (b)\n\n the ECB, in the case of financial entities referred to in Article\
      \ 2(1), points (a), (b) and (d);\n\n (c)\n\n the competent authorities, single points of contact\
      \ or CSIRTs designated or established in accordance with Directive (EU) 2022/2555;\n\n (d)\n\n the\
      \ resolution authorities, as referred to in Article 3 of Directive 2014/59/EU, and the Single Resolution\
      \ Board (SRB) with respect to entities referred to in Article 7(2) of Regulation (EU) No 806/2014\
      \ of the European Parliament and of the Council ( 37 ) , and with respect to entities and groups\
      \ referred to in Article 7(4)(b) and (5) of Regulation (EU) No 806/2014 if such details concern\
      \ incidents that pose a risk to ensuring critical functions within the meaning of Article 2(1),\
      \ point (35), of Directive 2014/59/EU; and\n\n (e)\n\n other relevant public authorities under national\
      \ law.\n\n 7. Following receipt of information in accordance with paragraph 6, EBA, ESMA or EIOPA\
      \ and the ECB, in consultation with ENISA and in cooperation with the relevant competent authority,\
      \ shall assess whether the major ICT-related incident is relevant for competent authorities in other\
      \ Member States. Following that assessment, EBA, ESMA or EIOPA shall, as soon as possible, notify\
      \ relevant competent authorities in other Member States accordingly. The ECB shall notify the members\
      \ of the European System of Central Banks on issues relevant to the payment system. Based on that\
      \ notification, the competent authorities shall, where appropriate, take all of the necessary measures\
      \ to protect the immediate stability of the financial system.\n\n 8. The notification to be done\
      \ by ESMA pursuant to paragraph 7 of this Article shall be without prejudice to the responsibility\
      \ of the competent authority to urgently transmit the details of the major ICT-related incident\
      \ to the relevant authority in the host Member State, where a central securities depository has\
      \ significant cross-border activity in the host Member State, the major ICT-related incident is\
      \ likely to have severe consequences for the financial markets of the host Member State and where\
      \ there are cooperation arrangements among competent authorities related to the supervision of financial\
      \ entities."
    status: article
