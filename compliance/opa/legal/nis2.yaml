    status: article_fallback
    note: Paragraph 3 boundaries not detected; full Article 20 shown.
  Art.21(1):
    title: Cybersecurity risk-management measures
    text: "1. Member States shall ensure that essential and important entities take appropriate and proportionate\
      \ technical, operational and organisational measures to manage the risks posed to the security of\
      \ network and information systems which those entities use for their operations or for the provision\
      \ of their services, and to prevent or minimise the impact of incidents on recipients of their services\
      \ and on other services.\n\n Taking into account the state-of-the-art and, where applicable, relevant\
      \ European and international standards, as well as the cost of implementation, the measures referred\
      \ to in the first subparagraph shall ensure a level of security of network and information systems\
      \ appropriate to the risks posed. When assessing the proportionality of those measures, due account\
      \ shall be taken of the degree of the entity’s exposure to risks, the entity’s size and the likelihood\
      \ of occurrence of incidents and their severity, including their societal and economic impact."
    status: paragraph
  Art.21(2)(a):
    title: Cybersecurity risk-management measures
    text: (a) policies on risk analysis and information system security;
    status: point
  Art.21(2)(b):
    title: Cybersecurity risk-management measures
