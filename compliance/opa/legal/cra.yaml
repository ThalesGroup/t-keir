articles:
  AnnexI.PartI.1(a):
    title: Annex I Part I
    text: (a) be made available on the market without known exploitable vulnerabilities;
    status: annex_point
  AnnexI.PartI.1(b):
    title: Annex I Part I
    text: (b) be made available on the market with a secure by default configuration, unless otherwise
      agreed between manufacturer and business user in relation to a tailor-made product with digital
      elements, including the possibility to reset the product to its original state;
    status: annex_point
  AnnexI.PartI.1(c):
    title: Annex I Part I
    text: (c) ensure that vulnerabilities can be addressed through security updates, including, where
      applicable, through automatic security updates that are installed within an appropriate timeframe
      enabled as a default setting, with a clear and easy-to-use opt-out mechanism, through the notification
      of available updates to users, and the option to temporarily postpone them;
    status: annex_point
  AnnexI.PartI.1(d):
    title: Annex I Part I
    text: (d) ensure protection from unauthorised access by appropriate control mechanisms, including
      but not limited to authentication, identity or access management systems, and report on possible
      unauthorised access;
    status: annex_point
  AnnexI.PartI.1(e):
    title: Annex I Part I
    text: (e) protect the confidentiality of stored, transmitted or otherwise processed data, personal
      or other, such as by encrypting relevant data at rest or in transit by state of the art mechanisms,
      and by using other technical means;
    status: annex_point
  AnnexI.PartI.1(f):
    title: Annex I Part I
    text: (f) protect the integrity of stored, transmitted or otherwise processed data, personal or other,
      commands, programs and configuration against any manipulation or modification not authorised by
      the user, and report on corruptions;
    status: annex_point
  AnnexI.PartI.1(g):
    title: Annex I Part I
    text: (g) process only data, personal or other, that are adequate, relevant and limited to what is
      necessary in relation to the intended purpose of the product with digital elements (data minimisation);
    status: annex_point
  AnnexI.PartI.1(h):
    title: Annex I Part I
    text: (h) protect the availability of essential and basic functions, also after an incident, including
      through resilience and mitigation measures against denial-of-service attacks;
    status: annex_point
  AnnexI.PartI.1(i):
    title: Annex I Part I
    text: (i) minimise the negative impact by the products themselves or connected devices on the availability
      of services provided by other devices or networks;
    status: annex_point
  AnnexI.PartI.1(j):
    title: Annex I Part I
    text: (j) be designed, developed and produced to limit attack surfaces, including external interfaces;
    status: annex_point
  AnnexI.PartI.1(k):
    title: Annex I Part I
    text: (k) be designed, developed and produced to reduce the impact of an incident using appropriate
      exploitation mitigation mechanisms and techniques;
    status: annex_point
  AnnexI.PartI.1(l):
    title: Annex I Part I
    text: (l) provide security related information by recording and monitoring relevant internal activity,
      including the access to or modification of data, services or functions, with an opt-out mechanism
      for the user;
    status: annex_point
  AnnexI.PartI.1(m):
    title: Annex I Part I
    text: (m) provide the possibility for users to securely and easily remove on a permanent basis all
      data and settings and, where such data can be transferred to other products or systems, ensure that
      this is done in a secure manner.
    status: annex_point
  AnnexI.PartI.1(n):
    title: Annex I Part I
    text: "(1)\n\n Products with digital elements shall be designed, developed and produced in such a\
      \ way that they ensure an appropriate level of cybersecurity based on the risks.\n\n (2)\n\n On\
      \ the basis of the cybersecurity risk assessment referred to in Article 13(2) and where applicable,\
      \ products with digital elements shall:\n\n (a)\n\n be made available on the market without known\
      \ exploitable vulnerabilities;\n\n (b)\n\n be made available on the market with a secure by default\
      \ configuration, unless otherwise agreed between manufacturer and business user in relation to a\
      \ tailor-made product with digital elements, including the possibility to reset the product to its\
      \ original state;\n\n (c)\n\n ensure that vulnerabilities can be addressed through security updates,\
      \ including, where applicable, through automatic security updates that are installed within an appropriate\
      \ timeframe enabled as a default setting, with a clear and easy-to-use opt-out mechanism, through\
      \ the notification of available updates to users, and the option to temporarily postpone them;\n\
      \n (d)\n\n ensure protection from unauthorised access by appropriate control mechanisms, including\
      \ but not limited to authentication, identity or access management systems, and report on possible\
      \ unauthorised access;\n\n (e)\n\n protect the confidentiality of stored, transmitted or otherwise\
      \ processed data, personal or other, such as by encrypting relevant data at rest or in transit by\
      \ state of the art mechanisms, and by using other technical means;\n\n (f)\n\n protect the integrity\
      \ of stored, transmitted or otherwise processed data, personal or other, commands, programs and\
      \ configuration against any manipulation or modification not authorised by the user, and report\
      \ on corruptions;\n\n (g)\n\n process only data, personal or other, that are adequate, relevant\
      \ and limited to what is necessary in relation to the intended purpose of the product with digital\
      \ elements (data minimisation);\n\n (h)\n\n protect the availability of essential and basic functions,\
      \ also after an incident, including through resilience and mitigation measures against denial-of-service\
      \ attacks;\n\n (i)\n\n minimise the negative impact by the products themselves or connected devices\
      \ on the availability of services provided by other devices or networks;\n\n (j)\n\n be designed,\
      \ developed and produced to limit attack surfaces, including external interfaces;\n\n (k)\n\n be\
      \ designed, developed and produced to reduce the impact of an incident using appropriate exploitation\
      \ mitigation mechanisms and techniques;\n\n (l)\n\n provide security related information by recording\
      \ and monitoring relevant internal activity, including the access to or modification of data, services\
      \ or functions, with an opt-out mechanism for the user;\n\n (m)\n\n provide the possibility for\
      \ users to securely and easily remove on a permanent basis all data and settings and, where such\
      \ data can be transferred to other products or systems, ensure that this is done in a secure manner."
    status: annex_part_fallback
    note: Point (n) not isolated; full Part I shown.
