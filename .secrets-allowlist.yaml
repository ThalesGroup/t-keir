# Paths and patterns exempt from secret scanning.
# Dev-only credentials in Keycloak realm and compose examples are intentional.

paths:
  - deploy/compose/.env.example
  - tkeir-hmi/.env.local.example
  - deploy/keycloak/realm-tkeir.json
  - deploy/charts/**/values*.yaml
  - tkeir/tests/**
  - docs/**
  - SECURITY.md
  - INSTALL.md
  - USAGE.md
  - README.md
  - scripts/scan_secrets.py
  - .secrets-allowlist.yaml

# Known-safe placeholder values (case-sensitive match on captured secret).
placeholders:
  - change-me
  - change-me-in-production
  - dev-auth-secret-change-me-in-production-32b
  - your-secret-here
  - replace-me
  - audit
  - keycloak
  - admin
  - demo-user
  - demo-auditor
  - demo-admin
