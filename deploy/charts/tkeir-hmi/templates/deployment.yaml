apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tkeir-hmi.fullname" . }}
  labels:
    {{- include "tkeir-hmi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tkeir-hmi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tkeir-hmi.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tkeir-hmi.serviceAccountName" . }}
      securityContext:
        {{- include "tkeir-lib.securityContext" . | nindent 8 }}
      containers:
        - name: tkeir-hmi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "tkeir-lib.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            {{- range $k, $v := .Values.env }}
            {{- if ne $v nil }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          livenessProbe:
            {{- include "tkeir-lib.livenessProbe" (dict "port" "http" "path" "/api/healthz" "initialDelaySeconds" 15) | nindent 12 }}
          readinessProbe:
            {{- include "tkeir-lib.readinessProbe" (dict "port" "http" "path" "/api/healthz" "initialDelaySeconds" 5) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tkeir-hmi.fullname" . }}
  labels:
    {{- include "tkeir-hmi.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "tkeir-hmi.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
