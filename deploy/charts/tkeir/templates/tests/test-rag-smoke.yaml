{{- if index .Values "api" "enabled" }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-rag-smoke"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.5.0
      command:
        - /bin/sh
        - -c
        - |
          set -e
          API="http://{{ .Release.Name }}-api:8090"
          echo "GET $API/health"
          curl -fsS --retry 10 --retry-delay 3 "$API/health"
          echo
          echo "POST $API/rag/query (may 502/503 if Vespa empty — health is the gate)"
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$API/rag/query" \
            -H "content-type: application/json" \
            -d '{"query":"smoke","language":"en","hits":1}' || true)
          echo "status=$code"
          head -c 200 /tmp/out || true
          echo
          test "$code" = "200" -o "$code" = "502" -o "$code" = "503"
{{- end }}
