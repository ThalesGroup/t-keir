  AnnexI.PartII.1:
    title: Annex I Part II
    text: (1) identify and document vulnerabilities and components contained in products with digital
      elements, including by drawing up a software bill of materials in a commonly used and machine-readable
      format covering at the very least the top-level dependencies of the products;
    status: annex_paragraph
  AnnexI.PartII.2:
    title: Annex I Part II
    text: (2) in relation to the risks posed to products with digital elements, address and remediate
      vulnerabilities without delay, including by providing security updates; where technically feasible,
      new security updates shall be provided separately from functionality updates;
    status: annex_paragraph
  AnnexI.PartII.3:
    title: Annex I Part II
    text: (3) apply effective and regular tests and reviews of the security of the product with digital
      elements;
    status: annex_paragraph
  AnnexI.PartII.4:
    title: Annex I Part II
    text: (4) once a security update has been made available, share and publicly disclose information
      about fixed vulnerabilities, including a description of the vulnerabilities, information allowing
      users to identify the product with digital elements affected, the impacts of the vulnerabilities,
      their severity and clear and accessible information helping users to remediate the vulnerabilities;
      in duly justified cases, where manufacturers consider the security risks of publication to outweigh
      the security benefits, they may delay making public information regarding a fixed vulnerability
      until after users have been given the possibility to apply the relevant patch;
    status: annex_paragraph
  AnnexI.PartII.5:
    title: Annex I Part II
    text: (5) put in place and enforce a policy on coordinated vulnerability disclosure;
    status: annex_paragraph
  AnnexI.PartII.6:
    title: Annex I Part II
    text: (6) take measures to facilitate the sharing of information about potential vulnerabilities in
      their product with digital elements as well as in third-party components contained in that product,
      including by providing a contact address for the reporting of the vulnerabilities discovered in
      the product with digital elements;
    status: annex_paragraph
  AnnexI.PartII.7:
    title: Annex I Part II
    text: (7) provide for mechanisms to securely distribute updates for products with digital elements
      to ensure that vulnerabilities are fixed or mitigated in a timely manner and, where applicable for
      security updates, in an automatic manner;
    status: annex_paragraph
  Art.6(1):
    title: Requirements for products with digital elements
    text: "Products with digital elements shall be made available on the market only where:\n\n (a)\n\n\
      \ they meet the essential cybersecurity requirements set out in Part I of Annex I, provided that\
      \ they are properly installed, maintained, used for their intended purpose or under conditions which\
      \ can reasonably be foreseen, and, where applicable, the necessary security updates have been installed;\
      \ and\n\n (b)\n\n the processes put in place by the manufacturer comply with the essential cybersecurity\
      \ requirements set out in Part II of Annex I."
    status: article_fallback
    note: Paragraph 1 boundaries not detected; full Article 6 shown.
