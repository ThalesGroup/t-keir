name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "deploy/images/**"
      - "tkeir/**"
      - "tkeir-hmi/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Shared Python runtime — built once; thin services reuse it via bake context.
  tkeir-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake tkeir-lib
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/t-keir
          TAG: ${{ github.sha }}
          CONTEXT: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXTRA=--load
          else
            EXTRA=--push
          fi
          docker buildx bake -f deploy/images/docker-bake.hcl \
            --set "*.platform=linux/amd64" \
            tkeir-lib \
            --progress=plain \
            $EXTRA

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign tkeir-lib (keyless)
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/t-keir
          TAG: ${{ github.sha }}
          COSIGN_YES: "true"
        run: cosign sign --yes "${REGISTRY}/tkeir-lib:${TAG}"

  build:
    needs: [tkeir-lib]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - tkeir-api
          - tkeir-indexer
          - tkeir-hmi
          - tkeir-ingest
          - tkeir-audit
          - tkeir-governor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake image
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/t-keir
          TAG: ${{ github.sha }}
          CONTEXT: ${{ github.workspace }}
        run: |
          # Bake pulls in target:tkeir-lib via contexts (BuildKit cache / rebuild).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXTRA=--load
          else
            EXTRA=--push
          fi
          docker buildx bake -f deploy/images/docker-bake.hcl \
            --set "*.platform=linux/amd64" \
            "${{ matrix.target }}" \
            --progress=plain \
            $EXTRA

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/t-keir
          TAG: ${{ github.sha }}
          COSIGN_YES: "true"
        run: cosign sign --yes "${REGISTRY}/${{ matrix.target }}:${TAG}"
