# RAG API runtime configuration (retrieval UI and ontology export).
# Keep ontology.min_keyword_length aligned with keywords.yaml → min-keyword-length.
#
# Full documentation (every field + algorithms):
#   docs/configuration/rag.yaml.md
# Catalog of all configs:
#   docs/configuration/index.md
#
# Model resolution for search/index (highest wins):
#   1. environment variables (PROVIDER, EMBEDDING_MODEL, LLM_MODEL,
#      RERANKER_MODEL, RERANK_STRATEGY, EMBEDDING_DIM)
#   2. models: / search.rerank.strategy below
#   3. provider hard-coded defaults in thot.core.LlmWrapper
#
# Vespa endpoints / timeouts (highest wins):
#   1. VESPA_URL, VESPA_CONFIG_URL, VESPA_TIMEOUT_SECONDS
#   2. vespa: block below
#   3. http://localhost:8080 / :19071 / 60s

vespa:
  url: http://localhost:8080
  config_url: http://localhost:19071
  timeout_seconds: 60
  # Auth-off / CLI fallback. Live API/ingest resolve from Keycloak JWT
  # (preferred_username → email → sub); see thot.tools.search.user_space.
  user_space: dev@tkeir
  concurrency:
    # Parallel parent-document fetches after search (API enrich path).
    enrich_workers: 8

models:
  # Local FlagEmbedding BGE-M3 (dense 1024-d + sparse lexical weights).
  # Override with EMBEDDING_MODEL / EMBEDDING_DIM env vars if needed.
  embedding_model: BAAI/bge-m3  # source id; runtime loads resources/modeling/net/bge-m3
  llm_model: mistral-nemo
  # HuggingFace CrossEncoder id for strategy=cross_encoder
  # (sentence-transformers). Unused when strategy=embedding_cosine.
  reranker_model: BAAI/bge-reranker-v2-m3
  embedding_dim: 1024

ontology:
  # Minimum number of characters for a keyword label exposed in the HMI/RAG API.
  min_keyword_length: 3
  max_entities: 120
  max_keywords: 60

prompt:
  # chunk_excerpts: copy retrieved chunk text into the LLM prompt (default).
  # svo_ontology: KEY PASSAGES + deduplicated SVO facts (no raw chunk excerpts).
  chunk_context_mode: svo_ontology
  max_svo_triples: 80
  # KEY PASSAGES injected into the LLM prompt (proximity-ranked windows).
  passages:
    count: 5              # number of passages
    max_chars: 1800       # max characters per passage
    context_sentences: 2  # neighbor sentences around the best window
  # Chunk excerpts (chunk_excerpts mode) and prompt chunk filtering.
  max_chars_per_chunk: 1800
  max_chunks_for_prompt: 10

search:
  # When enabled, raw queries are analyzed with the full NLP pipeline
  # (tokenizer → morphosyntax → NER → syntax → keywords). Used by:
  # - PassageRetrievalPipeline (dual_hybrid.enabled=true) for BM25 probe terms
  # - QueryAnalyzerTask (dual_hybrid.enabled=false) for legacy single-arm YQL
  enabled: true
  use_chunk_embedding: true
  # Dense + sparse + BM25 on chunk_text (no separate question tensor).
  use_text_raw: true
  use_ner: true
  use_svo: true
  use_keywords: true
  use_lemmas: true
  # Legacy QueryAnalyzer path (dual_hybrid.enabled=false) maps auto → hybrid.
  ranking_profile: auto
  hits: 50
  max_yql_terms: 48
  # Informational weights (legacy QueryAnalyzer path).
  weight_chunk_embedding: 0.40
  weight_text_raw_bm25: 0.60
  # Second-stage rerank: cross_encoder | embedding_cosine (LLM forbidden).
  # Skipped when dual_hybrid.enabled (pipeline runs ColBERT + OntologyRescorer).
  rerank:
    enabled: true
    strategy: embedding_cosine
    # First-stage Vespa hits sent to the reranker (truncated to search.hits after).
    candidates: 100

# Passage retrieval over Vespa ``global`` (index) + ``user`` (streaming).
# Schemas generated by `make schemas` from models.embedding_dim + rank weights.
# Query-time business ontology is optional (default on).
dual_hybrid:
  enabled: true
  # Search mode: auto | global | user | both
  # BEIR smoke/eval force ``global`` regardless of this default.
  search_mode: auto
  preprocessing:
    # Lemmatize with diacritics, then optionally ASCII-fold (default on).
    asciifold: true
    min_token_length: 3
    # Keep numerals for claim/stat queries (1/2000, 5%, B12…).
    drop_numbers: false
    extra_stopwords: []
    # Model selected by detected / request language. `default` is mandatory.
    # Install: python -m spacy download <model>
    spacy_models:
      default: xx_ent_wiki_sm
      xx: xx_ent_wiki_sm
      en: en_core_web_md
      fr: fr_core_news_md
      de: de_core_news_md
      es: es_core_news_md
      it: it_core_news_md
      pt: pt_core_news_md
      nl: nl_core_news_md
      zh: zh_core_web_md
      ja: ja_core_news_md
  retrieval:
    # Hits per Vespa schema (global and/or user).
    hits: 200
    ranking_profile: hybrid
  rank_profiles:
    # Feeds `make schemas` first-phase weights on global.sd / user.sd.
    # Local BGE-M3 alone ≈ SPLADE on SciFact; bias hybrid toward dense.
    passage:
      hybrid:
        dense: 0.70
        sparse: 0.20
        bm25: 0.10
  # Tag passages with datasets/<name>/business_ontology.yaml at index time /
  # pass the YAML on search (defaults on).
  business_ontology:
    index_enabled: true
    search_enabled: true
  # One JSON dump per indexed document under workspace/ (gitignored).
  index_dump:
    enabled: false
    path: workspace/index-dumps
    save_document: false
  query_expansion:
    # Resolve query (+ NLP seeds when nlp_seed_expansion applies) against the
    # per-request business ontology; expand synonym / narrower / broader /
    # related / paraphrase for BM25 probe + ontology_concepts.
    enabled: true
    max_terms_per_relation: 5
    weights:
      original: 1.0
      synonyms: 0.9
      narrower: 0.6
      broader: 0.3
      related: 0.2
      paraphrase: 0.85
    nlp_seed_expansion:
      enabled: true
      min_tokens: 32
      # Also trigger on multi-sentence queries (even if under min_tokens).
      min_sentences: 2
  rrf:
    k: 60
    # Used when search_mode=both (fuse global + user ranks).
    arm_weights:
      global: 0.55
      user: 0.45
    top_n_after_fusion: 120
  ontology_scoring:
    # Optional OntologyRescorer after first-stage ranks (before ColBERT).
    enabled: false
    rescore_weight: 0.13
    match_weights:
      exact: 1.0
      synonym: 0.9
      narrower: 0.6
      broader: 0.3
      shared_parent: 0.2
    max_traversal_depth: 1
    normalize_by_query_concepts: true
  # Production + BEIR second stage (BGE-M3 ColBERT MaxSim).
  colbert:
    enabled: true
    top_m: 40
    first_stage_weight: 0.55
    colbert_weight: 0.45
    tail_weight: 0.15
    batch_size: 8
    rrf_k: 60
    pool: 100
  final_fusion:
    # Truncate after ColBERT / OntologyRescorer.
    top_k_returned: 10
  fallback:
    neutral_score: 0.5
