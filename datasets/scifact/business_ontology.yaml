# SciFact business ontology — v3.0.0
# Optimised for dual-hybrid query-expansion + overlap scoring on BEIR SciFact.
#
# ═══════════════════════════════════════════════════════════════════════════════
# DESIGN RATIONALE (v3)
# ═══════════════════════════════════════════════════════════════════════════════
#
# The core IR challenge in SciFact is LEXICAL MISMATCH between claim (query)
# vocabulary and abstract (document) vocabulary.  Four paraphrase patterns
# dominate the dataset (from Wadden et al. 2020 examples + SciFact-Open):
#
#   P1 · ENTITY SYNONYMY
#        Claim uses a lay/abbreviation form; abstract uses the full scientific
#        term (or vice versa).
#        e.g.  "fruit flies"      ↔  "Drosophila"
#              "slows aging"      ↔  "produces life span extension"
#              "gut bacteria"     ↔  "gastrointestinal microbiota"
#
#   P2 · CAUSAL / DIRECTIONAL PARAPHRASE
#        Claim uses a causal verb; abstract uses an outcome noun/phrase that
#        implies the same direction.
#        e.g.  "impairs lipogenesis"  ↔  "increased lipogenesis" (REFUTES: direction flip)
#              "inhibits tumor"       ↔  "knockout leads to inhibition"
#              "improves diabetes"    ↔  "strong association with resolution of T2DM"
#
#   P3 · SPECIFICITY SHIFT
#        Claim is generic; abstract is specific (or vice versa).
#        e.g.  "cancer care"          ↔  "gynecological cancer survival"
#              "missense mutation"    ↔  "somatic NT5C2 variant"
#              "imaging technique"   ↔  "fiberoptic confocal microscopy"
#
#   P4 · MECHANISTIC ABSTRACTION
#        Claim names the mechanism; abstract names the assay/protein/pathway.
#        e.g.  "cardiac injury"       ↔  "elevated troponin"
#              "colonization resist." ↔  "C. difficile germination suppressed"
#              "immune activation"   ↔  "CD4+ T-cell proliferation"
#
# To bridge these gaps this ontology introduces three new field types
# alongside the standard ones:
#
#   paraphrase_bridges  — explicit (claim_form, document_form) pairs drawn
#                         from real SciFact examples; used for direct term
#                         substitution during query expansion.
#
#   directionality_terms — verbs/nouns that express effect direction in
#                          claims; mapped to the typical document-side
#                          expression so a hybrid scorer can match
#                          "inhibits X" to "decrease in X" or "X suppression".
#
#   model_organisms     — non-human species names that SciFact claims
#                         routinely use as proxies for human biology;
#                         grouped under the relevant concept so they expand
#                         queries about e.g. "mice" to fetch abstracts about
#                         "murine" / "in vivo" studies.
#
# Standard fields retained: concept_id, preferred_label, synonyms,
# surface_forms, broader, narrower, related.
# ═══════════════════════════════════════════════════════════════════════════════

concepts:

  # ════════════════════════════════════════════════════════════════════════════
  # CROSS-CUTTING PARAPHRASE HUBS
  # These are NOT biomedical topics — they are linguistic/relational patterns
  # that appear across ALL topics in SciFact claims.  Placing them at the top
  # ensures the expander picks them up before domain concepts.
  # ════════════════════════════════════════════════════════════════════════════

  - concept_id: CAUSAL_POSITIVE
    preferred_label: promotes
    synonyms:
      - increases
      - enhances
      - upregulates
      - activates
      - induces
      - stimulates
      - elevates
      - augments
      - potentiates
      - accelerates
      - facilitates
      - drives
      - triggers
      - leads to
      - results in
      - is associated with higher
      - confers
      - produces
    surface_forms:
      - associated with increased
      - results in elevated
      - leads to upregulation of
    broader: []
    narrower: []
    related:
      - CAUSAL_NEGATIVE
      - DIRECTIONALITY
    paraphrase_bridges:
      - claim: "slows aging"
        document: "produces life span extension"
      - claim: "improves diabetes resolution"
        document: "strong association with resolution of T2DM"
      - claim: "cardiac injury is common"
        document: "elevated troponin levels"
      - claim: "favorable clinical response"
        document: "viral load significantly decreased"

  - concept_id: CAUSAL_NEGATIVE
    preferred_label: inhibits
    synonyms:
      - decreases
      - reduces
      - suppresses
      - downregulates
      - blocks
      - impairs
      - attenuates
      - abolishes
      - prevents
      - limits
      - depletes
      - silences
      - knocks out
      - knockout
      - loss of function
      - negatively regulates
      - is associated with lower
    surface_forms:
      - associated with reduced
      - results in decreased
      - leads to downregulation of
      - loss-of-function mutation
    broader: []
    narrower: []
    related:
      - CAUSAL_POSITIVE
      - DIRECTIONALITY
    paraphrase_bridges:
      - claim: "inhibiting glucose-6-phosphate dehydrogenase impairs lipogenesis"
        document: "suppression of 6PGD increased lipogenesis"
        note: "REFUTES — direction flip; bridge flags negation risk"
      - claim: "MVP decreases tumor aggression"
        document: "knockout of MVP inhibits tumor progression"
        note: "REFUTES — cause/effect inversion"
      - claim: "colonization resistance is reduced"
        document: "C. difficile germination and growth facilitated"
      - claim: "low saturated fat has adverse effects"
        document: "neurological development at least as good as control"
        note: "REFUTES — coreference to intervention group"

  - concept_id: DIRECTIONALITY
    preferred_label: directionality
    synonyms:
      - effect direction
      - increase
      - decrease
      - fold change
      - hazard ratio
      - odds ratio
      - relative risk
      - SMD
      - standardized mean difference
      - confidence interval
      - p-value
      - statistically significant
      - dose-dependent
    surface_forms:
      - HR greater than 1
      - p < 0.05
      - p < 0.001
      - 95% CI
    broader: []
    narrower: []
    related:
      - CAUSAL_POSITIVE
      - CAUSAL_NEGATIVE
      - STATISTICS
    paraphrase_bridges:
      - claim: "is associated with higher mean troponin (SMD 0.53)"
        document: "cardiac injury is common in critical cases"
      - claim: "HR of 9.29"
        document: "strong association with resolution of T2DM"

  - concept_id: STATISTICS
    preferred_label: statistical analysis
    synonyms:
      - meta-analysis
      - systematic review
      - randomized controlled trial
      - RCT
      - confidence interval
      - CI
      - p-value
      - significance
      - hazard ratio
      - odds ratio
      - relative risk
      - forest plot
      - Kaplan-Meier
      - multivariate
      - regression
      - bootstrap
    surface_forms:
      - statistically significant
      - mean difference
      - standard deviation
    broader: []
    narrower: []
    related:
      - DIRECTIONALITY
      - EPIDEMIOLOGY

  - concept_id: SPECIFICITY_SHIFT
    preferred_label: specificity
    synonyms:
      - general
      - specific
      - subtype
      - isoform
      - variant
      - analogue
      - homolog
    surface_forms: []
    broader: []
    narrower: []
    related:
      - MUTATION
      - GENOMIC_VARIATION
    paraphrase_bridges:
      - claim: "somatic missense mutations in NT5C2"
        document: "NT5C2 mutant proteins show resistance to chemotherapy"
      - claim: "teaching hospitals provide better care"
        document: "teaching centres prolong survival in gynecological cancer"
      - claim: "near-infrared wavelengths increase penetration depth in fiberoptic confocal microscopy"
        document: "longer wavelength increases penetration depth of OCT"
      - claim: "mitochondria play a major role in calcium homeostasis"
        document: "mitochondria are essential organelles responsible for calcium homeostasis"

  - concept_id: MODEL_SYSTEMS
    preferred_label: model organism
    synonyms:
      - mouse model
      - murine
      - in vivo
      - animal model
      - preclinical
    surface_forms:
      - in vitro
      - cell line
      - xenograft
    broader: []
    narrower: []
    related:
      - CELL_BIOLOGY
      - CANCER
    model_organisms:
      - claim_form: "fruit flies"
        document_form: "Drosophila melanogaster"
        synonyms: ["Drosophila", "adult Drosophila", "D. melanogaster"]
      - claim_form: "mice"
        document_form: "murine"
        synonyms: ["mouse", "Mus musculus", "C57BL/6", "knockout mouse", "transgenic mouse"]
      - claim_form: "rats"
        document_form: "Rattus norvegicus"
        synonyms: ["rat model", "Sprague-Dawley"]
      - claim_form: "worms"
        document_form: "Caenorhabditis elegans"
        synonyms: ["C. elegans", "nematode"]
      - claim_form: "zebrafish"
        document_form: "Danio rerio"
        synonyms: ["zebrafish embryo"]
      - claim_form: "yeast"
        document_form: "Saccharomyces cerevisiae"
        synonyms: ["S. cerevisiae"]
      - claim_form: "cell culture"
        document_form: "in vitro"
        synonyms: ["cell line", "cultured cells", "primary cells"]

