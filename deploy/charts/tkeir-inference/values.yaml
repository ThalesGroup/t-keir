# external | ollama | vllm — all render the existing env contract
mode: external

# Used by sibling charts via umbrella value wiring
provider: ollama
embeddingModel: bge-m3
llmModel: mistral-nemo

external:
  # OpenAI-compatible base URL when mode=external
  openaiBaseUrl: ""
  existingSecret: ""

ollama:
  enabled: false
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 11434
  models:
    - bge-m3
    - mistral-nemo
  resources:
    requests:
      memory: 2Gi
    limits:
      memory: 8Gi

vllm:
  enabled: false
  image:
    repository: vllm/vllm-openai
    tag: latest
  model: mistral-nemo
  gpu: 1
  resources:
    limits:
      nvidia.com/gpu: 1
