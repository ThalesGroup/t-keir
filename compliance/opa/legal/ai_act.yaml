    status: article_fallback
    note: Paragraph 9 boundaries not detected; full Article 25 shown.
  Art.26(1):
    title: Obligations of deployers of high-risk AI systems
    text: 1. Deployers of high-risk AI systems shall take appropriate technical and organisational measures
      to ensure they use such systems in accordance with the instructions for use accompanying the systems,
      pursuant to paragraphs 3 and
    status: paragraph
  Art.26(2):
    title: Obligations of deployers of high-risk AI systems
    text: 2. Deployers shall assign human oversight to natural persons who have the necessary competence,
      training and authority, as well as the necessary support.
    status: paragraph
  Art.27(1):
    title: Fundamental rights impact assessment for high-risk AI systems
    text: "1. Prior to deploying a high-risk AI system referred to in Article 6(2), with the exception\
      \ of high-risk AI systems intended to be used in the area listed in point 2 of Annex III, deployers\
      \ that are bodies governed by public law, or are private entities providing public services, and\
      \ deployers of high-risk AI systems referred to in points 5 (b) and (c) of Annex III, shall perform\
      \ an assessment of the impact on fundamental rights that the use of such system may produce. For\
      \ that purpose, deployers shall perform an assessment consisting of:\n\n (a)\n\n a description of\
      \ the deployer’s processes in which the high-risk AI system will be used in line with its intended\
      \ purpose;\n\n (b)\n\n a description of the period of time within which, and the frequency with\
      \ which, each high-risk AI system is intended to be used;\n\n (c)\n\n the categories of natural\
      \ persons and groups likely to be affected by its use in the specific context;\n\n (d)\n\n the specific\
      \ risks of harm likely to have an impact on the categories of natural persons or groups of persons\
      \ identified pursuant to point (c) of this paragraph, taking into account the information given\
      \ by the provider pursuant to Article 13;\n\n (e)\n\n a description of the implementation of human\
      \ oversight measures, according to the instructions for use;\n\n (f)\n\n the measures to be taken\
      \ in the case of the materialisation of those risks, including the arrangements for internal governance\
      \ and complaint mechanisms."
    status: paragraph
  Art.27(2):
    title: Fundamental rights impact assessment for high-risk AI systems
    text: 2. The obligation laid down in paragraph 1 applies to the first use of the high-risk AI system.
      The deployer may, in similar cases, rely on previously conducted fundamental rights impact assessments
      or existing impact assessments carried out by provider. If, during the use of the high-risk AI system,
      the deployer considers that any of the elements listed in paragraph 1 has changed or is no longer
      up to date, the deployer shall take the necessary steps to update the information.
    status: paragraph
  Art.28:
    title: Notifying authorities
    text: "1. Each Member State shall designate or establish at least one notifying authority responsible\
      \ for setting up and carrying out the necessary procedures for the assessment, designation and notification\
      \ of conformity assessment bodies and for their monitoring. Those procedures shall be developed\
      \ in cooperation between the notifying authorities of all Member States.\n\n 2. Member States may\
      \ decide that the assessment and monitoring referred to in paragraph 1 is to be carried out by a\
      \ national accreditation body within the meaning of, and in accordance with, Regulation (EC) No\
      \ 765/2008.\n\n 3. Notifying authorities shall be established, organised and operated in such a\
      \ way that no conflict of interest arises with conformity assessment bodies, and that the objectivity\
      \ and impartiality of their activities are safeguarded.\n\n 4. Notifying authorities shall be organised\
      \ in such a way that decisions relating to the notification of conformity assessment bodies are\
      \ taken by competent persons different from those who carried out the assessment of those bodies.\n\
      \n 5. Notifying authorities shall offer or provide neither any activities that conformity assessment\
      \ bodies perform, nor any consultancy services on a commercial or competitive basis.\n\n 6. Notifying\
      \ authorities shall safeguard the confidentiality of the information that they obtain, in accordance\
      \ with Article 78.\n\n 7. Notifying authorities shall have an adequate number of competent personnel\
      \ at their disposal for the proper performance of their tasks. Competent personnel shall have the\
      \ necessary expertise, where applicable, for their function, in fields such as information technologies,\
      \ AI and law, including the supervision of fundamental rights."
    status: article
  Art.29(1):
    title: Application of a conformity assessment body for notification
    text: 1. Conformity assessment bodies shall submit an application for notification to the notifying
      authority of the Member State in which they are established.
    status: paragraph
  Art.33:
    title: Subsidiaries of notified bodies and subcontracting
    text: "1. Where a notified body subcontracts specific tasks connected with the conformity assessment\
      \ or has recourse to a subsidiary, it shall ensure that the subcontractor or the subsidiary meets\
      \ the requirements laid down in Article 31, and shall inform the notifying authority accordingly.\n\
      \n 2. Notified bodies shall take full responsibility for the tasks performed by any subcontractors\
      \ or subsidiaries.\n\n 3. Activities may be subcontracted or carried out by a subsidiary only with\
      \ the agreement of the provider. Notified bodies shall make a list of their subsidiaries publicly\
      \ available.\n\n 4. The relevant documents concerning the assessment of the qualifications of the\
      \ subcontractor or the subsidiary and the work carried out by them under this Regulation shall be\
      \ kept at the disposal of the notifying authority for a period of five years from the termination\
      \ date of the subcontracting."
    status: article
  Art.34:
    title: Operational obligations of notified bodies
    text: "1. Notified bodies shall verify the conformity of high-risk AI systems in accordance with the\
      \ conformity assessment procedures set out in Article 43.\n\n 2. Notified bodies shall avoid unnecessary\
      \ burdens for providers when performing their activities, and take due account of the size of the\
      \ provider, the sector in which it operates, its structure and the degree of complexity of the high-risk\
      \ AI system concerned, in particular in view of minimising administrative burdens and compliance\
      \ costs for micro- and small enterprises within the meaning of Recommendation 2003/361/EC. The notified\
      \ body shall, nevertheless, respect the degree of rigour and the level of protection required for\
      \ the compliance of the high-risk AI system with the requirements of this Regulation.\n\n 3. Notified\
      \ bodies shall make available and submit upon request all relevant documentation, including the\
      \ providers’ documentation, to the notifying authority referred to in Article 28 to allow that authority\
      \ to conduct its assessment, designation, notification and monitoring activities, and to facilitate\
      \ the assessment outlined in this Section."
    status: article
  Art.43(1):
    title: Conformity assessment
    text: "1. For high-risk AI systems listed in point 1 of Annex III, where, in demonstrating the compliance\
      \ of a high-risk AI system with the requirements set out in Section 2, the provider has applied\
      \ harmonised standards referred to in Article 40, or, where applicable, common specifications referred\
      \ to in Article 41, the provider shall opt for one of the following conformity assessment procedures\
      \ based on:\n\n (a)\n\n the internal control referred to in Annex VI; or\n\n (b)\n\n the assessment\
      \ of the quality management system and the assessment of the technical documentation, with the involvement\
      \ of a notified body, referred to in Annex VII.\n\n In demonstrating the compliance of a high-risk\
      \ AI system with the requirements set out in Section 2, the provider shall follow the conformity\
      \ assessment procedure set out in Annex VII where:\n\n (a)\n\n harmonised standards referred to\
      \ in Article 40 do not exist, and common specifications referred to in Article 41 are not available;\n\
      \n (b)\n\n the provider has not applied, or has applied only part of, the harmonised standard;\n\
      \n (c)\n\n the common specifications referred to in point (a) exist, but the provider has not applied\
      \ them;\n\n (d)\n\n one or more of the harmonised standards referred to in point (a) has been published\
      \ with a restriction, and only on the part of the standard that was restricted.\n\n For the purposes\
      \ of the conformity assessment procedure referred to in Annex VII, the provider may choose any of\
      \ the notified bodies. However, where the high-risk AI system is intended to be put into service\
      \ by law enforcement, immigration or asylum authorities or by Union institutions, bodies, offices\
      \ or agencies, the market surveillance authority referred to in Article 74(8) or (9), as applicable,\
      \ shall act as a notified body."
    status: paragraph
  Art.43(2):
    title: Conformity assessment
    text: 2. For high-risk AI systems referred to in points 2 to 8 of Annex III, providers shall follow
      the conformity assessment procedure based on internal control as referred to in Annex VI, which
      does not provide for the involvement of a notified body.
    status: paragraph
  Art.43(4):
    title: Conformity assessment
    text: "4. High-risk AI systems that have already been subject to a conformity assessment procedure\
      \ shall undergo a new conformity assessment procedure in the event of a substantial modification,\
      \ regardless of whether the modified system is intended to be further distributed or continues to\
      \ be used by the current deployer.\n\n For high-risk AI systems that continue to learn after being\
      \ placed on the market or put into service, changes to the high-risk AI system and its performance\
      \ that have been pre-determined by the provider at the moment of the initial conformity assessment\
      \ and are part of the information contained in the technical documentation referred to in point\
      \ 2(f) of Annex IV, shall not constitute a substantial modification."
    status: paragraph
  Art.50(1):
    title: Transparency obligations for providers and deployers of certain AI systems
    text: 1. Providers shall ensure that AI systems intended to interact directly with natural persons
      are designed and developed in such a way that the natural persons concerned are informed that they
      are interacting with an AI system, unless this is obvious from the point of view of a natural person
      who is reasonably well-informed, observant and circumspect, taking into account the circumstances
      and the context of use. This obligation shall not apply to AI systems authorised by law to detect,
      prevent, investigate or prosecute criminal offences, subject to appropriate safeguards for the rights
      and freedoms of third parties, unless those systems are available for the public to report a criminal
      offence.
    status: paragraph
  Art.50(2):
    title: Transparency obligations for providers and deployers of certain AI systems
    text: 2. Providers of AI systems, including general-purpose AI systems, generating synthetic audio,
      image, video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable
      format and detectable as artificially generated or manipulated. Providers shall ensure their technical
      solutions are effective, interoperable, robust and reliable as far as this is technically feasible,
      taking into account the specificities and limitations of various types of content, the costs of
      implementation and the generally acknowledged state of the art, as may be reflected in relevant
      technical standards. This obligation shall not apply to the extent the AI systems perform an assistive
      function for standard editing or do not substantially alter the input data provided by the deployer
      or the semantics thereof, or where authorised by law to detect, prevent, investigate or prosecute
      criminal offences.
    status: paragraph
  Art.50(3):
    title: Transparency obligations for providers and deployers of certain AI systems
    text: 3. Deployers of an emotion recognition system or a biometric categorisation system shall inform
      the natural persons exposed thereto of the operation of the system, and shall process the personal
      data in accordance with Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680,
      as applicable. This obligation shall not apply to AI systems used for biometric categorisation and
      emotion recognition, which are permitted by law to detect, prevent or investigate criminal offences,
      subject to appropriate safeguards for the rights and freedoms of third parties, and in accordance
      with Union law.
    status: paragraph
  Art.50(4):
    title: Transparency obligations for providers and deployers of certain AI systems
    text: "4. Deployers of an AI system that generates or manipulates image, audio or video content constituting\
      \ a deep fake, shall disclose that the content has been artificially generated or manipulated. This\
      \ obligation shall not apply where the use is authorised by law to detect, prevent, investigate\
      \ or prosecute criminal offence. Where the content forms part of an evidently artistic, creative,\
      \ satirical, fictional or analogous work or programme, the transparency obligations set out in this\
      \ paragraph are limited to disclosure of the existence of such generated or manipulated content\
      \ in an appropriate manner that does not hamper the display or enjoyment of the work.\n\n Deployers\
      \ of an AI system that generates or manipulates text which is published with the purpose of informing\
      \ the public on matters of public interest shall disclose that the text has been artificially generated\
      \ or manipulated. This obligation shall not apply where the use is authorised by law to detect,\
      \ prevent, investigate or prosecute criminal offences or where the AI-generated content has undergone\
      \ a process of human review or editorial control and where a natural or legal person holds editorial\
      \ responsibility for the publication of the content."
    status: paragraph
  Art.53(1)(a):
    title: Obligations for providers of general-purpose AI models
    text: (a) draw up and keep up-to-date the technical documentation of the model, including its training
      and testing process and the results of its evaluation, which shall contain, at a minimum, the information
      set out in Annex XI for the purpose of providing it, upon request, to the AI Office and the national
      competent authorities;
    status: point
  Art.53(1)(b):
    title: Obligations for providers of general-purpose AI models
    text: '(b) draw up, keep up-to-date and make available information and documentation to providers
      of AI systems who intend to integrate the general-purpose AI model into their AI systems. Without
      prejudice to the need to observe and protect intellectual property rights and confidential business
      information or trade secrets in accordance with Union and national law, the information and documentation
      shall:'
    status: point
  Art.53(1)(c):
    title: Obligations for providers of general-purpose AI models
    text: (c) put in place a policy to comply with Union law on copyright and related rights, and in particular
      to identify and comply with, including through state-of-the-art technologies, a reservation of rights
      expressed pursuant to Article 4(3) of Directive (EU) 2019/790;
    status: point
  Art.53(1)(d):
    title: Obligations for providers of general-purpose AI models
    text: (d) draw up and make publicly available a sufficiently detailed summary about the content used
      for training of the general-purpose AI model, according to a template provided by the AI Office.
    status: point
  Art.53(2):
    title: Obligations for providers of general-purpose AI models
    text: 2. The obligations set out in paragraph 1, points (a) and (b), shall not apply to providers
      of AI models that are released under a free and open-source licence that allows for the access,
      usage, modification, and distribution of the model, and whose parameters, including the weights,
      the information on the model architecture, and the information on model usage, are made publicly
      available. This exception shall not apply to general-purpose AI models with systemic risks.
    status: paragraph
  Art.54:
    title: Authorised representatives of providers of general-purpose AI models
    text: "1. Prior to placing a general-purpose AI model on the Union market, providers established in\
      \ third countries shall, by written mandate, appoint an authorised representative which is established\
      \ in the Union.\n\n 2. The provider shall enable its authorised representative to perform the tasks\
      \ specified in the mandate received from the provider.\n\n 3. The authorised representative shall\
      \ perform the tasks specified in the mandate received from the provider. It shall provide a copy\
      \ of the mandate to the AI Office upon request, in one of the official languages of the institutions\
      \ of the Union. For the purposes of this Regulation, the mandate shall empower the authorised representative\
      \ to carry out the following tasks:\n\n (a)\n\n verify that the technical documentation specified\
      \ in Annex XI has been drawn up and all obligations referred to in Article 53 and, where applicable,\
      \ Article 55 have been fulfilled by the provider;\n\n (b)\n\n keep a copy of the technical documentation\
      \ specified in Annex XI at the disposal of the AI Office and national competent authorities, for\
      \ a period of 10 years after the general-purpose AI model has been placed on the market, and the\
      \ contact details of the provider that appointed the authorised representative;\n\n (c)\n\n provide\
      \ the AI Office, upon a reasoned request, with all the information and documentation, including\
      \ that referred to in point (b), necessary to demonstrate compliance with the obligations in this\
      \ Chapter;\n\n (d)\n\n cooperate with the AI Office and competent authorities, upon a reasoned request,\
      \ in any action they take in relation to the general-purpose AI model, including when the model\
      \ is integrated into AI systems placed on the market or put into service in the Union.\n\n 4. The\
      \ mandate shall empower the authorised representative to be addressed, in addition to or instead\
      \ of the provider, by the AI Office or the competent authorities, on all issues related to ensuring\
      \ compliance with this Regulation.\n\n 5. The authorised representative shall terminate the mandate\
      \ if it considers or has reason to consider the provider to be acting contrary to its obligations\
      \ pursuant to this Regulation. In such a case, it shall also immediately inform the AI Office about\
      \ the termination of the mandate and the reasons therefor.\n\n 6. The obligation set out in this\
      \ Article shall not apply to providers of general-purpose AI models that are released under a free\
      \ and open-source licence that allows for the access, usage, modification, and distribution of the\
      \ model, and whose parameters, including the weights, the information on the model architecture,\
      \ and the information on model usage, are made publicly available, unless the general-purpose AI\
      \ models present systemic risks.\n\n SECTION 3\n\n Obligations of providers of general-purpose AI\
      \ models with systemic risk"
    status: article
  Art.55(1)(a):
    title: Obligations of providers of general-purpose AI models with systemic risk
    text: (a) perform model evaluation in accordance with standardised protocols and tools reflecting
      the state of the art, including conducting and documenting adversarial testing of the model with
      a view to identifying and mitigating systemic risks;
    status: point
  Art.55(1)(b):
    title: Obligations of providers of general-purpose AI models with systemic risk
    text: (b) assess and mitigate possible systemic risks at Union level, including their sources, that
      may stem from the development, the placing on the market, or the use of general-purpose AI models
      with systemic risk;
    status: point
  Art.55(1)(c):
    title: Obligations of providers of general-purpose AI models with systemic risk
    text: (c) keep track of, document, and report, without undue delay, to the AI Office and, as appropriate,
      to national competent authorities, relevant information about serious incidents and possible corrective
      measures to address them;
    status: point
  Art.55(1)(d):
    title: Obligations of providers of general-purpose AI models with systemic risk
    text: (d) ensure an adequate level of cybersecurity protection for the general-purpose AI model with
      systemic risk and the physical infrastructure of the model.
    status: point
  Art.55(2):
    title: Obligations of providers of general-purpose AI models with systemic risk
    text: 2. Providers of general-purpose AI models with systemic risk may rely on codes of practice within
      the meaning of Article 56 to demonstrate compliance with the obligations set out in paragraph 1
      of this Article, until a harmonised standard is published. Compliance with European harmonised standards
      grants providers the presumption of conformity to the extent that those standards cover those obligations.
      Providers of general-purpose AI models with systemic risks who do not adhere to an approved code
      of practice or do not comply with a European harmonised standard shall demonstrate alternative adequate
      means of compliance for assessment by the Commission.
    status: paragraph
  Art.72:
    title: Post-market monitoring by providers and post-market monitoring plan for high-risk AI systems
    text: "1. Providers shall establish and document a post-market monitoring system in a manner that\
      \ is proportionate to the nature of the AI technologies and the risks of the high-risk AI system.\n\
      \n 2. The post-market monitoring system shall actively and systematically collect, document and\
      \ analyse relevant data which may be provided by deployers or which may be collected through other\
      \ sources on the performance of high-risk AI systems throughout their lifetime, and which allow\
      \ the provider to evaluate the continuous compliance of AI systems with the requirements set out\
      \ in Chapter III, Section 2. Where relevant, post-market monitoring shall include an analysis of\
      \ the interaction with other AI systems. This obligation shall not cover sensitive operational data\
      \ of deployers which are law-enforcement authorities.\n\n 3. The post-market monitoring system shall\
      \ be based on a post-market monitoring plan. The post-market monitoring plan shall be part of the\
      \ technical documentation referred to in Annex IV. The Commission shall adopt an implementing act\
      \ laying down detailed provisions establishing a template for the post-market monitoring plan and\
      \ the list of elements to be included in the plan by 2 February 2026. That implementing act shall\
      \ be adopted in accordance with the examination procedure referred to in Article 98(2).\n\n 4. For\
      \ high-risk AI systems covered by the Union harmonisation legislation listed in Section A of Annex\
      \ I, where a post-market monitoring system and plan are already established under that legislation,\
      \ in order to ensure consistency, avoid duplications and minimise additional burdens, providers\
      \ shall have a choice of integrating, as appropriate, the necessary elements described in paragraphs\
      \ 1, 2 and 3 using the template referred in paragraph 3 into systems and plans already existing\
      \ under that legislation, provided that it achieves an equivalent level of protection.\n\n The first\
      \ subparagraph of this paragraph shall also apply to high-risk AI systems referred to in point 5\
      \ of Annex III placed on the market or put into service by financial institutions that are subject\
      \ to requirements under Union financial services law regarding their internal governance, arrangements\
      \ or processes.\n\n SECTION 2\n\n Sharing of information on serious incidents"
    status: article
  Art.73:
    title: Reporting of serious incidents
    text: "1. Providers of high-risk AI systems placed on the Union market shall report any serious incident\
      \ to the market surveillance authorities of the Member States where that incident occurred.\n\n\
      \ 2. The report referred to in paragraph 1 shall be made immediately after the provider has established\
      \ a causal link between the AI system and the serious incident or the reasonable likelihood of such\
      \ a link, and, in any event, not later than 15 days after the provider or, where applicable, the\
      \ deployer, becomes aware of the serious incident.\n\n The period for the reporting referred to\
      \ in the first subparagraph shall take account of the severity of the serious incident.\n\n 3. Notwithstanding\
      \ paragraph 2 of this Article, in the event of a widespread infringement or a serious incident as\
      \ defined in Article 3, point (49)(b), the report referred to in paragraph 1 of this Article shall\
      \ be provided immediately, and not later than two days after the provider or, where applicable,\
      \ the deployer becomes aware of that incident.\n\n 4. Notwithstanding paragraph 2, in the event\
      \ of the death of a person, the report shall be provided immediately after the provider or the deployer\
      \ has established, or as soon as it suspects, a causal relationship between the high-risk AI system\
      \ and the serious incident, but not later than 10 days after the date on which the provider or,\
      \ where applicable, the deployer becomes aware of the serious incident.\n\n 5. Where necessary to\
      \ ensure timely reporting, the provider or, where applicable, the deployer, may submit an initial\
      \ report that is incomplete, followed by a complete report.\n\n 6. Following the reporting of a\
      \ serious incident pursuant to paragraph 1, the provider shall, without delay, perform the necessary\
      \ investigations in relation to the serious incident and the AI system concerned. This shall include\
      \ a risk assessment of the incident, and corrective action.\n\n The provider shall cooperate with\
      \ the competent authorities, and where relevant with the notified body concerned, during the investigations\
      \ referred to in the first subparagraph, and shall not perform any investigation which involves\
      \ altering the AI system concerned in a way which may affect any subsequent evaluation of the causes\
      \ of the incident, prior to informing the competent authorities of such action.\n\n 7. Upon receiving\
      \ a notification related to a serious incident referred to in Article 3, point (49)(c), the relevant\
      \ market surveillance authority shall inform the national public authorities or bodies referred\
      \ to in Article 77(1). The Commission shall develop dedicated guidance to facilitate compliance\
      \ with the obligations set out in paragraph 1 of this Article. That guidance shall be issued by\
      \ 2 August 2025, and shall be assessed regularly.\n\n 8. The market surveillance authority shall\
      \ take appropriate measures, as provided for in Article 19 of Regulation (EU) 2019/1020, within\
      \ seven days from the date it received the notification referred to in paragraph 1 of this Article,\
      \ and shall follow the notification procedures as provided in that Regulation.\n\n 9. For high-risk\
      \ AI systems referred to in Annex III that are placed on the market or put into service by providers\
      \ that are subject to Union legislative instruments laying down reporting obligations equivalent\
      \ to those set out in this Regulation, the notification of serious incidents shall be limited to\
      \ those referred to in Article 3, point (49)(c).\n\n 10. For high-risk AI systems which are safety\
      \ components of devices, or are themselves devices, covered by Regulations (EU) 2017/745 and (EU)\
      \ 2017/746, the notification of serious incidents shall be limited to those referred to in Article\
      \ 3, point (49)(c) of this Regulation, and shall be made to the national competent authority chosen\
      \ for that purpose by the Member States where the incident occurred.\n\n 11. National competent\
      \ authorities shall immediately notify the Commission of any serious incident, whether or not they\
      \ have taken action on it, in accordance with Article 20 of Regulation (EU) 2019/1020.\n\n SECTION\
      \ 3\n\n Enforcement"
    status: article
