name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python / uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Quality gate
        run: make ci

      - name: Changelog
        run: make changelog || true

      - name: Evidence pack
        run: |
          make audit-evidence
          make annex-iv

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CHANGELOG.md
            reports/evidence/**/*
            reports/compliance/annex-iv/**/*
            reports/bom/**/*
            reports/security/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
