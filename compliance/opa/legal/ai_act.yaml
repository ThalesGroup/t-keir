    note: Point (e) not isolated; full paragraph 3 shown.
  Art.14(4):
    title: Human oversight
    text: "4. For the purpose of implementing paragraphs 1, 2 and 3, the high-risk AI system shall be\
      \ provided to the deployer in such a way that natural persons to whom human oversight is assigned\
      \ are enabled, as appropriate and proportionate:\n\n (a)\n\n to properly understand the relevant\
      \ capacities and limitations of the high-risk AI system and be able to duly monitor its operation,\
      \ including in view of detecting and addressing anomalies, dysfunctions and unexpected performance;\n\
      \n (b)\n\n to remain aware of the possible tendency of automatically relying or over-relying on\
      \ the output produced by a high-risk AI system (automation bias), in particular for high-risk AI\
      \ systems used to provide information or recommendations for decisions to be taken by natural persons;\n\
      \n (c)\n\n to correctly interpret the high-risk AI system’s output, taking into account, for example,\
      \ the interpretation tools and methods available;\n\n (d)\n\n to decide, in any particular situation,\
      \ not to use the high-risk AI system or to otherwise disregard, override or reverse the output of\
      \ the high-risk AI system;\n\n (e)\n\n to intervene in the operation of the high-risk AI system\
      \ or interrupt the system through a ‘stop’ button or a similar procedure that allows the system\
      \ to come to a halt in a safe state."
    status: paragraph
  Art.14(5):
    title: Human oversight
    text: "5. For high-risk AI systems referred to in point 1(a) of Annex III, the measures referred to\
      \ in paragraph 3 of this Article shall be such as to ensure that, in addition, no action or decision\
      \ is taken by the deployer on the basis of the identification resulting from the system unless that\
      \ identification has been separately verified and confirmed by at least two natural persons with\
      \ the necessary competence, training and authority.\n\n The requirement for a separate verification\
      \ by at least two natural persons shall not apply to high-risk AI systems used for the purposes\
      \ of law enforcement, migration, border control or asylum, where Union or national law considers\
      \ the application of this requirement to be disproportionate."
    status: paragraph
  Art.15(1):
    title: Accuracy, robustness and cybersecurity
    text: 1. High-risk AI systems shall be designed and developed in such a way that they achieve an appropriate
      level of accuracy, robustness, and cybersecurity, and that they perform consistently in those respects
      throughout their lifecycle.
    status: paragraph
  Art.15(2):
    title: Accuracy, robustness and cybersecurity
    text: 2. To address the technical aspects of how to measure the appropriate levels of accuracy and
      robustness set out in paragraph 1 and any other relevant performance metrics, the Commission shall,
      in cooperation with relevant stakeholders and organisations such as metrology and benchmarking authorities,
      encourage, as appropriate, the development of benchmarks and measurement methodologies.
    status: paragraph
  Art.15(3):
    title: Accuracy, robustness and cybersecurity
    text: 3. The levels of accuracy and the relevant accuracy metrics of high-risk AI systems shall be
      declared in the accompanying instructions of use.
    status: paragraph
  Art.15(4):
    title: Accuracy, robustness and cybersecurity
    text: "4. High-risk AI systems shall be as resilient as possible regarding errors, faults or inconsistencies\
      \ that may occur within the system or the environment in which the system operates, in particular\
      \ due to their interaction with natural persons or other systems. Technical and organisational measures\
      \ shall be taken in this regard.\n\n The robustness of high-risk AI systems may be achieved through\
      \ technical redundancy solutions, which may include backup or fail-safe plans.\n\n High-risk AI\
      \ systems that continue to learn after being placed on the market or put into service shall be developed\
      \ in such a way as to eliminate or reduce as far as possible the risk of possibly biased outputs\
      \ influencing input for future operations (feedback loops), and as to ensure that any such feedback\
      \ loops are duly addressed with appropriate mitigation measures."
    status: paragraph
  Art.15(5):
    title: Accuracy, robustness and cybersecurity
    text: "5. High-risk AI systems shall be resilient against attempts by unauthorised third parties to\
      \ alter their use, outputs or performance by exploiting system vulnerabilities.\n\n The technical\
      \ solutions aiming to ensure the cybersecurity of high-risk AI systems shall be appropriate to the\
      \ relevant circumstances and the risks.\n\n The technical solutions to address AI specific vulnerabilities\
      \ shall include, where appropriate, measures to prevent, detect, respond to, resolve and control\
      \ for attacks trying to manipulate the training data set (data poisoning), or pre-trained components\
      \ used in training (model poisoning), inputs designed to cause the AI model to make a mistake (adversarial\
      \ examples or model evasion), confidentiality attacks or model flaws.\n\n SECTION 3\n\n Obligations\
      \ of providers and deployers of high-risk AI systems and other parties"
    status: paragraph
  Art.16(a):
    title: Obligations of providers of high-risk AI systems
    text: "Providers of high-risk AI systems shall:\n\n (a)\n\n ensure that their high-risk AI systems\
      \ are compliant with the requirements set out in Section 2;\n\n (b)\n\n indicate on the high-risk\
      \ AI system or, where that is not possible, on its packaging or its accompanying documentation,\
      \ as applicable, their name, registered trade name or registered trade mark, the address at which\
      \ they can be contacted;\n\n (c)\n\n have a quality management system in place which complies with\
      \ Article 17;\n\n (d)\n\n keep the documentation referred to in Article 18;\n\n (e)\n\n when under\
      \ their control, keep the logs automatically generated by their high-risk AI systems as referred\
      \ to in Article 19;\n\n (f)\n\n ensure that the high-risk AI system undergoes the relevant conformity\
      \ assessment procedure as referred to in Article 43, prior to its being placed on the market or\
      \ put into service;\n\n (g)\n\n draw up an EU declaration of conformity in accordance with Article\
      \ 47;\n\n (h)\n\n affix the CE marking to the high-risk AI system or, where that is not possible,\
      \ on its packaging or its accompanying documentation, to indicate conformity with this Regulation,\
      \ in accordance with Article 48;\n\n (i)\n\n comply with the registration obligations referred to\
      \ in Article 49(1);\n\n (j)\n\n take the necessary corrective actions and provide information as\
      \ required in Article 20;\n\n (k)\n\n upon a reasoned request of a national competent authority,\
      \ demonstrate the conformity of the high-risk AI system with the requirements set out in Section\
      \ 2;\n\n (l)\n\n ensure that the high-risk AI system complies with accessibility requirements in\
      \ accordance with Directives (EU) 2016/2102 and (EU) 2019/882."
    status: article
