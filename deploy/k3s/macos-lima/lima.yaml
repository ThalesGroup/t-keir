# Lima template for macOS → Ubuntu VM → hardened K3s + Cilium.
# Cilium requires Linux eBPF; it cannot run against the macOS kernel.
#
# Usage:
#   limactl start --name=tkeir-k3s deploy/k3s/macos-lima/lima.yaml
#   make lima-k3s-up
#
# vmType: vz (Apple Virtualization) preferred on Apple Silicon.
vmType: vz
arch: aarch64
cpus: 4
memory: "8GiB"
disk: "60GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

mounts:
  - location: "~"
    writable: false
  - location: "/tmp/tkeir-lima"
    writable: true

ports:
  - guestPort: 6443
    hostPort: 6443
  - guestPort: 80
    hostPort: 8088
  - guestPort: 443
    hostPort: 8443

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      apt-get update -y
      apt-get install -y curl ca-certificates
      # Host Ollama (Metal) is reachable at host.lima.internal:11434
      echo "Host gateway for Ollama: host.lima.internal:11434"
