  Art.13(1):
    title: Transparency and provision of information to deployers
    text: 1. High-risk AI systems shall be designed and developed in such a way as to ensure that their
      operation is sufficiently transparent to enable deployers to interpret a system’s output and use
      it appropriately. An appropriate type and degree of transparency shall be ensured with a view to
      achieving compliance with the relevant obligations of the provider and deployer set out in Section
    status: paragraph
  Art.13(2):
    title: Transparency and provision of information to deployers
    text: 2. High-risk AI systems shall be accompanied by instructions for use in an appropriate digital
      format or otherwise that include concise, complete, correct and clear information that is relevant,
      accessible and comprehensible to deployers.
    status: paragraph
  Art.13(3)(a):
    title: Transparency and provision of information to deployers
    text: (a) the identity and the contact details of the provider and, where applicable, of its authorised
      representative;
    status: point
  Art.13(3)(b):
    title: Transparency and provision of information to deployers
    text: '(b) the characteristics, capabilities and limitations of performance of the high-risk AI system,
      including:'
    status: point
  Art.13(3)(c):
    title: Transparency and provision of information to deployers
    text: (c) the changes to the high-risk AI system and its performance which have been pre-determined
      by the provider at the moment of the initial conformity assessment, if any;
    status: point
  Art.13(3)(d):
    title: Transparency and provision of information to deployers
    text: (d) the human oversight measures referred to in Article 14, including the technical measures
      put in place to facilitate the interpretation of the outputs of the high-risk AI systems by the
      deployers;
    status: point
  Art.13(3)(e):
    title: Transparency and provision of information to deployers
    text: (e) the computational and hardware resources needed, the expected lifetime of the high-risk
      AI system and any necessary maintenance and care measures, including their frequency, to ensure
      the proper functioning of that AI system, including as regards software updates;
    status: point
  Art.14(1):
    title: Human oversight
    text: 1. High-risk AI systems shall be designed and developed in such a way, including with appropriate
      human-machine interface tools, that they can be effectively overseen by natural persons during the
      period in which they are in use.
    status: paragraph
  Art.14(2):
    title: Human oversight
    text: 2. Human oversight shall aim to prevent or minimise the risks to health, safety or fundamental
      rights that may emerge when a high-risk AI system is used in accordance with its intended purpose
      or under conditions of reasonably foreseeable misuse, in particular where such risks persist despite
      the application of other requirements set out in this Section.
    status: paragraph
  Art.14(3)(a):
    title: Human oversight
    text: (a) measures identified and built, when technically feasible, into the high-risk AI system by
      the provider before it is placed on the market or put into service;
    status: point
  Art.14(3)(b):
    title: Human oversight
    text: (b) measures identified by the provider before placing the high-risk AI system on the market
      or putting it into service and that are appropriate to be implemented by the deployer.
    status: point
  Art.14(3)(c):
    title: Human oversight
    text: "3. The oversight measures shall be commensurate with the risks, level of autonomy and context\
      \ of use of the high-risk AI system, and shall be ensured through either one or both of the following\
      \ types of measures:\n\n (a)\n\n measures identified and built, when technically feasible, into\
      \ the high-risk AI system by the provider before it is placed on the market or put into service;\n\
      \n (b)\n\n measures identified by the provider before placing the high-risk AI system on the market\
      \ or putting it into service and that are appropriate to be implemented by the deployer."
