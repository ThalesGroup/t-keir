# RAG API runtime configuration (retrieval UI and ontology export).
# Keep ontology.min_keyword_length aligned with keywords.yaml → min-keyword-length.
#
# Model resolution for search/index (highest wins):
#   1. environment variables (PROVIDER, EMBEDDING_MODEL, LLM_MODEL,
#      RERANKER_MODEL, RERANK_STRATEGY, EMBEDDING_DIM)
#   2. models: / search.rerank.strategy below
#   3. provider hard-coded defaults in thot.core.LlmWrapper
#
# Vespa endpoints / timeouts (highest wins):
#   1. VESPA_URL, VESPA_CONFIG_URL, VESPA_TIMEOUT_SECONDS
#   2. vespa: block below
#   3. http://localhost:8080 / :19071 / 60s

vespa:
  url: http://localhost:8080
  config_url: http://localhost:19071
  timeout_seconds: 60
  # Auth-off / CLI fallback. Live API/ingest resolve from Keycloak JWT
  # (preferred_username → email → sub); see thot.tools.search.user_space.
  user_space: dev@tkeir
  # Concurrency notes:
  # - Embeddings are always serialized (Ollama stalls under parallel embed).
  # - BEIR index/retrieve is always sequential (shared NLP pipeline).
  # - index/chunk workers parallelize Vespa HTTP after embeds are ready.
  # - enrich_workers parallelize parent-document fetches after search.
  concurrency:
    index_workers: 2      # parallel pipeline JSON files (embeds still serial)
    chunk_workers: 4      # parallel Vespa chunk upserts within a document
    query_workers: 1      # reserved; BEIR multi-query stays sequential
    enrich_workers: 8     # parallel parent-document fetches after search

models:
  # provider: ollama
  embedding_model: bge-m3
  llm_model: mistral-nemo
  # HuggingFace CrossEncoder id for strategy=cross_encoder
  # (sentence-transformers). Unused when strategy=embedding_cosine.
  reranker_model: BAAI/bge-reranker-v2-m3
  embedding_dim: 384

ontology:
  # Minimum number of characters for a keyword label exposed in the HMI/RAG API.
  min_keyword_length: 3
  max_entities: 120
  max_keywords: 60

prompt:
  # chunk_excerpts: copy retrieved chunk text into the LLM prompt (default).
  # svo_ontology: KEY PASSAGES + deduplicated SVO facts (no raw chunk excerpts).
  chunk_context_mode: svo_ontology
  max_svo_triples: 80
  # KEY PASSAGES injected into the LLM prompt (proximity-ranked windows).
  passages:
    count: 5              # number of passages
    max_chars: 1800       # max characters per passage
    context_sentences: 2  # neighbor sentences around the best window
  # Chunk excerpts (chunk_excerpts mode) and prompt chunk filtering.
  max_chars_per_chunk: 1800
  max_chunks_for_prompt: 10

search:
  # When enabled, raw queries are analyzed with the full NLP pipeline and the
  # Vespa request is built by QueryAnalyzerTask instead of query_refiner only.
  enabled: true
  use_chunk_embedding: true
  use_question_embedding: true
  use_text_raw: true
  use_parent_content: true
  use_parent_title: true
  use_ner: true
  use_svo: true
  use_keywords: true
  use_lemmas: true
  # auto → QueryAnalyzer picks hybrid_semantic / hybrid_lexical / hybrid_2_level
  # from structural NLP signals (no language word lists).
  ranking_profile: auto
  hits: 20
  max_yql_terms: 48
  # Informational weights aligned with chunk.sd hybrid_2_level rank profile.
  weight_chunk_embedding: 0.38
  weight_question_embedding: 0.17
  weight_text_raw_bm25: 0.28
  weight_parent_content_bm25: 0.17
  weight_parent_title_bm25: 0.12
  # Second-stage rerank via UnifiedLLMWrapper.rerank
  # strategy: cross_encoder | embedding_cosine
  rerank:
    enabled: true
    strategy: cross_encoder
    # First-stage Vespa hits sent to the reranker (truncated to search.hits after).
    candidates: 50
