name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: make ci-deps

      - name: Secret scan
        run: make check-secrets

      - name: Verify lockfile
        run: make verify-lockfile

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test-unit

      - name: Coverage gate
        run: make coverage

      - name: License check
        run: make liccheck

      - name: Complexity gate
        run: make complexity

      - name: Docs build
        run: make docs-build

  hmi-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tkeir-hmi/package-lock.json

      - name: Install HMI dependencies
        run: make hmi-install

      - name: HMI lint
        run: make hmi-lint

      - name: HMI typecheck
        run: make hmi-typecheck

      - name: HMI build
        run: make hmi-build
