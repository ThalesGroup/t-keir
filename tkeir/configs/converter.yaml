logger:
  logging-level: info
converter:
  settings:
    output:
      zip: true
    ocr:
      enabled: true
      mode: tesseract
      languages: eng+fra+deu+spa+ita+nld+por+pol+ara
      min-image-pixels: 65536
      min-page-text-chars: 40
      render-dpi: 200
      analyze-images: true
      captions: true
      max-embedded-images: 256
      max-pdf-images-per-page: 32
