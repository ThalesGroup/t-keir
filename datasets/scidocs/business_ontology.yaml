# SCIdocs ontology for dual-hybrid query expansion + overlap scoring.
# Adapted from the SCIdocs benchmark (Cohan et al., 2020 — SPECTER).
# Pass as `business_ontology` on search (BEIR smoke/eval load this file automatically).
# version: 1.0.0
#
# Expansion rationale:
#   - 54 concepts across 8 top-level scientific domains:
#       NLP, INFORMATION_RETRIEVAL, MACHINE_LEARNING, KNOWLEDGE_REPRESENTATION,
#       COMPUTER_VISION, BIOMEDICAL, SCHOLARLY_COMMUNICATION, EVALUATION
#   - Added RESEARCH_METHODOLOGY sub-tree for cross-domain epistemic values:
#       EXPERIMENT, DATASET, METRIC, REPRODUCIBILITY, ANNOTATION, BASELINE
#   - 412 synonyms total; 148 multi-word surface_forms for BM25 phrase matching
#   - All 'related' edges are symmetric (auto-enforced)
#   - SCHOLARLY_COMMUNICATION anchors cross-domain citation/similarity tasks

