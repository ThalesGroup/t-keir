# SPIRE server configuration for T-KEIR (ADR-0008).
# Standalone trust domain: tkeir.local (server is its own root CA).

server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "tkeir.local"
    data_dir = "/run/spire/data/server"
    log_level = "INFO"
    ca_subject = {
        country = ["FR"]
        organization = ["T-KEIR"]
        common_name = "tkeir.local"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }
}
